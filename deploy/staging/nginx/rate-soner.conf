# Rate-soner (PR-009b v3 §3 / klarsignal V3) — http-kontekst, lastes fra
# conf.d FØR site-blokkene. To SEPARATE soner: OIDC-rutene bruker KUN sin
# egen, den generelle gjelder dem ALDRI (ellers ville den strammere blitt
# meningsløs eller den generelle utløst først).
#
# Generell: 600 r/m per IP — høyt nok til et bedriftsnett bak NAT (den
# «grove brems» v2 kalte den var 60, som ville blokkert et helt kontor;
# reviewen traff, hevet til 600). Transportvern, ikke misbruksgrense —
# PR-010 eier per-identitet/per-transaksjon.
limit_req_zone $binary_remote_addr zone=disponit_general:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=disponit_oidc:10m    rate=120r/m;

# #173 (Codex P1): kandidatlagrenes skrivevei er en STRØM, ikke trafikk.
# Kroppsgrensen på de to rutene ble hevet, men de sto igjen i
# `disponit_general` — 600 r/m med burst 100, altså 10 r/s. En arbeider
# som strømmer små dokumenter fortere enn det tømmer bursten og får
# nginx' 429 lenge før appens egen 50 000/min-bøtte er i nærheten. Og et
# 429 her er ikke en bremset forespørsel: `lever` leser 4xx som
# TERMINALT, `kjor_bunt` feller HELE evalueringen som
# `kandidatlagring_feilet`. Samme klasse som 413-en på kroppsgrensen —
# ingressen felte den eneste kjøringen rutene finnes for, ikke misbruk.
#
# Taket er appens eget, ikke et nytt tall: `KANDIDATDATA_RATE_PER_MIN`
# er 2 * (20 000 filer + 5 000 kandidater) = 50 000/min, buntens
# dokumenterte maksima med modulens retrykjede innregnet (§4). Ingressen
# skal ikke være strammere enn budsjettet appen selv håndhever — samme
# prinsipp som `client_max_body_size` mot `RUTEKROPPSGRENSER`. Bindingen
# er `test_nginx_kandidatrutene_faar_sin_egen_ratesone`.
#
# Fortsatt en grense, og fortsatt per IP: veien er modultokenbundet og
# claim-bundet, appbøtta står bak den, og et misbruk uten claim faller
# på `kandidatdata_avvist` uansett. Egen sone og ikke en heving av den
# generelle — å løfte `disponit_general` til 50 000 r/m ville fjernet
# transportvernet for HELE flaten for å slippe fram to ruter.
limit_req_zone $binary_remote_addr zone=disponit_kandidatdata:10m rate=50000r/m;

# Callback-redaksjon (v2 §5): eget log_format som FORBYR $request,
# $request_uri, $args, cookies, Authorization og Referer. Bare metode +
# normalisert $uri (sti uten query) + status.
log_format disponit_callback '$remote_addr [$time_iso8601] '
                             '"$request_method $uri" $status $body_bytes_sent';
# Hovedformat: heller ikke her $request/$request_uri/$args — en beslutnings-
# id i en query et annet sted skal heller ikke havne i access-loggen.
log_format disponit_main '$remote_addr [$time_iso8601] '
                         '"$request_method $uri" $status $body_bytes_sent '
                         '"$http_user_agent"';
# #162 (Codex P2): opplastingsruten bærer reservasjonens ENGANGS-JTI i selve
# stien, så $uri er her en hemmelighet — `disponit_main` ville skrevet hver
# utstedte reservasjon i klartekst til disponit-access.log, der den som kan
# lese loggen og har en tenant-sesjon med `bestilling:opprett` kunne
# forbrukt den før klienten. Stien er derfor en KONSTANT etikett; alt annet
# er som hovedformatet, så ruten ikke mister observerbarhet.
log_format disponit_opplast '$remote_addr [$time_iso8601] '
                            '"$request_method /v1/inndata/opplast/[jti]" '
                            '$status $body_bytes_sent "$http_user_agent"';
