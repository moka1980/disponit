      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m12-suite-v1-20261119T091536Z.json
    artefakt_sha256: f9b7808adf5cf5b7c94861017c662914c04fc337bca97a506c397bb659bb3c9d
    notat: >-
      5556 tester, 0 feilet, 0 hoppet; modulens andel 38 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m12_fasit.py`:
    #
    # M-12s fasitsett: fem tilganger i to tenanter med KJENT dom.
    #
    # Tilgangsregisteret har fire funntyper, alle på `tilgang_id`. Sveipen
    # kan i v1 bare reise én av dem, `gjennomgang_utlopt`. De tre andre er
    # utelukket av skjemaet (se `UNAABARE`).
    #
    #   tenant A
    #     1. `gjennomgang_utlopt` — opprettet for 400 døgn siden, frist 1 døgn
    #     2. (ren)                — som 1; GJENNOMGÅS mellom kjøringene
    #     3. (ok)                 — registrert i dag gjennom døra, frist 365
    #   tenant B
    #     4. `gjennomgang_utlopt` — samme regel i en annen tenant
    #     5. (ok)                 — som 3
    #
    # BAKDATERINGEN SKJER VED INNSETTINGEN, som eieren — og det er ikke en
    # snarvei. `opprettet_dato` er DEFAULT current_date, døra tar ingen dato,
    # og vakten fryser kolonnen. Den eneste veien registeret tillater til en
    # tilgang som er gammel, er å bli født gammel; testsuitens `_forfalt` går
    # samme vei og begrunner det samme sted. Tilstanden er heller ikke
    # kunstig: den oppstår av seg selv i drift, når tiden går.
    #
    # De bakdaterte radene går derfor UTENOM evidenskjeden. Det er riktig:
    # de simulerer en registrering som skjedde for 400 døgn siden, og den
    # ville hatt sin hendelse den gang. Evidensen som måles er dørenes egen —
    # objektene, tilgangene registrert i dag, og gjennomgangen som renser.
    #
    # Eieren må være et aktivt medlem; medlemskapet skrives med
    # migratortilkoblingen (ingen dør, som i M-18 og M-30).
    status: ja
    krav_id: m12-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m12-fasit-v1-20261119T082251Z.json
    artefakt_sha256: 5cc25d587428b325f3b5f6571fd6397e958fb4349ed0660f536e75fa05d25d29
    notat: >-
      Runde 7e85b30e: 5 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m12-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m12-fasit-v1-20261119T082251Z.json
    artefakt_sha256: 5cc25d587428b325f3b5f6571fd6397e958fb4349ed0660f536e75fa05d25d29
    notat: >-
      5 hendelser i kjeden (tilgang.gjennomgatt: 1, tilgang.registrert: 2,
      tilgangsobjekt.registrert: 2), 0 uten aktør, 0 som deler input_hash
      med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m12-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m12-feilinjisering-v1-20261119T082251Z.json
