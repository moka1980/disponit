      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m46-ytelse-v1-20261118T223056Z.json
    artefakt_sha256: fa7d65d2c909c8134be0ccc4e197caa197cdefbef50c51a402a2619683686825
    notat: >-
      Tre kjøringer (0,0248 / 0,0236 / 0,0257 s) over 3 tenanter; den
      DÅRLIGSTE er dommen. 0,0257 s mot taket på 60 — 0,0086 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
