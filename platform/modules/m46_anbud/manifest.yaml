      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m46-rollback-v1-20261118T223058Z.json
    artefakt_sha256: 432cc863c45378ca3cc8278f4e51139775a65d9b600cb1cdf2a4e454b88cac99
    notat: >-
      Drillet 4ce84f81 ← forgjenger 5f57464a (ulike kjernedigester). Riggen
