# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m46-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 118
# tildelt i docs/KLYNGE6-FUNDAMENT.md.
#
# v1 SENDER INGEN TILBUD.
#
# DOMMEN: et innsendt tilbud er BINDENDE, og fristen gjør det
# irreversibelt på den måten som betyr noe — man kan ikke trekke det og
# sende et bedre etterpå. Spesifikasjonens egen vakt sier det, og
# aksepten krever menneskelig signatur.
#
# v1 GJØR TO TING: registrerer kunngjøringen med kilde og frist, og
# MÅLER den mot bedriftens egne kvalifikasjoner.
#
# HVERT FAKTAPUNKT I ET UTKAST PEKER PÅ ET KILDEDOKUMENT, og grunnen er
# skarpere enn den ser ut: et utkast med ETT udekket punkt fylt inn av
# modulen er et tilbud som kan VINNE på en påstand ingen kan stå inne
# for. Et udekket krav er derfor et FUNN, aldri en utfylt gjetning.
#
# v1 GJØR INGEN UTGÅENDE FORESPØRSEL. Doffin og TED er offentlige
# kunngjøringsstrømmer, så M-19s personvernbegrunnelse gjelder ikke —
# grunnen er doktrinens egen om den unødvendige forespørselen, og at
# integrasjonen hører hjemme i oppdragskontrakten når den kommer.
#
# GRENSEN MOT M-5: M-5 eier DOKUMENTMALEN. M-46 eier KUNNGJØRINGEN og
# vurderingen av om vi kvalifiserer. Utkastet er en dokumentsak den
# dagen det skal skrives; v1 måler bare hva som mangler.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m46_anbud
navn: Anbuds- og konkurransevakt
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter: grensen `m46-v1` bærer invarianten
# `sokeprofil_hardkodet` — NACE, geografi og verdigrense er tenantens
# profil, ikke en konstant.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m37_unntak
kjerne: platform/modules/m46_anbud
i18n_prefiks: anbud

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 19/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m46-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m46-suite-v1-20261118T235953Z.json
    artefakt_sha256: 8ef2a03260ad503bf4b0dc89da78564bfe20d7e3cdb0dad80fb9517dce6ea9cf
    notat: >-
      5524 tester, 0 feilet, 0 hoppet; modulens andel 33 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m46_fasit.py`:
    #
    # M-46s fasitsett: ni anbud i to tenanter med KJENT dom.
    #
    # Anbudsregisteret har åtte funntyper, alle på `anbud_id`. Hvert anbud
    # som skal måle noe ANNET enn dekningen, har ett absolutt krav som er
    # dekket av et punkt — ellers ville det også fått `ingen_krav_registrert`
    # eller `udekket_absolutt_krav`. Frister som ikke skal måles ligger om
    # 200 døgn, langt utenfor varselet på 14.
    #
    #   tenant A (profil: NACE 62.010, varsel 14 døgn)
    #     1. `frist_naermer_seg`      — frist om 5 døgn, utkast ikke klart
    #     2. `frist_passert`          — frist for 5 døgn siden
    #     3. `udekket_absolutt_krav`  — et absolutt krav uten punkt
    #     4. `udekket_krav`           — et vektet krav uten punkt
    #     5. `ingen_krav_registrert`  — anbud uten krav
    #     6. `utenfor_profil`         — NACE 41.200, utenfor profilen
    #     7. (ren)                    — som 3; kravet dekkes MELLOM kjøringene
    #     8. (ok)                     — dekket krav, frist om 200 døgn
    #   tenant B (ingen profil)
    #     9. `ingen_profil`
    status: ja
    krav_id: m46-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m46-fasit-v1-20261118T223055Z.json
    artefakt_sha256: 4c7160709e3171afde338a2e65c00d83561d3053784237daf72c348ee20f1c9c
    notat: >-
      Runde a1cb87b7: 9 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m46-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m46-fasit-v1-20261118T223055Z.json
    artefakt_sha256: 4c7160709e3171afde338a2e65c00d83561d3053784237daf72c348ee20f1c9c
    notat: >-
      30 hendelser i kjeden (anbud_registrert: 9, anbudsprofil_satt: 1,
      anbudsutkast_opprettet: 7, kildedokument_registrert: 1,
      kvalifikasjonskrav_registrert: 7, utkastpunkt_registrert: 5), 0 uten
      aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m46-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m46-feilinjisering-v1-20261118T223056Z.json
    artefakt_sha256: 40a87b1791744a5a2efbb2fdcedfb1195846dcd7fcc32f8842d1b2fe643ba08b
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 15 åpne og 3 lukkede over 5 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m46-ytelse-v1
    bevismaalinger:
