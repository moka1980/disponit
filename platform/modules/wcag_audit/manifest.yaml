# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# MAPPENAVNET er bevisst uten mNN_-prefiks: modulen har ikke fått
# katalognummer ennå — det tildeles ved frontsidetekst-steget etter
# aksept, og DA skal mNN_-vakten (test_ui_kontrakt) tvinge frem den
# bevisste UI-oppdateringen. Databasens modul_id er `m_wcag_audit`
# (vedtatt i 014c §1, etablert i 014b-materialet) og endres ikke av
# registernavnet her.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
id: wcag_audit
navn: Automatisk WCAG-kontroll (controller)
versjon: 0.1.0
status: under_utvikling        # aktiv | inaktiv | under_utvikling
# Aksept skjer FØRST når staging-sjekklisten under er grønn med målte
# verdier (evidensgrensen `wcag-kontroll-v1`, klarsignalet §12) — status →
# aktiv er 014c-NESTE-steget, aldri en del av kode-PR-en.
#
# FLIPPET STO `aktiv` I DENNE PR-EN OG ER TATT TILBAKE (Codex P1 på #89).
# Ikke fordi målerunden var dårlig — den var ekte — men fordi aksepten er
# en PORT, og porten var ikke bestått da flagget ble satt:
#
#   1. `rollback_testet` er `nei`. Flippedrillen KAN ikke kjøres ennå
#      (forrige release er før migrasjon 039 og nekter boot mot dagens
#      base), så ingen kan lukke det punktet i dag. RUTINER.md pkt. 6 er
#      kategorisk: «en modul settes ikke til `aktiv` i registeret før alle
#      sjekklistepunkter er ja.» Regelen har ingen unntak å påberope seg —
#      bootstrap-unntaket gjelder fase 1-plattformmodulene, ikke denne.
#   2. De fem andre punktene er målt, men ikke BUNDET gjennom
#      evidensporten (se blokken over `staging_sjekkliste`), så CI
#      verifiserer ingen av tallene aksepten skulle hvile på.
#
# Et `aktiv` her ville dermed vært et flagg uten port bak seg — og
# `driftstilstand` arver: settes den `staging` mens status ikke er `aktiv`,
# gir `registry.valider` «drift krever aktiv». De to feltene flyttes
# sammen, når porten faktisk er bestått.
#
# m02_revisjonslogg BLE aktivert i denne PR-en og forblir aktiv: den
# beslutningen står på egne ben (delt m01-evidens, alle punkter `ja`,
# artefaktene bundet) og er uavhengig av WCAG-modulens akseptport.
driftstilstand: ikke_i_drift   # ikke_i_drift | staging | produksjon
avhengigheter:
  - m01_policy                 # bestilling og frekvens går gjennom policyporten
  - m02_revisjonslogg          # én skrivevei til evidenskjeden
kjerne: platform/modules/wcag_audit
i18n_prefiks: wcagaudit

# GRENSEN (klarsignalet §2): modulen er KUNDE av kontrollmotoren, ikke en
# kopi. Motoren (axe-core i headless Chromium) bor i wcag_checker-repoet og
# kjører i browser-containeren (014b §6) uten credentials; controlleren
# claimer, styrer, pakker, laster opp og kvitterer. Alt som kommer ut av
# motoren er ubetrodd inndata og skjemavalideres — av controlleren FØR
# innsending, og av plattformen ved opplasting OG promotering (036).
staging_sjekkliste:
  # Sjekklisteformen er LUKKET (manifest-skjema.json) — punktene under er
  # plattformens seks akseptpunkter. 014c-spesifikke bevis (syntetisk
  # fasit, egress/robots, bestillingsveien) føres som notater under de
  # punktene de faktisk beviser, med krav_id wcag-kontroll-v1 (§12).
  #
  # MÅLINGEN ER GJORT, MEN IKKE BUNDET (Codex P1 på #89).
  #
  # Målerunden 2026-08-18 på disponit-srv er ekte, og tallene under er dens
  # tall. Men de er FRITEKST: ingen av punktene har `krav_id`, det finnes
  # ingen `artefakt`/`artefakt_sha256`/`bevismaalinger`, artefaktet ligger
  # utenfor repoet (/root/wcag-runde/evidens.jsonl på serveren), og
  # `wcag-kontroll-v1` er ikke registrert i `manifestskjema.KRAVGRENSER`.
  #
  # KONSEKVENSEN ER MÅLT, IKKE PÅSTÅTT: `valider_artefakter` hopper
  # eksplisitt over hvert `ja` som mangler `krav_id` (linjen «ja uten
  # krav_id krever ikke artefakt»). Sto punktene `ja`, ville CI verifisert
  # NULL av målingene aksepten hviler på — evidensporten ville vært åpen,
  # ikke bestått. Og RUTINER.md er kategorisk: «Et sjekklistepunkt uten
  # definert, målbar grense regnes som `nei` — en port man ikke kan måle,
  # er ingen port.» `wcag-kontroll-v1` har ingen definert grense ennå.
  #
  # DERFOR STÅR PUNKTENE `nei` MED MÅLINGEN BEVART. Notatene er ikke
  # slettet — de dokumenterer hva runden faktisk viste, slik at den som
  # binder evidensen slipper å måle på nytt. Veien til `ja` er den samme
  # for alle fem: sjekk inn artefaktet under deploy/staging/artefakter/,
  # registrer `wcag-kontroll-v1` i KRAVGRENSER med grensene fra §12, og
  # bind hvert punkt med krav_id + artefakt + artefakt_sha256 +
  # bevismaalinger. Da måler porten tallene på nytt ved hver CI-kjøring,
  # og et `ja` betyr noe. (`rollback_testet` er en annen sak: der mangler
  # selve drillen — se punktet nederst.)
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      MÅLT 2026-08-18, IKKE BUNDET (mangler krav_id/artefakt i repoet).
      På disponit-srv (release 8e7f397, evidens
      /root/wcag-runde/evidens.jsonl, krav_id wcag-kontroll-v1): ekte motor
      (axe-core-4.10.3, Chromium 131.0.6778.33, docker, image
      sha256:af92b705…) gjennom hele produksjonskjeden bestilling→claim→
      motor→rapport→signert kvittering→promotert artefakt.
      kontroll.ti_kjoringer_signert_innen_frist = 10/10 ·
      funn.avvik_mot_fasit = 0 (begge scenarier) · port 18/19: blokkerte
      subressurser og avkorting ([true,4,13]) i rapporten · port 20:
      0 /privat/-forespørsler i målets logg, robots-5xx ga nøyaktig 1 side ·
      port 21: frekvens 4×tillat + femte=brudd→unntakskø · port 24:
      motormiljøet målt i containeren, 0 lekkasjer (kanari-DISPONIT_KEK og
      DATABASE_URL nådde aldri motoren).
  syntetisk_datasett_likt_lokalt:
    status: nei
    notat: >-
      MÅLT 2026-08-18, IKKE BUNDET (mangler krav_id/artefakt i repoet).
      Testnettstedet (platform/modules/wcag_audit/testnettsted/, fasit
      skrevet fra konstruksjonen) er identisk lokalt og på staging (samme
      commit); fasitkontrollen ga avvik=0 begge steder 2026-08-18.
  revisjonslogg_korrekt:
    status: nei
    notat: >-
      MÅLT 2026-08-18, IKKE BUNDET (mangler krav_id/artefakt i repoet).
      Verifisert i staging-kjøringen: kvitteringen attesterer release,
      regelsett, sider og artefakthash (PR-006-signert, verifikator
      v_wcag_audit mot nøkkelregisteret); rapport-lese-API-et leverer det
      promoterte artefaktet dekryptert.
  feilinjisering_til_unntakskø:
    status: nei
    notat: >-
      MÅLT 2026-08-18, IKKE BUNDET (mangler krav_id/artefakt i repoet).
      Motorfeil (kommando exit 1) → kvittering 'avbrutt', oppdrag
      feilet MED signert feilkvittering, 0 promoterte artefakter;
      evidensfrist overskredet → reap_evidensfrister → idempotent
      evidensfrist-sak + oppdrag feilet (evidens 2026-08-18).
  ytelse_bestatt:
    status: nei
    notat: >-
      MÅLT 2026-08-18, IKKE BUNDET (mangler krav_id/artefakt i repoet).
      10/10 kjøringer signert innen frist (verste 2.1 s mot 1800/3600 s
      budsjett — det syntetiske nettstedet er lite; fristene deklarert i
      oppdragskontrakt.UTFORELSESFRIST_VALG og skrevet på radene, motoren
      fikk claimets restvindu minus avslutningsmarginen).
  rollback_testet:
    # NEI, og det er en reell mangel — ikke en formalitet (samme form som
    # M-37s eget rollback-punkt).
    #
    # Punktet sto `ja` fram til Codex' P1 på denne PR-en, med et notat som
    # i samme åndedrag sa at drillen IKKE var mulig. Et punkt som beviser
    # sin egen `nei` i fritekst mens feltet sier `ja`, er verre enn et
    # ærlig `nei`: sjekklisten er 100 %-porten for aksept, og et slikt `ja`
    # aktiverer en modul UTEN demonstrert gjenopprettingsvei.
    #
    # DET SOM FAKTISK ER BEVIST er MEKANISMEN, ikke rollbacken: deploy-
    # portene kjører som preflight FØR noe stoppes (#84 — rød port = forrige
    # release kjører urørt), og release-katalogene står side om side. Det er
    # evidens for at en mislykket utrulling ikke river ned det som kjører —
    # ikke for at WCAG-arbeideren kan flippes tilbake til forrige release
    # mot en kompatibel base, som er nettopp det dette punktet måler.
    #
    # HVORFOR DRILLEN IKKE KUNNE KJØRES 2026-08-18: forrige release
    # (ccf64ce) er før migrasjon 039 og nekter boot mot dagens base —
    # BootNekt er selve vernet. Drillen kjøres første gang to releaser
    # deler migrasjonstilstand, og FØRST da kan punktet bli `ja`.
    status: nei
    notat: >-
      Flippedrillen (WCAG-arbeideren tilbake til forrige release mot
      kompatibel base) er IKKE kjørt. Preflight-portene i #84 beviser
      mekanismen rundt release-byttet, men er ikke en rollback av denne
      modulen. Kjøres første gang to releaser deler migrasjonstilstand.
