      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m45-ytelse-v1-20261119T153330Z.json
    artefakt_sha256: bad53ef14b79feed679147c9c854799269d1d2031a2860a86d9e995b28b0f1fb
    notat: >-
      Tre kjøringer (0,0196 / 0,0195 / 0,0183 s) over 9 tenanter; den
      DÅRLIGSTE er dommen. 0,0196 s mot taket på 60 — 0,0022 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m45-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m45-rollback-v1-20261119T153331Z.json
    artefakt_sha256: deb4a1c17708c0c8d8f262c317f2c1cff82d1f5c6d3b71946999c9a2f8f85a6e
    notat: >-
      Drillet a6a257a1 ← forgjenger 5f57464a (ulike kjernedigester). Riggen
