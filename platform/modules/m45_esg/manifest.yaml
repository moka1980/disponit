# M-45 BÆREKRAFTS- OG ESG-AGENT — KLYNGE 9s SISTE.
#
# `m45-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 136
# tildelt i docs/KLYNGE9-FUNDAMENT.md. BYGGES SIST i klyngen: den har
# mest å registrere og minst å arve.
#
# KLYNGENS DELTE DOM: EN YTRING AVGITT I HUSETS NAVN KAN IKKE TAS
# TILBAKE. For M-45 har den et eget navn i loven: GRØNNVASKING.
#
# MODULEN HAR INGEN INNGANGSDATA. INGEN. Katalogen sier at den «henter
# energi-, transport-, innkjøps- og avfallsdata fra kildesystemer» —
# ingen av dem finnes. Verifisert mot basen: ingen tabell har en
# kolonne som heter `mengde`, `kwh`, `liter`, `km` eller `volum` i en
# betydning modulen kan bruke.
#
# Dette er FJERDE gang i to klynger at et fundament tildelte data det
# ikke hadde lest (M-36s KPI-katalog, M-15s lønnssats, M-33s
# historikk). Lærdommen står: ET FUNDAMENT KAN TILDELE NUMRE OG ROLLER
# UTEN Å LESE KODEN. DET KAN IKKE TILDELE DATA.
#
# KONSEKVENSEN, OG DEN GJØR MODULEN BEDRE — akkurat som for M-15:
# mengden registreres av et MENNESKE, med kilde og faktorversjon.
# `likviditetspost` finnes fordi huset ikke kan prise lønn; M-45s
# tilsvarende register finnes fordi huset ikke måler energi. Da vet vi
# ALLTID hvem som oppga tallet, og rapporten kan aldri hvile på en
# utledning ingen har sett.
#
# FAKTORVERSJONEN ER IKKE PYNT. Utslippsfaktorer endres mellom
# rapportår, og et tall regnet med fjorårets faktor og lest som årets
# er feil på nøyaktig den måten CSRD skal hindre.
#
# M-45 ER EN KLYNGE 7-MODUL I FORKLEDNING, og det skal stå: den er den
# ENESTE av de fire som rapporterer til en MYNDIGHET (CSRD/ESRS).
# Regelen er ikke vår, og den endres uten å si fra.
# `standardversjon_laast_per_periode` er klynge 7s dom — «en foreldet
# regel ser nøyaktig ut som en riktig regel» — anvendt på
# rapporteringsstandarden selv.
#
# V1-DOMMEN: MODULEN SENDER INGEN RAPPORT. Den samler, regner og
# stopper der; innsendingen er et menneskes.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m45_esg
navn: Bærekrafts- og ESG-agent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter. IKKE «kildesystemer for energi og
# transport» — de finnes ikke, og en avhengighet til noe som ikke
# finnes er en løgn manifestet ikke skal bære.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m03_datakvalitet
kjerne: platform/modules/m45_esg
i18n_prefiks: esg

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 19/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m45-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m45-suite-v1-20261119T154839Z.json
    artefakt_sha256: 3dc4c9fdfff0814a8da06d9e61bf3c11704765a341860286baac8b10030fff01
    notat: >-
      5556 tester, 0 feilet, 0 hoppet; modulens andel 37 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m45_fasit.py`:
    #
    # M-45s fasitsett: fem subjekter i to tenanter med KJENT dom.
    #
    # ESG-registeret har åtte funntyper på `referanse`. Fem er utelukket av
    # datamodellen, og `estimat_ikke_erstattet_over_frist` kan ikke nås samme
    # dag (se `UNAABARE`). De to andre rigges, begge på `periode_id`:
    #
    #   tenant A (estimatterskel 1000 bp, estimatfrist 1 døgn)
    #     1. `standardversjon_foreldet_i_apen_periode`
    #                                 — åpen periode på standard S1 v1, og en
    #                                   faktor i S1 v2 gyldig senere
    #     2. `estimatandel_over_terskel_uavklart`
    #                                 — periode på S2 v1 der hele utslippet er
    #                                   estimat
    #     3. (ren)                    — som 1 (egen standard S3); perioden LUKKES
    #                                   mellom kjøringene
    #     4. (ok)                     — periode på S4 v1 med en målt (ikke
    #                                   estimert) mengde
    #   tenant B (estimatterskel 1001 bp)
    #     5. `estimatandel_over_terskel_uavklart` — samme regel
    #
    # HVER PERIODE HAR SIN EGEN STANDARD — OG SIN EGEN KATEGORI. «Foreldet»
    # gjelder alle åpne perioder på samme standard, så en delt standard ville
    # gitt subjektene flere funn enn fasiten sier; og faktorens unikhet er
    # (tenant, kategori, standardversjon, gyldig_fra) uten standarden, så to
    # standarder med samme kategori og dato ville kollidert.
    status: ja
    krav_id: m45-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m45-fasit-v1-20261119T153329Z.json
    artefakt_sha256: 8c77cdbd72d3d6423a2d2baf6d5bb174e6823c2e13da51d63a22b19ce5e3467f
    notat: >-
      Runde a16e7dc5: 5 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m45-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m45-fasit-v1-20261119T153329Z.json
    artefakt_sha256: 8c77cdbd72d3d6423a2d2baf6d5bb174e6823c2e13da51d63a22b19ce5e3467f
    notat: >-
      20 hendelser i kjeden (apne_periode: 5, lukk_periode: 1,
      registrer_faktor: 7, registrer_kilde: 2, registrer_maaling: 3,
      sett_krav: 2), 0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m45-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m45-feilinjisering-v1-20261119T153330Z.json
    artefakt_sha256: 5ca30f167c15cab24d333248a5d30e7b258e56b9eef2e59a8d2a01d35e3c8a24
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 10 åpne og 1 lukkede over 11 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m45-ytelse-v1
    bevismaalinger:
