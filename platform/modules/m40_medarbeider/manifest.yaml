# M-40 HR- OG MEDARBEIDERAGENT — KLYNGE 10s SISTE.
#
# `m40-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 140
# tildelt i docs/KLYNGE10-FUNDAMENT.md. BYGGES SIST — den rører
# mennesker.
#
# KLYNGENS DELTE DOM: EN HANDLING MED VIRKNING I DEN VIRKELIGE VERDEN
# ANGRES IKKE AV EN ROLLBACK.
#
# OG M-40 ER DEN ENESTE AV DE FIRE DER DEN SKADELIDTE ER EN
# PRIVATPERSON SOM IKKE ER KUNDE. M-28 skader en forsendelse, M-29
# skader driften, M-32 skader et regnskap. M-40 skader en ansatt hos
# kunden — en som aldri har sett produktet, aldri samtykket til noe, og
# ikke kan klage til noen. AI Act-grensen i vaktsetningen er derfor
# ikke en compliance-linje som er lagt til; den er hele grunnen til at
# modulen ser slik ut.
#
# ANSATTREGISTERET FINNES, OG DET ER M-39s. `lonnstaker` har `tenant,
# taker_id, ekstern_ref, navn, aktiv` — husets eneste register over
# mennesker som jobber i bedriften. M-40 ARVER DET og bygger ikke et
# nytt: to registre over de samme menneskene gir to svar på «jobber hun
# her», og det er ett for mange. Samme argument som ga M-7 og M-43 én
# delt opptakshjemmel.
#
# `onboardinglop` (M-18) ER IKKE MEDARBEIDERONBOARDING. Kolonnen heter
# `kunde_ref`. M-18 er kundens innføring i produktet; M-40s er den
# ansattes første uke. Fjerde gang samme felle i to klynger, og igjen
# avverget av å lese kolonnene og ikke navnet.
#
# MALENE FINNES, OG DE ER LÅST. `malfamilie`/`malversjon`/`malfelt`/
# `malkomponent` (M-5) er nøyaktig det vaktsetningens «juridiske
# klausuler er låste» og akseptansekravets «kontrakter kan alltid
# spores til malversjon og kildefelt» ber om. M-40 arver, som M-20
# arvet M-1s utkastform.
#
# HRIS-DATA OG PULSSVAR FINNES IKKE. Pulsen er klyngens egentlige
# vanskelighet, og den eneste som IKKE kan løses ved å holde tilbake en
# fullmakt: modulen må faktisk lagre svarene, og de må faktisk være
# uidentifiserbare.
#
# K-ANONYMITETEN ER EN INVARIANT I BASEN, IKKE EN SJEKK I EN DØR.
# Anonymitet er en egenskap ved SETTET, ikke ved raden: fire svar fra
# en gruppe på fire er anonyme hver for seg og fullt identifiserende
# til sammen. Svaret bærer derfor ingen `taker_id` i det hele tatt, og
# terskelen lagres SAMMEN MED målingen — en terskel som kan endres i
# ettertid er ingen terskel.
#
# V1-DOMMEN: MODULEN AVGJØR INGENTING OM ET MENNESKE. Ingen
# beslutningsdør, ingen score per person, ingen individprofil.
#
# M-30: `docs/M53-M30-GRENSESNITTET.md` avklarte det allerede — M-30
# SLETTER IKKE, den er et register over forespørsler. M-40 registrerer
# hvert lager i M-4s `retensjonslager` (093), som M-53 gjorde.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m40_medarbeider
navn: HR- og medarbeideragent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter. IKKE «HRIS-connector og e-signering» —
# de finnes ikke.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m05_dokumentmal
  - m37_unntak
  - m39_lonnsgrunnlag
kjerne: platform/modules/m40_medarbeider
i18n_prefiks: medarbeider

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 19/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m40-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m40-suite-v1-20261119T141622Z.json
    artefakt_sha256: 181b3e7fb42a34cab7ab7a45f42f3fb0643485bd596150a0584b6db9c4777e2b
    notat: >-
      5556 tester, 0 feilet, 0 hoppet; modulens andel 36 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m40_fasit.py`:
    #
    # M-40s fasitsett: syv subjekter i to tenanter med KJENT dom.
    #
    # Medarbeiderregisteret har ti funntyper på `referanse`. Seks er utelukket
    # av datamodellen og står i `UNAABARE` med migrasjonens egne grunner; de
    # fire sveipen kan reise, rigges alle:
    #
    #   tenant A (frist 1 døgn, gruppeterskel 5)
    #     1. `ansatt_uten_lop`                — ansatt for 5 døgn siden, intet løp
    #     2. `apent_lop_over_frist`           — løpet startet for 5 døgn siden
    #     3. `maaling_uten_lesbar_gruppe`     — lukket måling med to svar i én
    #                                           gruppe; terskelen er 5
    #     4. `kontrakt_paa_tilbaketrukket_mal`— kontrakt på en M-5-versjon som
    #                                           trekkes tilbake etter utstedelsen
    #     5. (ren)                            — som 1; løpet startes MELLOM
    #                                           kjøringene
    #     6. (ok)                             — ansatt for 5 døgn siden, med et
    #                                           løp startet i dag
    #   tenant B (frist 2 døgn, gruppeterskel 6)
    #     7. `ansatt_uten_lop`                — samme regel i en annen tenant
    #
    # ALDEREN SETTES SOM MIGRATOR, testsuitens vei: `lonnstaker` er M-39s
    # tabell (M-40 har bare lesing der), og `ansattlop.startet` er DEFAULT
    # now() uten dørparameter. `test_m40_medarbeider` bakdaterer begge på
    # samme måte og begrunner det der.
    #
    # MALEN GÅR GJENNOM M-5S DØRER — familie, versjon, publisering og
    # tilbaketrekking — så kontrakten står på en mal slik den faktisk oppstår.
    status: ja
    krav_id: m40-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m40-fasit-v1-20261119T140127Z.json
    artefakt_sha256: c1cbb194d6c7196707ecf241c3ba621f76fbf1b8851b1fca26cf50ec0ee15d57
    notat: >-
      Runde 96fb0fe3: 7 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m40-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m40-fasit-v1-20261119T140127Z.json
    artefakt_sha256: c1cbb194d6c7196707ecf241c3ba621f76fbf1b8851b1fca26cf50ec0ee15d57
    notat: >-
      9 hendelser i kjeden (apne_maaling: 1, lukk_maaling: 1, sett_krav: 2,
      start_lop: 4, utsted_kontrakt: 1), 0 uten aktør, 0 som deler
      input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m40-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m40-feilinjisering-v1-20261119T140127Z.json
    artefakt_sha256: 0397aa8d5871ac63090289ab4fc1da9cb8d682f0b6fd74b28751526898749c82
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
