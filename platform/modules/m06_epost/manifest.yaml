# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# M-6 registreres VED FØDSELEN (PR-A av M-6-planen, dommene 31/8):
# fundamentet er migrasjon 088 (kilde/melding/klassifisering/utkast/
# oppfølging/vedlegg + e-postdatagrensen `reap_epostdata`),
# bestillingstypen `epost.behandling` og evidensgrensen `m6-v1` i
# manifestskjema.KRAVGRENSER — grensen registrert FØR bygging
# (§0-regelen, m57). OAuth-døren (PR-B), innhenter/klassifisering/
# utkast (PR-C) og flaten (PR-D) kommer i egne PR-er.
#
# TO AKSER, ÆRLIG LEST (m16/m38-formen): `status` er GODKJENT-aksen —
# ingen aksepthendelse finnes, og ingen sjekklistepunkter er målt.
# `driftstilstand: ikke_i_drift` er bokstavelig: ingen release, ingen
# deploymentrad, ingen arbeider — bare datamodellen og reaperen skipper
# med kjernen.
#
# V1-GRENSENE ER DOMMER, ikke mangler (31/8): kun lesende (ingen
# sendevei representerbar — v2 spesifiseres først etter >= 4 ukers
# foreslå-drift med feil_mottaker=0), utkast kun i Disponit-flaten,
# arkivering som forslagsliste, M365 først (Gmail = senere
# CHECK-utvidelse), standard slettefrist 90 døgn (30–365, immutabel).
id: m06_epost
navn: E-postoperasjonsagent
versjon: 0.1.0
status: aktiv                  # aktiv | inaktiv | under_utvikling
driftstilstand: produksjon     # ikke_i_drift | staging | produksjon
# REELLE, målte avhengigheter — ulikt m16/m38, som LESER kjernen og
# derfor ærlig oppgir ingen: M-6 BESTILLER gjennom policyporten
# (`epost.behandling` er en bestillingstype, hver kjøring policyvurderes
# som enhver annen bestilling — m01), og hver beslutning bokføres i
# evidenskjeden (m02). Uten de to finnes ikke M-6s vei til et oppdrag.
avhengigheter:
  - m01_policy                 # bestillingsveien policyvurderer hver kjøring
  - m02_revisjonslogg          # beslutningene bokføres i evidenskjeden
kjerne: platform/modules/m06_epost
i18n_prefiks: m06epost

# Sjekklisteformen er LUKKET (manifest-skjema.json). Punktene står `nei`
# fordi ingen av dem er MÅLT for M-6 ennå: grensen `m6-v1` er registrert
# i KRAVGRENSER (§0), men målingene den skal lese kommer først med
# utførelsesarmen (PR-C) og flaten (PR-D). «Et manifest skal aldri lese
# sterkere enn porten måler.»
staging_sjekkliste:
  tester_gronne_pa_staging:
    # KJØRT PÅ NYTT 17/9 etter 210 (slettesynk): bevisroten dekker
    # innhenteren, så det forrige artefaktet (16/9) målte en annen
    # innhenter. Fersk base fra utsjekket på verten, hele suiten.
    status: ja
    krav_id: m6-suite-v1
    bevismaalinger:
      - maalt.m6_feilet
      - maalt.m6_tester
      - maalt.m6_hoppet
      - maalt.m6_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m6-suite-v1-20260917T200309Z.json
    artefakt_sha256: 98bf6bad90672c688f11b0170358fb58bb24ce24d0fa695ada727110d34946fc
    notat: >-
      5478 tester, 0 feilet, 0 hoppet; modulens egen andel
      85 tester i elleve filer, 0 feilet, 0 hoppet. Kjørt på
      disponit-srv 17/9 mot fersk base fra utsjekket (samme rigg som
      CI bygger), som administrator.
  syntetisk_datasett_likt_lokalt:
    # POSTBOKSEN FINNES: `deploy/staging/m6_fasit.py` — en RIGGET GRAPH,
    # og alt annet er produktets eget: tokenutpakking, delta-paging (to
    # sider i runde 1, én i runde 2 fra lagret deltaLink), kroppshenting
    # (én gir 404 → forhåndsvisningen står), kryptering, idempotens (samme
    # melding to ganger → én rad), `@removed`, en uten avsender, broen til
    # kundeserviceregisteret (203), svaret som REPLY i tråden nøyaktig én
    # gang, og slettingen. To tenanter: med og uten sendescope.
    #
    # «FASIT-KLASSIFISERINGER» (manifestets ord fra fødselen) finnes ikke
    # som modell — M-6 klassifiserer ikke selv; broen gir meldingen til
    # M-17, som klassifiserer etter REGEL (204). Fasiten måler derfor
    # broen: én henvendelse per melding, masken der adressen finnes.
    #
    # FIRE MUTASJONER KJØRT, fire fall, hver på sin navngitte rad: broen
    # av (`_bro_pa`: 0 henvendelser for 6 meldinger), sendescope-sjekken
    # bort (tenanten uten scope fikk «sendes» og Graph en POST),
    # `epost.svar_sendt` omdøpt (kjeden mangler den), `ON CONFLICT`
    # fjernet.
    status: ja
    krav_id: m6-fasit-v1
    bevismaalinger:
      - maalt.meldinger
      - maalt.nye_runde1
      - maalt.nye_runde2
      - maalt.henvendelser
      - maalt.sendt
      - maalt.inntaksavvik
      - maalt.broavvik
      - maalt.svaravvik
    artefakt: deploy/staging/artefakter/m6-fasit-v1-20260917T191405Z.json
    artefakt_sha256: 15a381b5fc2e19d026fd9e5dd9c1a96ac61f274d0f02bb302a734a7a55027536
    notat: >-
      12 meldinger av 16 inntaket så (fire duplikater ble ikke nye rader;
      de to @removed telles ikke som sett),
      10 nye i runde 1 og 2 i runde 2, 12 henvendelser i M-17,
      1 svar sendt som reply i tråden — NULL avvik på alle fire aksene,
      kjørt på disponit-srv 17/9 mot en fersk base fra utsjekket gjennom
      produktets egne dører med Graph byttet ut (16/9-kjøringen gikk mot
      prod-basen; 210 måtte finnes i basen før innhenteren kunne måles).
      Samme sett kjøres mot lokal base ved hver CI-runde
      (`test_m6_fasit_port`), og bindingen er BYTENE: `sett_sha256` må
      stemme i begge ledd.
  revisjonslogg_korrekt:
    # NOTATET VAR UTDATERT: M-6 skriver evidens selv (`m6_evidens`, kilde
    # `m06_epost`) for utkastet, bestillingen, sendingen og slettingen —
    # og broen skriver M-17s `henvendelse.mottatt`/`avsender.satt`. Målt i
    # samme kjøring, på de samme radene: 6 M-6-hendelser (fire i tenanten
    # med sendescope, to i den uten) og 22 broens. «Med identitet»: hver
    # hendelse har SIN EGEN `input_hash`.
    status: ja
    krav_id: m6-fasit-v1
    bevismaalinger:
      - maalt.evidenshendelser
      - maalt.evidensavvik
    artefakt: deploy/staging/artefakter/m6-fasit-v1-20260917T191405Z.json
    artefakt_sha256: 15a381b5fc2e19d026fd9e5dd9c1a96ac61f274d0f02bb302a734a7a55027536
    notat: >-
      28 hendelser i kjeden, null avvik, hver med aktør og sin egen
      `input_hash`. Målingen er felt av en mutasjon — døpes
      `epost.svar_sendt` om, står svaret sendt mens kjeden mangler
      hendelsen og bærer en fasiten ikke kjenner.
  feilinjisering_til_unntakskø:
    # MÅLINGEN VAR GJORT, BINDINGEN MANGLET — som m23-purring og m17-svar:
    # bevisrunden 10/9 injiserte ti feil i innhenteren mot disponit.com,
    # men `m6-inntak-v1` hadde tom `punktbinding`. De fem som beviser
    # punktet: autentiseringsfeil gjør kilden `feilet` (aldri stille),
    # forbigående feil konsumerer ingenting, kill-switch konsumerer ingen
    # kilder, en deaktivert kilde hentes ikke, et duplikat blir aldri to.
    status: ja
    krav_id: m6-inntak-v1
    bevismaalinger:
      - maalt.autfeil_uten_feilet_kilde_brudd
      - maalt.forbigaende_feil_konsumerte_kilden_brudd
      - maalt.kill_switch_konsumerte_kilder_brudd
      - maalt.deaktivert_kilde_hentet_brudd
      - maalt.innhenting_duplikatmelding_brudd
    artefakt: deploy/staging/artefakter/m6-inntak-v1-20260910T164000Z.json
    artefakt_sha256: 3452e4370f75c33a57dcda417790865bc8f98941a55d7733ad92c0d5dc68f1c5
    notat: >-
      Bevisrunden 10/9 mot disponit.com: ti injiserte feil, null brudd —
      401 fra Graph satte kilden `feilet`, 503 rørte ingenting og kilden
      var kandidat igjen, kill-switch hentet ingenting og konsumerte
      ingen kilder, den deaktiverte kilden sto urørt, og den samme
      meldingen to ganger ble én rad. `rundtur_paa_disponit_com`.
  ytelse_bestatt:
    # GRENSEN ER PINNET: `maks_innhentingstid_ms: 30000` for runde 1 over
    # begge postboksene, og per melding `5000` med `meldinger` som nevner.
    # Porten avviser 0. Manifestet ba om «meldinger per hentevindu» —
    # settet ER hentevinduet: to delta-sider, sju sett, seks lagret.
    status: ja
    krav_id: m6-fasit-v1
    bevismaalinger:
      - maalt.innhentingstid_ms
      - maalt.meldinger
    artefakt: deploy/staging/artefakter/m6-fasit-v1-20260917T191405Z.json
    artefakt_sha256: 15a381b5fc2e19d026fd9e5dd9c1a96ac61f274d0f02bb302a734a7a55027536
    notat: >-
      71 ms for runde 1 over begge postboksene mot taket på 30 000 —
      5,9 ms per melding mot taket på 5 000 (17/9, fersk base; 16/9 mot
      prod: 84 ms / 7,0). Målt med veggklokke av produsenten; porten
      avviser 0.
  rollback_testet:
    # DRILLET 17/9 PÅ disponit-srv med `rollback-m6.py` i KJERNE-form: M-6
    # har ingen egen release — innhenteren ruller med kjernen. En
    # innhenting avbrutt midt i på de drillede bytene (side 1 committet,
    # 5 meldinger, cursor urørt) ble fullført av forgjengerens bytes
    # (5bb38b53) uten dubletter (10 meldinger, 0 dubletter,
    # cursor satt), og de drillede bytene så deretter ingenting nytt.
    # Én evidensrad per melding (10). Rigget Graph i den ekte basen
    # med planarbeiderens rolle (m6_fasit-formen), én underprosess per
    # release-katalog som bevitnet filen innhenteren ble lastet fra.
    status: ja
    krav_id: m6-rollback-v1
    bevismaalinger:
      - maalt.inflight_hentet
      - maalt.dubletter
      - maalt.rullbakk_nye
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m6-rollback-v1-20260917T163757Z.json
    artefakt_sha256: 8eeb53c286c0ceeb0317462416e571a662b4c7a98e2b5a269d41515d72d8a714
    notat: >-
      Flippedrill 17/9 i kjerne-form: drillet 0be44da4 → rullbakk fra
      5bb38b53 (samme M-6-bytes, 8dfd9e5344eb) → kandidat
      0be44da4. Innhentingens tilstand holdt over rullingen: ingen
      tapt melding, ingen dublett, cursoren aldri foran lageret.
