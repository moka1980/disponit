# M-36 BEDRIFTSOPTIMALISATOR — KLYNGE 8s SISTE, OG DEN FARLIGSTE
# MODULEN I HELE KATALOGEN.
#
# `m36-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 131
# tildelt i docs/KLYNGE8-FUNDAMENT.md. BYGGES SIST, og grunnen står
# under.
#
# M-15 og M-33 prognostiserer ETT domene hver. M-36 leser resultatet
# av ALLE moduler og rangerer tiltak på tvers av dem. Katalogens egen
# `dep` er «Modul 1–35». Tre ting følger:
#
#   1. DEN ER DEN ENESTE MODULEN SOM HAR EN OPPFATNING OM DE ANDRE
#      MODULENE.
#
#   2. «KAN ALDRI UTVIDE EGEN FULLMAKT» ER IKKE EN SELVFØLGE — DET ER
#      EN ADVARSEL. En optimalisator som finner at den beste
#      forbedringen er «gi M-36 lov til å gjøre X», er ikke ødelagt.
#      Den gjør nøyaktig det den ble bedt om. Derfor må
#      fullmaktsutvidelse være UREPRESENTERBAR, ikke frarådet.
#
#   3. «KORRELASJON PRESENTERES IKKE SOM ÅRSAK» ER ET KRAV TIL
#      DATAMODELLEN, ikke til teksten på skjermen. Hvert tiltak bærer
#      `grunnlagstype` fra et lukket sett: korrelasjon, eksperiment,
#      regel. En rangering som blander dem uten å si hvilken som er
#      hvilken, ER den påstanden vakten forbyr.
#
# GRENSESNITTET SOM ER AVKLART FØR KODEN, og som endrer katalogen:
#
#   Katalogen sier at M-36 leser en «KPI-katalog» via et «hendelses-
#   og KPI-lag». DET LAGET FINNES IKKE. M-16 (086,
#   platform/core/api/lesing.py) teller PLATTFORMAKTIVITET —
#   beslutninger, frekvens, aktiveringer, oppdrag, unntak, tick — over
#   et vindu. Det er et driftsdashbord for policymotoren, ikke en
#   katalog over virksomhetens nøkkeltall. Det finnes heller ikke noe
#   tverrgående hendelseslag: hver modul har sitt eget funnregister,
#   og de deler FORM, ikke tabell.
#
#   v1 LESER DERFOR DE ÅPNE FUNNENE fra modulregistrene. Det er det
#   eneste tverrgående, standardiserte signalet som faktisk finnes i
#   huset i dag — og det er et ærlig et: et åpent funn er noe en modul
#   har målt og et menneske ikke har lukket.
#
#   MODULEN ER DERMED SMALERE ENN KATALOGTEKSTEN, og det skal stå:
#   EN MODUL SOM LATER SOM DEN LESER NOE DEN IKKE HAR, ER VERRE ENN
#   EN SOM SIER HVA DEN MANGLER.
#
# PORTEFØLJESTOPP. Katalogens vaktsetning krever at den finnes, og en
# stoppknapp som ikke virker er verre enn ingen — `portefoljestopp_
# uten_virkning` er derfor en invariant og ikke en funksjonsbeskrivelse.
#
# TO AKSER, ÆRLIG LEST (5/9): KODEN FINNES — 132 er merget,
# med API, flate, sveip og porter. Aksepthendelsen finnes IKKE,
# og ingen release er kjørt. `status` og `driftstilstand` står
# derfor uendret: de flippes av en modulaksept, ALDRI av en
# byggemilepæl.
id: m36_optimalisator
navn: Bedriftsoptimalisator
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter. Katalogens «modul 1–35» er en ambisjon,
# ikke en måling: v1 leser de åpne funnene, og de kommer fra
# modulregistrene gjennom deres egne lesedører. Policymotoren står her
# fordi den er det som gjør fullmaktsutvidelse umulig.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m16_nokkeltall
  - m37_unntak
kjerne: platform/modules/m36_optimalisator
i18n_prefiks: optimalisator

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      Modulen er bygget (132, 5/9) og portene er grønne lokalt og i
      CI. KREVER FORTSATT: suitekjøring PÅ STAGING med modulens andel
      pinnet og stagingidentitet bundet. En grønn CI er ikke en grønn
      staging.
  syntetisk_datasett_likt_lokalt:
    status: nei
    notat: >-
      Portene har et slikt sett: to forslag med identisk anslag der
      det ene hviler på korrelasjon og det andre på en regel, og
      `korrelasjon_alene_paa_topp` reises når det første havner
      øverst. KREVER FORTSATT: at det samme datasettet finnes PÅ
      STAGING.
  revisjonslogg_korrekt:
    status: nei
    notat: >-
      Sporbarheten ER bygget: `grunnlagstype` KOPIERES inn i
      `rangeringspost` ved avgivelse (et join ville gitt dagens verdi,
      ikke den som gjaldt da), forslagets innhold er frosset, og
      `kilde_modul`/`kilde_funntype` peker tilbake til registeret
      signalet kom fra. KREVER FORTSATT: en verifisert kjede PÅ
      STAGING.
  feilinjisering_til_unntakskø:
    status: nei
    notat: >-
      Stoppen stopper: `m36_rangere` NEKTER med aktiv stopp, og
      `test_portefoljestoppen_hindrer_en_ny_rangering` måler både
      nektet og at rangeringen går igjen etter oppheving. MERK
      begrensningen, som står i klartekst i modulen: stoppen stanser
      M-36, ikke porteføljen — å stanse en annen modul ville vært å
      overstyre dens grense. KREVER FORTSATT: en injisert feil på
      staging.
  ytelse_bestatt:
    status: nei
    notat: >-
      Taket er satt (500 tenanter, `TimeoutStartSec=10min`), og
      `m36_apne_funn` gjør ÉN spørring per register per tenant — 32
      registre. Det er den bredeste sveipen i huset, og anslaget fra
      fundamentet holdt. KREVER FORTSATT: en MÅLT kjøring — et tak er
      ikke en måling.
  rollback_testet:
    status: nei
    notat: >-
      KREVER: en release å rulle tilbake. Modulen har ingen.
