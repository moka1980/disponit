      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m36-rollback-v1-20261119T211920Z.json
    artefakt_sha256: d7cc0bad9529cd5acf421630045d55fcda48991e389533e0cbbd4b78e7ff29df
    notat: >-
      Drillet 528c709a ← forgjenger 5f57464a (ulike kjernedigester). Riggen
      hadde 0 funnrader før drillen, og den drepte kjøringen la ingen til.
      Forgjengerens bytes skrev de 3 funnene uten dubletter, og de drillede
