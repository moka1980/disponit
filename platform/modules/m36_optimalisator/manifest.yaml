# M-36 BEDRIFTSOPTIMALISATOR — KLYNGE 8s SISTE, OG DEN FARLIGSTE
# MODULEN I HELE KATALOGEN.
#
# `m36-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 131
# tildelt i docs/KLYNGE8-FUNDAMENT.md. BYGGES SIST, og grunnen står
# under.
#
# M-15 og M-33 prognostiserer ETT domene hver. M-36 leser resultatet
# av ALLE moduler og rangerer tiltak på tvers av dem. Katalogens egen
# `dep` er «Modul 1–35». Tre ting følger:
#
#   1. DEN ER DEN ENESTE MODULEN SOM HAR EN OPPFATNING OM DE ANDRE
#      MODULENE.
#
#   2. «KAN ALDRI UTVIDE EGEN FULLMAKT» ER IKKE EN SELVFØLGE — DET ER
#      EN ADVARSEL. En optimalisator som finner at den beste
#      forbedringen er «gi M-36 lov til å gjøre X», er ikke ødelagt.
#      Den gjør nøyaktig det den ble bedt om. Derfor må
#      fullmaktsutvidelse være UREPRESENTERBAR, ikke frarådet.
#
#   3. «KORRELASJON PRESENTERES IKKE SOM ÅRSAK» ER ET KRAV TIL
#      DATAMODELLEN, ikke til teksten på skjermen. Hvert tiltak bærer
#      `grunnlagstype` fra et lukket sett: korrelasjon, eksperiment,
#      regel. En rangering som blander dem uten å si hvilken som er
#      hvilken, ER den påstanden vakten forbyr.
#
# GRENSESNITTET SOM ER AVKLART FØR KODEN, og som endrer katalogen:
#
#   Katalogen sier at M-36 leser en «KPI-katalog» via et «hendelses-
#   og KPI-lag». DET LAGET FINNES IKKE. M-16 (086,
#   platform/core/api/lesing.py) teller PLATTFORMAKTIVITET —
#   beslutninger, frekvens, aktiveringer, oppdrag, unntak, tick — over
#   et vindu. Det er et driftsdashbord for policymotoren, ikke en
#   katalog over virksomhetens nøkkeltall. Det finnes heller ikke noe
#   tverrgående hendelseslag: hver modul har sitt eget funnregister,
#   og de deler FORM, ikke tabell.
#
#   v1 LESER DERFOR DE ÅPNE FUNNENE fra modulregistrene. Det er det
#   eneste tverrgående, standardiserte signalet som faktisk finnes i
#   huset i dag — og det er et ærlig et: et åpent funn er noe en modul
#   har målt og et menneske ikke har lukket.
#
#   MODULEN ER DERMED SMALERE ENN KATALOGTEKSTEN, og det skal stå:
#   EN MODUL SOM LATER SOM DEN LESER NOE DEN IKKE HAR, ER VERRE ENN
#   EN SOM SIER HVA DEN MANGLER.
#
# PORTEFØLJESTOPP. Katalogens vaktsetning krever at den finnes, og en
# stoppknapp som ikke virker er verre enn ingen — `portefoljestopp_
# uten_virkning` er derfor en invariant og ikke en funksjonsbeskrivelse.
#
# TO AKSER, ÆRLIG LEST (5/9): KODEN FINNES — 132 er merget,
# med API, flate, sveip og porter. Aksepthendelsen finnes IKKE,
# og ingen release er kjørt. `status` og `driftstilstand` står
# derfor uendret: de flippes av en modulaksept, ALDRI av en
# byggemilepæl.
id: m36_optimalisator
navn: Bedriftsoptimalisator
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter. Katalogens «modul 1–35» er en ambisjon,
# ikke en måling: v1 leser de åpne funnene, og de kommer fra
# modulregistrene gjennom deres egne lesedører. Policymotoren står her
# fordi den er det som gjør fullmaktsutvidelse umulig.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m16_nokkeltall
  - m37_unntak
kjerne: platform/modules/m36_optimalisator
i18n_prefiks: optimalisator

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m36_fasit.py`:
    #
    # M-36s fasitsett: fire subjekter i fire tenanter med KJENT dom.
    #
    # Optimalisatorens register har fire funntyper på `referanse`. Én er
    # utelukket av datamodellen, og to kan ikke nås samme dag uten å slå av
    # en vakt (se `UNAABARE`). Den siste, `korrelasjon_alene_paa_topp`,
    # rigges på `rangering_id`:
    #
    #   tenant a  1. `korrelasjon_alene_paa_topp` — ett korrelasjonstiltak,
    #                                  rangert
    #   tenant b  2. (ren)           — som 1; mellom kjøringene foreslås et
    #                                  større regeltiltak og det rangeres på
    #                                  nytt, så den ferskeste toppen ikke
    #                                  lenger hviler bare på korrelasjon
    #   tenant c  3. (ok)            — regeltiltaket er størst og står øverst;
    #                                  korrelasjonstiltaket står på plass 2
    #   tenant d  4. `korrelasjon_alene_paa_topp` — samme regel, andre grenser
    #
    # ÉN TENANT PER SUBJEKT. Sveipen leser bare den FERSKESTE rangeringen i
    # hver tenant, så to subjekter i samme tenant ville gjort det eldste til
    # et subjekt sveipen med vilje aldri ser.
    status: ja
    krav_id: m36-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m36-fasit-v1-20261119T211915Z.json
    artefakt_sha256: 0e01ebf015d0fd9a8c378b04eee1da085e00602dcbc819297dbba68b29497607
    notat: >-
      Runde 5a80afb0: 4 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m36-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m36-fasit-v1-20261119T211915Z.json
    artefakt_sha256: 0e01ebf015d0fd9a8c378b04eee1da085e00602dcbc819297dbba68b29497607
    notat: >-
      19 hendelser i kjeden (foresla_tiltak: 6, rangere: 5,
      registrer_modell: 4, sett_krav: 4), 0 uten aktør, 0 som deler
      input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m36-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m36-feilinjisering-v1-20261119T211917Z.json
    artefakt_sha256: 1cc1c0adcc2f168d31553aa27d4d7608210ede7b1bf3c8cd2c7e472312675122
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 5 åpne og 1 lukkede over 9 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m36-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m36-ytelse-v1-20261119T211916Z.json
    artefakt_sha256: cb7aa5957b1adb414648885af0b9e0825362eb317afe188e2616b00a226810d1
    notat: >-
      Tre kjøringer (0,0216 / 0,0311 / 0,0430 s) over 5 tenanter; den
      DÅRLIGSTE er dommen. 0,0430 s mot taket på 60 — 0,0086 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m36-rollback-v1
    bevismaalinger:
