# M-33 PREDIKSJONS- OG SCENARIOAGENT — KLYNGE 8s ANDRE.
#
# `m33-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 130
# tildelt i docs/KLYNGE8-FUNDAMENT.md.
#
# M-33 GENERALISERER FORMEN M-15 ETABLERER — horisont, modellsnapshot,
# intervall, måling mot faktisk utfall — til flere måltyper, og legger
# til det ene kravet M-15 ikke trenger:
#
#   BASELINE. En modell som ikke slår «samme som forrige uke» bærer
#   AUTORITET DEN IKKE HAR FORTJENT, og det er verre enn ingen modell:
#   den ser ut som kunnskap. Katalogens egen flyt sier «backtester mot
#   naive baselines», og `slaar_ikke_naiv_baseline` er et funn ingen
#   kan klikke bort.
#
# KATALOGENS VAKTSETNING: «Prognoser er ikke fakta; ingen
# personalavgjørelse eller automatisk handling uten separat policy.»
# Den andre halvdelen er grunnen til at modulen står i fase 4:
# bemanningsprognoser er nettopp det en prediksjonsmodul blir bedt om
# først, og nettopp det den ikke skal få avgjøre.
#
# GRENSEN MOT M-3 (092), SOM MÅ AVKLARES I MODULENS EGEN RUNDE:
# en prognose regnet på data M-3 har flagget som mangelfulle skal
# BÆRE flagget — ikke nektes. Å nekte ville gjort modulen ubrukelig i
# nettopp den situasjonen den er nyttigst: når datagrunnlaget er tynt
# er det ekstra viktig å vite hvor usikkert svaret er.
#
# TIMERFLYTTINGEN HØRER HIT: M-33 er den første modulen som legger en
# sveip BAK 11:20, og det er dens PR som flytter
# `disponit-sveipestatus.timer` til 12:05. Fundamentet tildeler
# klokkeslettet; det installerer ingen timer.
#
# TO AKSER, ÆRLIG LEST (5/9): KODEN FINNES — 130 er merget, med
# API, flate, sveip og porter. Aksepthendelsen finnes IKKE, og
# ingen release er kjørt. `status` og `driftstilstand` står
# derfor uendret: de flippes av en modulaksept, ALDRI av en
# byggemilepæl. At koden er skrevet er ikke at noen har sagt ja.
id: m33_prognose
navn: Prediksjons- og scenarioagent
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: datakvaliteten prognosen må bære
# flagget fra, og policymotoren som eier enhver handling.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m03_datakvalitet
  # LAGT TIL 5/9, UNDER BYGGINGEN AV 130. Fundamentet skrev at M-33s
  # `dep` er «datakvalitet, historikk, evaluering og KPI-katalog». To
  # av de fire finnes ikke som tabeller. HISTORIKKEN ER M-39s
  # `timeregistrering` — faktisk arbeidet tid, minutter per person per
  # dato. Ikke `arbeidsplan`: en prognose regnet på PLANEN prognoserer
  # planen, og ville vært perfekt og verdiløs.
  - m39_lonnsgrunnlag
kjerne: platform/modules/m33_prognose
i18n_prefiks: prognose

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      Modulen er bygget (130, 5/9) og portene er grønne lokalt og i
      CI. KREVER FORTSATT: suitekjøring PÅ STAGING med modulens andel
      pinnet og stagingidentitet bundet. En grønn CI er ikke en grønn
      staging.
  syntetisk_datasett_likt_lokalt:
    status: nei
    notat: >-
      Portene har en slik tidsserie: stigende bemanning der snittet er
      450 og basislinjen 800, og der begge utfall er målt — modellen
      taper på 900, vinner på 460. KREVER FORTSATT: at det samme
      datasettet finnes PÅ STAGING.
  revisjonslogg_korrekt:
    status: nei
    notat: >-
      Sporbarheten ER bygget: `bemanningsprognose` bærer
      `modellversjon`, `baselinje`, `grunnlag_uker`,
      `grunnlag_siste_dato` og `datakvalitet` som NOT NULL, og
      `m33_evidens` skriver hver handling til revisjonsloggen. KREVER
      FORTSATT: en verifisert kjede PÅ STAGING.
  feilinjisering_til_unntakskø:
    status: nei
    notat: >-
      Funnet finnes: `slaar_ikke_naiv_baseline` reises av sveipen når
      modellens samlede absoluttavvik er større enn ELLER LIK
      basislinjens over minst `domsgrunnlag_uker` målte uker, og
      lukkes bare av at modellen faktisk blir bedre. KREVER FORTSATT:
      en injisert feil på staging.
  ytelse_bestatt:
    status: nei
    notat: >-
      Taket er satt (500 tenanter per kjøring, `TimeoutStartSec=10min`)
      og sveipens tre setninger er indeksdekket. KREVER FORTSATT: en
      MÅLT kjøring — et tak er ikke en måling.
  rollback_testet:
    status: nei
    notat: >-
      KREVER: en release å rulle tilbake. Modulen har ingen.
