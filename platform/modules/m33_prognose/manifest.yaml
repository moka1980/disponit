# M-33 PREDIKSJONS- OG SCENARIOAGENT — KLYNGE 8s ANDRE.
#
# `m33-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 130
# tildelt i docs/KLYNGE8-FUNDAMENT.md.
#
# M-33 GENERALISERER FORMEN M-15 ETABLERER — horisont, modellsnapshot,
# intervall, måling mot faktisk utfall — til flere måltyper, og legger
# til det ene kravet M-15 ikke trenger:
#
#   BASELINE. En modell som ikke slår «samme som forrige uke» bærer
#   AUTORITET DEN IKKE HAR FORTJENT, og det er verre enn ingen modell:
#   den ser ut som kunnskap. Katalogens egen flyt sier «backtester mot
#   naive baselines», og `slaar_ikke_naiv_baseline` er et funn ingen
#   kan klikke bort.
#
# KATALOGENS VAKTSETNING: «Prognoser er ikke fakta; ingen
# personalavgjørelse eller automatisk handling uten separat policy.»
# Den andre halvdelen er grunnen til at modulen står i fase 4:
# bemanningsprognoser er nettopp det en prediksjonsmodul blir bedt om
# først, og nettopp det den ikke skal få avgjøre.
#
# GRENSEN MOT M-3 (092), SOM MÅ AVKLARES I MODULENS EGEN RUNDE:
# en prognose regnet på data M-3 har flagget som mangelfulle skal
# BÆRE flagget — ikke nektes. Å nekte ville gjort modulen ubrukelig i
# nettopp den situasjonen den er nyttigst: når datagrunnlaget er tynt
# er det ekstra viktig å vite hvor usikkert svaret er.
#
# TIMERFLYTTINGEN HØRER HIT: M-33 er den første modulen som legger en
# sveip BAK 11:20, og det er dens PR som flytter
# `disponit-sveipestatus.timer` til 12:05. Fundamentet tildeler
# klokkeslettet; det installerer ingen timer.
#
# TO AKSER, ÆRLIG LEST (5/9): KODEN FINNES — 130 er merget, med
# API, flate, sveip og porter. Aksepthendelsen finnes IKKE, og
# ingen release er kjørt. `status` og `driftstilstand` står
# derfor uendret: de flippes av en modulaksept, ALDRI av en
# byggemilepæl. At koden er skrevet er ikke at noen har sagt ja.
id: m33_prognose
navn: Prediksjons- og scenarioagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter: datakvaliteten prognosen må bære
# flagget fra, og policymotoren som eier enhver handling.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m03_datakvalitet
  # LAGT TIL 5/9, UNDER BYGGINGEN AV 130. Fundamentet skrev at M-33s
  # `dep` er «datakvalitet, historikk, evaluering og KPI-katalog». To
  # av de fire finnes ikke som tabeller. HISTORIKKEN ER M-39s
  # `timeregistrering` — faktisk arbeidet tid, minutter per person per
  # dato. Ikke `arbeidsplan`: en prognose regnet på PLANEN prognoserer
  # planen, og ville vært perfekt og verdiløs.
  - m39_lonnsgrunnlag
kjerne: platform/modules/m33_prognose
i18n_prefiks: prognose

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 20/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m33-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m33-suite-v1-20261119T233507Z.json
    artefakt_sha256: 0a16d2177f8d6641a0cdf4c77cea758fa4662308b7a607b9290a774de3734e0b
    notat: >-
      5557 tester, 0 feilet, 0 hoppet; modulens andel 58 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m33_fasit.py`:
    #
    # M-33s fasitsett: fem subjekter i to tenanter med KJENT dom.
    #
    # KJØRER BARE I DEN ISOLERTE BASEN (ADR-006). En prognose er append-only,
    # også for migrator: `laget_dato` settes av døra til dagens dato, og
    # `m33_evidensvakt` nekter enhver endring. Ingen funn som krever at
    # horisonten er passert kan derfor oppstå samme dag — og den eneste måten å
    # elde en prognose på er den testsuiten selv bruker: vakten av, alderen
    # flyttet, vakten på. Det gjøres ALDRI i driftsbasen. Riggen nekter derfor å
    # kjøre noe annet sted enn `disponit_test` på 55432.
    #
    #   tenant a (horisont 1 uke, målefrist 1 døgn, domsgrunnlag 4 uker)
    #     1. `prognose_uten_maaling`   — eldet 30 døgn, ingen har målt uken
    #                                    (subjektet er `<prognose>:1`)
    #     2. `prognose_paa_ukjent_datakvalitet` — SAMME prognose: tenanten har
    #                                    aldri fått datakvaliteten sin profilert
    #                                    (subjektet er prognosen)
    #     3. (ren)                     — som 1; uken MÅLES mellom kjøringene
    #     4. (ok)                      — en fersk prognose, horisonten løper
    #   tenant b (horisont 2 uker, målefrist 2 døgn, domsgrunnlag 2 uker)
    #     5. `slaar_ikke_naiv_baseline` — begge ukene målt til nøyaktig
    #                                    basislinjens tall: modellen bommer,
    #                                    basislinjen treffer (subjektet er
    #                                    modellversjonen)
    #
    # HISTORIKKEN ER STIGENDE (100, 200 … 800 minutter per uke), som i suiten:
    # da er snittet (450) og forrige uke (800) ulike tall, og modellen og
    # basislinjen kan skilles.
    status: ja
    krav_id: m33-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m33-fasit-v1-20261119T222019Z.json
    artefakt_sha256: f40a70293ac4fc3dda3b9ecde07c9b7210e97a2814a76cd016b37b4a265e406e
    notat: >-
      Runde cf40c6b1: 5 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m33-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m33-fasit-v1-20261119T222019Z.json
    artefakt_sha256: f40a70293ac4fc3dda3b9ecde07c9b7210e97a2814a76cd016b37b4a265e406e
    notat: >-
      13 hendelser i kjeden (lag_prognose: 4, registrer_maaling: 3,
      registrer_modell: 4, sett_krav: 2), 0 uten aktør, 0 som deler
      input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m33-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m33-feilinjisering-v1-20261119T222020Z.json
    artefakt_sha256: f8ed4a461aecb744ea91bb488ec936a2fe9f4f1512f26fbff1567f9636ed2326
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 13 åpne og 1 lukkede over 4 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m33-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m33-ytelse-v1-20261119T222020Z.json
    artefakt_sha256: 9cf7b5ac0c28871a37f0f09dc4dc4a766b567076dd5a14d6b539ffdc66415a1a
    notat: >-
      Tre kjøringer (0,0120 / 0,0122 / 0,0104 s) over 2 tenanter; den
      DÅRLIGSTE er dommen. 0,0122 s mot taket på 60 — 0,0061 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m33-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m33-rollback-v1-20261119T222022Z.json
    artefakt_sha256: 7ca9ee86a3d558e6af053dcb7b72fb23d33f3b2d60456c1975d57d54bb5735fb
    notat: >-
      Drillet 528c709a ← forgjenger 5f57464a (ulike kjernedigester). Riggen
