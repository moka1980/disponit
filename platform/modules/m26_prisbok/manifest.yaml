# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m26-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 108
# tildelt i docs/KLYNGE4-FUNDAMENT.md.
#
# HVA POLICYEN ALT LOVER: ALLE TRE bransjemalene navngir denne modulen
# som verifikatoren `v_prisbok`, betrodd for `priser_fra_prisbok`,
# `laste_klausuler_uendret` og `standard_forbehold_inkludert` — og
# bruker dem til å slippe `tilbud.generer` gjennom som `modus: auto`.
# `pris.endre` står som `alltid_stopp` i policyen; det er den ene
# handlingen malene selv ikke tør automatisere, og v1 er enig.
#
# Seks referanser i tre maler er flest av alle manglende moduler. M-24
# peker dessuten hit i sin egen migrasjon (105): «M-24 oppdager
# kostnadsøkningen, M-26 foreslår ny pris».
#
# v1 ER BOKA, OG DEN SETTER INGEN PRIS.
#
# DOMMEN: hver pris i boka er skrevet av et menneske gjennom en dør.
# En modul som beregnet en ny pris ville tatt en beslutning som avgjør
# hva virksomheten tjener — og gjort det på et grunnlag ingen har målt.
# «M-24 oppdager, M-26 foreslår» er katalogens formulering; v1 holder
# seg på registersiden av begge deler, og FORESLÅR heller ingenting.
#
# OG DEN GENERERER INGET TILBUD. Et tilbud er et bindende utspill mot
# en kunde. v1 gjør prisen og klausulene FINNBARE og VERSJONERTE, slik
# at et tilbud senere kan sitere en versjon — og slik at et tilbud som
# ble gitt i går fortsatt kan gjenfinnes mot den prisen som gjaldt da.
#
# VERSJONERINGEN ER HELE POENGET. En prisbok uten versjon kan ikke
# svare på «hva sto her da vi ga det tilbudet», og da er
# `priser_fra_prisbok` en attestasjon om noe ingen kan etterprøve.
#
# GRENSEN MOT M-24: M-24 eier PRISEN VI BETALER. M-26 eier PRISEN VI
# TAR. De to møtes i marginen, og ingen av dem regner den ut.
#
# TO AKSER, ÆRLIG LEST (17/9): sertifisert mot verten — fasit, suite og
# bevisrunde bundet under; én release (m26-r1), så rollback er blokkert.
id: m26_prisbok
navn: Prisbok- og tilbudsagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter: grensen `m26-v1` bærer invarianten
# `rabattgrense_hardkodet` — hvor mye en pris kan avvike fra boka før
# det er et funn, er tenantens tall og ikke modulens.
avhengigheter:
  - m01_policy                 # rabattgrensen er policy, ikke en konstant
  - m02_revisjonslogg          # hver prisendring i evidenskjeden
kjerne: platform/modules/m26_prisbok
i18n_prefiks: prisbok

staging_sjekkliste:
  tester_gronne_pa_staging:
    # Samme tre forutsetninger som M-23/M-17/M-6/M-44: fullt utsjekk,
    # fersk base, og sveiperollens egen DSN (prisboksveipen kjører som
    # den). Kjørt som administrator, ikke root: en stengt fil er lesbar
    # for root, og én test utenfor modulen måler nettopp det.
    status: ja
    krav_id: m26-suite-v1
    bevismaalinger:
      - maalt.tester_totalt
      - maalt.tester_feilet
      - maalt.tester_hoppet
      - maalt.suite_exitkode
      - maalt.m26_tester
      - maalt.m26_feilet
      - maalt.m26_hoppet
      - maalt.m26_exitkode
    artefakt: deploy/staging/artefakter/m26-suite-v1-20260916T225556Z.json
    artefakt_sha256: 443afe010294cc2784639c4e9126d4362132eb1db241b4408608f0c6612c75fd
    notat: >-
      Kjørt 17/9 på disponit-srv som administrator fra et FULLT utsjekk av 09bcc222 mot en FERSK testbase med alle rolle-DSN-ene: 5448 tester, 0 feilet, 0 hoppet; M-26-andelen 75 av 75, exitkode 0.
  syntetisk_datasett_likt_lokalt:
    # SETTET FINNES: `deploy/staging/m26_fasit.py` — 12 produkter over to
    # tenanter, én MED terskel og én UTEN. Kantene: neste prisversjon om
    # 31 døgn gir «utløper om 30» (funn, `<=`) og om 32 gir 31 (ikke
    # funn); i dag; om fem; deaktivert produkt (ingen funn); uten pris;
    # kun framtidig pris; tre versjoner. Uten terskel er hvert aktivt
    # produkt et `ingen_terskel`-funn.
    #
    # TERSKELEN STRAMMES ETTER PRISENE (varsel 10 → 30 døgn): funnene
    # følger den GJELDENDE terskelen, ikke den prisen ble satt under.
    # `uten_gyldig_pris` kan ikke oppstå samme dag som produktet
    # registreres (regelen teller døgn fra registreringen) og måles av
    # modulens egen port; her måles at raden uten pris IKKE er et funn.
    #
    # FIRE MUTASJONER KJØRT MOT BASEN som eierrollen, fire fall, hver på
    # sin navngitte rad: `<=` → `<` på utløpskanten («utloper_kant_30»),
    # `p.aktiv` fjernet i utløpsgrenen («deaktivert_utloper») og i
    # terskelgrenen («deaktivert_uten_terskel»), pris-evidensen omdøpt.
    status: ja
    krav_id: m26-fasit-v1
    bevismaalinger:
      - maalt.produkter
      - maalt.ventede_funn
      - maalt.funnavvik
      - maalt.koeavvik
    artefakt: deploy/staging/artefakter/m26-fasit-v1-20260916T224100Z.json
    artefakt_sha256: 6497ae0f22da7c0fb413629cc6a7a06e3d77b84877f0f2ebb3e85d4a7440ff30
    notat: >-
      Kjørt 17/9 på disponit-srv som root mot produksjonsbasen med to nye tenanter: 12 produkter gjennom dørene, 5 ventede funn i sveipen (pris_utloper_snart ×3, ingen_terskel ×2), 0 funnavvik og 0 køavvik. Settets sha256 er bundet i artefaktet og re-regnes av porten.
  revisjonslogg_korrekt:
    # MÅLES I SAMME KJØRING, på de samme radene: hver dør skriver sin
    # hendelse (`terskler.satt`, `klausul.satt`, `produkt.registrert`,
    # `pris.satt`, `produkt.aktiv`) — 35 hendelser med hver sin
    # `input_hash` og aktøren som gikk gjennom døra. OG prishistorikken
    # per produkt (`m26_prishistorikken`): hver versjon med pris, fra/til,
    # begrunnelse og hvem — «hva sto her da», som er det modulen finnes
    # for å svare på.
    status: ja
    krav_id: m26-fasit-v1
    bevismaalinger:
      - maalt.evidenshendelser
      - maalt.evidensavvik
    artefakt: deploy/staging/artefakter/m26-fasit-v1-20260916T224100Z.json
    artefakt_sha256: 6497ae0f22da7c0fb413629cc6a7a06e3d77b84877f0f2ebb3e85d4a7440ff30
    notat: >-
      35 hendelser i revisjonsloggen fra fem dører, hver med sin input_hash og aktøren som gikk gjennom døra; prishistorikken per produkt lest gjennom `m26_prishistorikken` med pris, fra/til, begrunnelse og hvem. 0 evidensavvik.
  feilinjisering_til_unntakskø:
    # MÅLINGEN VAR GJORT, BINDINGEN MANGLET — som m23/m17/m6/m44:
    # bevisrunden 10/9 injiserte feil mot disponit.com, men
    # `m26-tilbud-v1` hadde tom `punktbinding`. De fem som beviser
    # punktet: en linje under rabattgrensen ble sak, en erstattet
    # klausul ble sak, summen over policyens tak ble sak, ingen dobbel
    # sending, kill-switch konsumerte ingen tilbud.
    status: ja
    krav_id: m26-tilbud-v1
    bevismaalinger:
      - maalt.priser_utenfor_boka_brudd
      - maalt.klausul_erstattet_brudd
      - maalt.belop_over_policyens_tak_brudd
      - maalt.dobbel_sending_samme_oppdrag_brudd
      - maalt.kill_switch_konsumerte_tilbud_brudd
    artefakt: deploy/staging/artefakter/m26-tilbud-v1-20260910T144500Z.json
    artefakt_sha256: cffd0494164b7b202e512643c5bfa01633efd9214f04f845277b555a862ce24a
    notat: >-
      Bevisrunden 10/9 mot disponit.com, ti punkter, null brudd: en
      linje under rabattgrensen stoppet som sak i unntakskøen, en klausul
      erstattet etter binding likeså, en sum over `belop_maks` likeså,
      ett oppdrag ga én sending også ved dobbel kvittering, og
      kill-switch midt i kjeden konsumerte ingen tilbud.
      `rundtur_paa_disponit_com`.
  ytelse_bestatt:
    # GRENSEN ER PINNET: `maks_sveipetid_ms: 30000`, kryss-tenant én gang
