      Kryss-tenant-sveipen over 3 tenanter tok 13 ms mot grensen 30 000 ms.
  rollback_testet:
    # DRILLET 17/9 PÅ disponit-srv med `rollback-sveipmodul.py` (samme lest
    # som M-14/M-44): forgjenger med regnbare bytes i registeret, den
    # claimende releasen drenert MENS oppdrag 132 var claimet, claim-stopp
