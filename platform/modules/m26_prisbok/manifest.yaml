    # claimet/fullførte 133, kandidaten overtok og fullførte 134.
    # Prøvesendingene gikk til eiers testadresse.
    status: ja
    krav_id: m26-rollback-v1
    bevismaalinger:
      - maalt.claims_etter_drenering
      - maalt.inflight_oppdrag
      - maalt.falske_verdikter
      - maalt.rullback_claimet_oppdrag
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m26-rollback-v1-20260917T125946Z.json
    artefakt_sha256: 6af751e0318e6591c40435723e23bfd9b941f75d94bad478b90fcb9fa382ef73
