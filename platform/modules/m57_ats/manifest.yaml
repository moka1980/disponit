# M-57 Rekrutteringsagent (ATS) — modulmanifest.
#
# Status er UNDER_UTVIKLING til M-57-aksepten (ordinær deployment-aksept,
# 049–053) er kjørt og skrevet i basen — flippet til aktiv/produksjon er
# katalogens AVLESNING av en aksepthendelse, aldri en påstand i forkant
# (m56/m02-formen). Evidensgrensen `m57-v1` er registrert i
# manifestskjema.KRAVGRENSER FØR byggingen (klarsignalet §0), og hvert
# sjekklistepunkt under peker dit: et punkt uten definert, målbar grense
# regnes som nei.
#
# Det bærende (klarsignalet §1): evalueringen er RÅDGIVENDE — den skriver
# artefakter og ingenting utad. Utsendelsen er IRREVERSIBEL og skjer kun
# fordi et menneske signerte; den er ikke et modulnoppdrag, men en
# signaturbundet frigivelse gjennom 056-kjeden.
# `m57_ats`, ikke `ats` (Cursor P1). Tre kanoner sier alt `m57_ats` —
# kontraktens `eiermodul`, 056/057s CHECK-er og akseptartefaktets
# `oppsett.modul` — og `registry.les_manifester` faller selv tilbake på
# MAPPENAVNET når `id` mangler, altså `m57_ats`. En fjerde stavemåte her
# er ikke en teknisk feil i dag (registerets id og `auth.modul_id` er to
# forskjellige registre: det siste kommer fra `modultoken`/`modulhode`,
# registrert ved onboarding), men den er nøyaktig fellen som alt har
# kostet denne PR-en to runder som `m_ats`: den som skal registrere
# modulen ved onboarding leser manifestet for å vite hva den heter.
id: m57_ats
navn: Rekrutteringsagent (ATS)
versjon: 0.1.0
status: aktiv                  # aktiv | inaktiv | under_utvikling
driftstilstand: produksjon     # ikke_i_drift | staging | produksjon
avhengigheter:
  - m01_policy                 # bestilling går gjennom beslutningsveien
  - m02_revisjonslogg          # én skrivevei til evidenskjeden
kjerne: platform/modules/m57_ats
i18n_prefiks: m57ats

# NOTATENES ORDLYD (eiers dom 14:33 på #153, C-armen til issue #166):
# et notat sier hva punktet KREVER og hvilken måling som beviser det —
# aldri mer enn porten faktisk måler. `_bevismaalinger_finnes` bekrefter
# at en påberopt sti FINNES i artefaktet; den sier ingenting om at
# målingen beviser NETTOPP dette punktet (den sier det selv i sin egen
# docstring: «det er reviewansvar»). Fem av punktene under har derfor
# ingen måling i `m57-v1` ennå, og notatet skal si det rett ut i stedet
# for å love en akseptarc som skal bevise det. Punktbindingen som gjør
# dette MEKANISK — et punkt uten erklærte målinger er uflippbart — er
# #166; til den lander er ordlyden her den eneste ærligheten vi har.
# «Et manifest skal aldri lese sterkere enn porten måler.»
staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 17/9 I M-44/M-26/M-14-LESTEN: egen grense `m57-suite-v1` med
    # modulens andel pinnet (de åtte `test_m57_*`-filene) — fullt utsjekk,
    # fersk base, alle rolle-DSN-ene, kjørt som administrator.
    # `m57-v1`s suitefelter kan ikke bæres av dens eget skjema (#541);
    # dette punktet binder derfor til den nye grensen, som m44/m26/m14.
    status: ja
    krav_id: m57-suite-v1
    bevismaalinger:
      - maalt.tester_totalt
      - maalt.tester_feilet
      - maalt.tester_hoppet
      - maalt.suite_exitkode
      - maalt.m57_tester
      - maalt.m57_feilet
      - maalt.m57_hoppet
      - maalt.m57_exitkode
    artefakt: deploy/staging/artefakter/m57-suite-v1-20260917T015557Z.json
    artefakt_sha256: aa8fe17365a421adbbc7096cd88388d4eea2ce6cd43e364d757c9a76f0cddec2
    notat: >-
      Kjørt 17/9 på disponit-srv som administrator fra et FULLT utsjekk av 9bb3082a mot en FERSK testbase med alle rolle-DSN-ene: 5452 tester, 0 feilet, 0 hoppet; M-57-andelen 398 av 398, exitkode 0. Første kjøring falt i andelen alene på et grant test_pr008 hadde strippet (rettighetspasset er nå én funksjon deployen og testene deler); denne kjøringen er etter fiksen.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 17/9 I M-02s FORDELINGSFORM: golden v3 (ankeret i produksjonsform —
    # teksten + hilsen med navnet blindingen maskerer) som én bunt på 240
    # søknader (24 tekster × 10) gjennom døra på verten, oppdrag 148.
    # Tallene er regnet av kandidatartefaktene og re-summert av porten;
    # begge datasett-digestene er treets; hver tekst fikk nøyaktig én dom
    # over alle ti gjentakene. v2 (31/8) var målt på de nakne tekstene og
    # dømte fem av dem annerledes — v2-dommen står i v3s notat.
    status: ja
    krav_id: m57-datasett-v1
    bevismaalinger:
      - maalt.bunt_soknader
      - maalt.fasitavvik
      - maalt.datasett_sha_lokal
      - maalt.datasett_sha_staging
    artefakt: deploy/staging/artefakter/m57-datasett-v1-20260917T172616Z.json
    artefakt_sha256: e9e2569c558d0953e3a6e97850a7cfd561395538452ee2ac3314d37f6e8f2023
    notat: >-
      Oppdrag 148 i t-m57fasit, 17/9: 240 søknader, 0 avvik fra
      ankeret, 0 umatchet, én dom per tekst; datasett-sha lik
      lokalt og på staging (563658de9d8c). Harnessen
      (bestilling + produsent) er bevisrot.
  revisjonslogg_korrekt:
    # MÅLT 17/9 PÅ disponit-srv etter migrasjon 211. Punktet sto `nei`
    # fordi PRODUKTET manglet halvparten: signeringen skrev bare
    # `utsendingssignatur`, frigivelsen bare `utsendingsfrigivelse`, og
    # ingen av dem ble en hendelse med identitet i loggen §6 peker på.
    # 211 gjør evidensen til en TRIGGER på de to tabellene — et kallsted
    # kan glemmes i neste vei som skriver raden, en trigger kan ikke.
    # Identiteten er SIGNATARENS også for frigivelsen: den fødes av
    # utsenderen, men 056 slipper ingen frigivelse gjennom uten signatur
    # på nøyaktig det innholdet. Avskruingskravet er snudd (#159 rev døra
    # ned): null avskruinger, og at døra fortsatt svarer kodet 409 måles
    # av porten.
    status: ja
    krav_id: m57-revisjon-v1
    bevismaalinger:
      - maalt.revisjon_signaturer
      - maalt.revisjon_frigivelser
      - maalt.revisjon_hendelser_uten_identitet
      - maalt.revisjon_avskruinger
    artefakt: deploy/staging/artefakter/m57-revisjon-v1-20260917T214741Z.json
    artefakt_sha256: a75b976c0ded751d062e0a1d27a546e5f7efe18a2e3ddf30c2895399ccebb099
    notat: >-
      Tenant t-m57rev-29ac13, 17/9: liste signert av et menneske med
      aktivt medlemskap og frigitt av senderrollen gjennom dørene.
      1 signaturhendelse, 1 frigivelseshendelse,
      0 uten identitet, 0 avskruinger; begge triggerne på
      tabellene, og en UPDATE mot hendelsen ble avvist.
  feilinjisering_til_unntakskø:
    # INJISERT 17/9 PÅ disponit-srv (`m57-feilinjisering.py`): én giftig bunt
    # (arkivmedlem 8 MiB nuller, over komprimeringsgrensen 100:1) bestilt
    # som kundens bestilling. Arbeideren reiste Buntfeil → Kjoringsfeil og
    # kvitterte `feilet` med kode (SP-3: rent utfall, ingen promotert
    # liste); API-et satte oppdraget `feilet` og — kontrakten er
    # kompenserende — fødte saken i M-37s kø bundet til oppdraget
    # (`sak_for_oppdrag`, årsak utforelse_feilet; #552, migrasjon 209).
    status: ja
    krav_id: m57-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_jobber
      - maalt.unntakskoe_poster
      - maalt.koeposter_uten_jobbinding
    artefakt: deploy/staging/artefakter/m57-feilinjisering-v1-20260917T182951Z.json
    artefakt_sha256: a9efd836718cf213d73f9ef3f2d96d9cee6267f0be852d8d734df11dc382744f
    notat: >-
      Oppdrag 154 i t-m57fasit, 17/9: feilet (kjoring_avbrutt) etter
      15 s, 0 promoterte artefakter, 1 køpost bundet
      til oppdraget (sak 161, oppdrag/utforelse_feilet), 0 uten binding.
  ytelse_bestatt:
    # MÅLT 17/9 PÅ TAKET VERTEN BÆRER (eiers vedtak natt til 17/9: «vi kan
    # gå videre med maks søknader som kan godta den maskinen vi har i
    # dag»): taket er 300 (`parsing.MAKS_KANDIDATER`, bundet til grensen
    # av porten), og ÉN EKTE bunt på nøyaktig 300 gikk gjennom hele kjeden
