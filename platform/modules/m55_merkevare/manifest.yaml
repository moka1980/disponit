# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m55-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 120
# tildelt i docs/KLYNGE6-FUNDAMENT.md.
#
# v1 SENDER INGEN JURIDISK HENVENDELSE.
#
# DOMMEN: et krav sendt på et automatisk funn er en ANKLAGE MOT EN
# NAVNGITT PART — og en feilaktig anklage er ikke reversibel ved å
# trekke den. Spesifikasjonens vakt sier det rett ut: modulen
# dokumenterer og rapporterer; enhver reaksjon besluttes av menneske.
#
# v1 GJØR ÉN TING: dokumenterer funnet slik at det holder som BEVIS.
#
# HVERT FUNN HAR URL, TIDSSTEMPEL OG BEVARINGSKOPI. Uten dem er funnet
# verdiløst — og et funn som ikke kan bevises er VERRE enn ingen funn,
# fordi noen handler på det. Bevaringskopien er hele poenget: en side
# som er endret eller borte når saken tas opp, er ingen sak.
#
# FORVEKSLINGSVURDERINGEN ER DETERMINISTISK. En modul som «vurderte»
# ulikt fra gang til gang kunne ikke etterprøves, og terskelen er
# tenantens — hvor likt noe må være før det er forveksling er en
# forretnings- og juridisk vurdering, ikke en konstant.
#
# v1 GJØR INGEN UTGÅENDE FORESPØRSEL. Merk at M-19s begrunnelse ikke
# gjelder: modulen ville sendt sine EGNE merkevarenavn til et søke-API,
# ikke kundedata. Grunnen er doktrinens egen om den unødvendige
# forespørselen — og at et overvåkingsoppslag mot tredjeparts
# annonseplattformer hører hjemme i oppdragskontraktens
# `ekstern_lesing` med målautorisasjon, ikke i en modulfil.
#
# GRENSEN MOT M-37: et funn hører i unntakskøen når et menneske skal se
# på det. M-55 eier DOKUMENTASJONEN av funnet; M-37 eier køen.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m55_merkevare
navn: Merkevare- og IP-overvåker
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: grensen `m55-v1` bærer invarianten
# `forvekslingsterskel_hardkodet` — hvor likt noe må være før det er
# forveksling er tenantens vurdering, ikke en konstant.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m37_unntak
kjerne: platform/modules/m55_merkevare
i18n_prefiks: merkevare

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 20/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m55_fasit.py`:
    #
    # M-55s fasitsett: sju subjekter i tre tenanter med KJENT dom.
    #
    # Varselregisteret har seks typer, på to nivåer: merket (`funn_id IS NULL`)
    # eller funnet. Migrasjon 220 avleder husets funnform — `funntype` er
    # `varseltype`, og `subjekt` er funnet når varselet gjelder et funn, ellers
    # merket. `funn_eldre_enn_frist` kan ikke nås samme dag (se `UNAABARE`).
    #
    #   tenant a (terskel 80)
    #     1. `merkevare_uten_funn`   — aktivt merke uten ett eneste funn
    #     2. `funn_uten_vurdering`   — et funn ingen har vurdert
    #     3. `forveksling_ikke_henvist` — identisk navn (likhet 100 ≥ 80), vurdert
    #                                  og ikke henvist
    #     4. (ren)                   — som 2; funnet VURDERES mellom kjøringene
    #                                  (ulikt navn, under terskel)
    #     5. (ok)                    — et ulikt navn, vurdert under terskel
    #   tenant b (ingen grenser satt)
    #     6. `ingen_terskler`        — aktivt merke i en tenant uten terskel
    #   tenant c (terskel 70, så 75)
    #     7. `vurdering_med_utdatert_terskel` — vurdert under 70, og terskelen
    #                                  heves til 75 før første kjøring
    #
    # ULIKE TERSKLER PER TENANT: kravhendelsen bærer versjon og terskel, og to
    # tenanter med samme første krav ville delt `input_hash`.
    status: ja
    krav_id: m55-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m55-fasit-v1-20261119T225948Z.json
    artefakt_sha256: 62901aae0f5d497d63e335c2ec42be0a06e0ccfb6182fca16d2f9d15ff0df057
    notat: >-
      Runde b0adc3a4: 7 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m55-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m55-fasit-v1-20261119T225948Z.json
    artefakt_sha256: 62901aae0f5d497d63e335c2ec42be0a06e0ccfb6182fca16d2f9d15ff0df057
    notat: >-
      24 hendelser i kjeden (bevaringskopi_registrert: 5,
      forvekslingsvurdering_gjort: 4, merkevare_registrert: 7,
      merkevarefunn_registrert: 5, merkevarekrav_satt: 3), 0 uten aktør, 0
      som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m55-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m55-feilinjisering-v1-20261119T225949Z.json
    artefakt_sha256: fde339201a040f360aa19cddc11c0b78299d754389b617953c2abdea4726a813
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 12 åpne og 2 lukkede over 7 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m55-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m55-ytelse-v1-20261119T225948Z.json
    artefakt_sha256: 6e6c48d8b604f224225b0305b80dfc621395df4d2822a9f0b696e59095a2d14e
    notat: >-
      Tre kjøringer (0,0445 / 0,0290 / 0,0258 s) over 4 tenanter; den
      DÅRLIGSTE er dommen. 0,0445 s mot taket på 60 — 0,0111 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m55-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m55-rollback-v1-20261119T225952Z.json
    artefakt_sha256: a4f097300d9376c6c4c99f065badcd143c7ad28ec90d5d09fc3c5da5bbeabd8a
    notat: >-
      Drillet 77a7b249 ← forgjenger 5f57464a (ulike kjernedigester). Riggen
      hadde 0 funnrader før drillen, og den drepte kjøringen la ingen til.
      Forgjengerens bytes skrev de 6 funnene uten dubletter, og de drillede
      bytene fant 0 nye.
