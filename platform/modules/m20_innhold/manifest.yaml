# M-20 NETTSIDE- OG INNHOLDSAGENT — KLYNGE 9s ANDRE.
#
# `m20-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 134
# tildelt i docs/KLYNGE9-FUNDAMENT.md.
#
# KLYNGENS DELTE DOM: EN YTRING AVGITT I HUSETS NAVN KAN IKKE TAS
# TILBAKE. En rollback fjerner siden; den fjerner ikke at noen leste
# den og handlet på den.
#
# UTKASTFORMEN FINNES ALT, FIRE GANGER — og M-1s er ordrett M-20s.
# Verifisert mot basen: `policyutkast` har `basert_pa_versjon`,
# `basert_pa_hash`, `rollback_av_versjon`, `innholds_hash`, `status`
# og `aktivert_revisjon`. Vaktsetningens «publisering krever policy,
# forhåndsvisning og automatisk rollback» ER den formen, bygget for
# policyer. M-20 arver den og finner ikke opp en femte.
#
# DET SOM ER NYTT ER KILDEKRAVET. En policy hviler på en beslutning;
# en produktpåstand må hvile på et DOKUMENT noen kan slå opp.
# `paastand_uten_kilde` bærer samme navn i M-45s grense, fordi «ingen
# udokumenterte produktpåstander» og «ingen påstand uten datagrunnlag»
# er den samme setningen skrevet av to forfattere som ikke visste om
# hverandre.
#
# V1-DOMMEN: MODULEN PUBLISERER INGENTING SELV. Et utkast blir klart;
# aktiveringen er et menneskes.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m20_innhold
navn: Nettside- og innholdsagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
kjerne: platform/modules/m20_innhold
i18n_prefiks: innhold

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 19/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m20-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m20-suite-v1-20261119T002818Z.json
    artefakt_sha256: eadd461cff5781f141f490759a9bcbb14ead4d69e7f531be2df762741b7d59da
    notat: >-
      5524 tester, 0 feilet, 0 hoppet; modulens andel 44 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m20_fasit.py`:
    #
    # M-20s fasitsett: tre utkast og tre kilder i to tenanter med KJENT dom.
    #
    # Innholdsregisteret har seks funntyper på én generisk nøkkel,
    # `referanse` — et utkast, en kilde eller en publisering etter typen.
    # Sveipen skriver tre av dem; de tre andre er umulige med vilje
    # (migrasjonens egen kommentar: «at de står i settet OG er umulige er hele
    # beviset»).
    #
    #   tenant A (kilder gyldige 365 døgn, visning 60 min, varsel 30 døgn)
    #     1. `klart_utkast_uten_forhaandsvisning` — merket klart, aldri sett
    #     2. `kilde_utloper_snart_uavklart`       — kilden gjelder 5 døgn til og
    #                                                bærer en publisert påstand
    #     3. (ren)                                — som 1; vises MELLOM
    #                                                kjøringene
    #     4. (k_lang)                             — kilden gjelder 365 døgn
    #     5. (ok)                                 — klart og vist, ikke publisert
    #
    #   tenant B (INGEN krav)
    #     6. (k_b)                                — en kilde sveipen aldri skal
    #                                                røre: den går bare over
    #                                                tenanter med krav
    #
    # BARE A HAR KRAV, MED VILJE. Kravhendelsen i `m20_sett_krav` bærer bare
    # versjonsnummeret (ingen tenant, ingen verdier), så første krav i to
    # tenanter gir alltid samme `input_hash` — evidenskjeden ville målt en
    # kollisjon riggen selv laget.
    #
    # Hvert utkast er sin egen side: et utkast på en side som alt har et
    # utkast i arbeid, ville bygget på det.
    status: ja
    krav_id: m20-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m20-fasit-v1-20261118T223851Z.json
    artefakt_sha256: 8128146cc31a5aabfebb369b7a8385c53de3950fbe101266e242a028eaec7743
    notat: >-
      Runde bfaed9e2: 6 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m20-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m20-fasit-v1-20261118T223851Z.json
    artefakt_sha256: 8128146cc31a5aabfebb369b7a8385c53de3950fbe101266e242a028eaec7743
    notat: >-
      20 hendelser i kjeden (merk_klar: 4, publiser: 1, registrer_kilde: 3,
      registrer_paastand: 4, registrer_utkast: 4, registrer_visning: 3,
      sett_krav: 1), 0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m20-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m20-feilinjisering-v1-20261118T223851Z.json
    artefakt_sha256: ff0542449f767671acdff3a10fa593be2e8b71189288f3fe906a0b288fea898d
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 35 åpne og 4 lukkede over 24 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m20-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m20-ytelse-v1-20261118T223851Z.json
    artefakt_sha256: d390068b35f17f428a6e8cea5b1f937b9c1c007b4964069c7edd0c305341a9a2
    notat: >-
      Tre kjøringer (0,0241 / 0,0231 / 0,0225 s) over 23 tenanter; den
      DÅRLIGSTE er dommen. 0,0241 s mot taket på 60 — 0,0010 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m20-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m20-rollback-v1-20261118T223853Z.json
    artefakt_sha256: adc4b8029498267afd6d6ec85a9d892558c1cc8d224d86275d3787b60587f23a
    notat: >-
      Drillet 4ce84f81 ← forgjenger 5f57464a (ulike kjernedigester). Riggen
      hadde 0 funnrader før drillen, og den drepte kjøringen la ingen til.
      Forgjengerens bytes skrev de 3 funnene uten dubletter, og de drillede
      bytene fant 0 nye.
