      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m28-suite-v1-20261120T001858Z.json
    artefakt_sha256: b42f6cb2ec74c34902f881a3b8f5797b60d07f416659e2653751cf3a05510c69
    notat: >-
      5557 tester, 0 feilet, 0 hoppet; modulens andel 20 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 20/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m28_fasit.py`:
    #
    # M-28s fasitsett: fem subjekter i to tenanter med KJENT dom.
    #
    # Transportregisteret har ni funntyper. Fire er utelukket av datamodellen,
    # `krav_mangler` har ingen skriver, `land_uten_pakke` krever at en
    # plattformdom (landpakken) utløper, og `tungt_kolli_ukontrollert` kan
    # aldri stå alene på subjektet sitt (se `UNAABARE`). De to andre rigges:
    #
    #   tenant a (forslagsfrist 1 døgn)
    #     1. `apent_forslag_over_frist` — en åpen plan, eldet ti døgn
    #                                     (subjektet er planen)
    #     2. `kolli_uten_forslag`       — et kolli, eldet ti døgn, uten plan
    #                                     (subjektet er kolliet)
    #     3. (ren)                      — som 1; planen FORKASTES mellom
    #                                     kjøringene
    #     4. (ok)                       — en fersk plan, innenfor fristen
    #   tenant b (forslagsfrist 2 døgn)
    #     5. `kolli_uten_forslag`       — samme regel
    #
    # ALDEREN SETTES SOM MIGRATOR, testsuitens vei: `foreslatt_ts` og
    # `registrert` har DEFAULT now() og ingen dørparameter, og
    # `test_m28_transport.py` flytter dem med en vanlig UPDATE (M-12/M-40-
    # presedensen). Ingen vakt skrus av — tabellene har ingen på disse feltene.
    # Adressen skrives også som migrator, som i suiten: M-19s dører er ikke
    # M-28s.
    status: ja
    krav_id: m28-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m28-fasit-v1-20261119T225953Z.json
    artefakt_sha256: 60731158810c02a839b482672064e741816970669f93aabf45d10de831dc6e30
    notat: >-
      Runde 47413fdd: 5 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m28-fasit-v1
    bevismaalinger:
