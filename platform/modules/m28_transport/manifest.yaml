      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m28-feilinjisering-v1-20261119T225955Z.json
    artefakt_sha256: 272693f7c96f565cff61cd7ba08d7b244c9dcac4b6e6fb59f9f5e395e6c908ea
    notat: >-
