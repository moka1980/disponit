      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m28-fasit-v1-20261119T225953Z.json
    artefakt_sha256: 60731158810c02a839b482672064e741816970669f93aabf45d10de831dc6e30
    notat: >-
      11 hendelser i kjeden (foresla: 3, forkast: 1, registrer_kolli: 5,
      sett_krav: 2), 0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
