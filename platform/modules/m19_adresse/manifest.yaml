# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m19-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 112
# tildelt i docs/KLYNGE5-FUNDAMENT.md.
#
# NUMMERET ER NYTT, OG DET ER EN RETTING. Netthandelsmalen skrev
# «M-11 adressevalidering». M-11 ER SELVTESTEN (migrasjon 091,
# plattformskop, `it_og_drift`) — en helt annen modul, bygget for lenge
# siden. Malen navngav feil nummer, og gap-porten arvet feilen: den så
# «M-11 er referert, men har ikke manifest» og konkluderte med en
# ubygget adressemodul.
#
# M-19 er laveste ledige plass i `kunde_og_salg`, og fase 2
# («operasjoner») stemmer: adressekontroll er en standardisert
# arbeidsprosess, ikke en autopilot. Malen er rettet i samme commit.
#
# HVA POLICYEN ALT LOVER: netthandelsmalen navngir denne modulen som
# verifikatoren `v_adresse`, betrodd for `adresse_validert` — ett av tre
# vilkår for at `ordre.bekreft_og_fakturer` skal gå som `modus: auto`.
# Handlingen er M-25s, og den venter også på M-41.
#
# v1 SLÅR INGENTING OPP EKSTERNT OG ATTESTERER INGENTING.
#
# DOMMEN, OG DEN ER M-42s: «validert» uten hvem og hvordan er ikke en
# måling — det er en påstand. Et oppslag mot et adresseregister er
# dessuten en utgående kanal med persondata i, og en modul som gjorde
# det automatisk ville sendt kundens adresse ut av huset på et grunnlag
# ingen har bestemt.
#
# v1 GJØR ÉN TING: registrerer adressen SLIK DEN BLE OPPGITT, og
# hvordan et menneske eventuelt kontrollerte den — med metode og kilde.
#
# NORMALISERINGEN ERSTATTER ALDRI ORIGINALEN. En normalisert adresse er
# vår tolkning; originalen er det kunden faktisk skrev. Blander man dem,
# kan ingen etterpå se om en feillevering skyldtes kunden eller oss.
#
# GRENSEN MOT M-3: M-3 profilerer DATASETT — tomme felt, formatavvik,
# duplikater — og sier ingenting om én konkret rad. M-19 svarer på
# «ble DENNE adressen kontrollert, av hvem, hvordan». De to er ikke to
# syn på samme måling.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m19_adresse
navn: Adressevalideringsagent
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: grensen `m19-v1` bærer invarianten
# `valideringskrav_hardkodet` — hva som teller som kontrollert, og hvor
# lenge en kontroll er gyldig, er tenantens tall.
avhengigheter:
  - m01_policy                 # valideringskravet er policy, ikke en konstant
  - m02_revisjonslogg          # hver kontroll i evidenskjeden
kjerne: platform/modules/m19_adresse
i18n_prefiks: adresse

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 17/9 PÅ disponit-srv med den GENERISKE suiteprodusenten
    # (#557) — første modul som bruker den. Fersk base fra utsjekket,
    # hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m19-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m19-suite-v1-20260917T230136Z.json
    artefakt_sha256: c0cc00c714d2e2fda6e13b1598ab5dec1e74d33976efd7054389a8b9d8728928
    notat: >-
      5493 tester, 0 feilet, 0 hoppet; modulens andel
      34 tester, 0 feilet, 0 hoppet. Bevisroten dekker
      produsenten OG andelen, så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 17/9 PÅ disponit.com: settet i `m19_fasit.py` gir hver av
    # adressekontrollens fem funntyper nøyaktig ett subjekt, og ett
    # subjekt som skal være RENT. Alt gjennom modulens egne dører; sveipen
    # kalt med sin egen funksjon uten tenantkontekst, som arbeideren.
    # `ingen_krav` er en regel om TENANTEN, så settet har to tenanter.
    status: ja
    krav_id: m19-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m19-fasit-v1-20260917T224653Z.json
    artefakt_sha256: 04e4676dca5c47b068416d0a793b6986d42e36ba66eb99175325c43c3dee19dc
    notat: >-
      Runde 9a5defa6: 6 subjekter, 0 funnavvik. Første sveip ga
      6 nye funn (også det rene subjektet, som fødes ukontrollert);
      kontrollen kom mellom kjøringene, og andre sveip ga 0 nye og
      lukket 1. Dommen re-regnes av per-subjekt-tabellen.
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte — ikke lånt fra en annen måling.
    status: ja
    krav_id: m19-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m19-fasit-v1-20260917T224653Z.json
    artefakt_sha256: 04e4676dca5c47b068416d0a793b6986d42e36ba66eb99175325c43c3dee19dc
    notat: >-
      17 hendelser i kjeden (adresse_registrert: 6, adressekontroll_registrert: 4, adressekrav_satt: 1, adressesubjekt_opprettet: 6),
      0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    status: nei
    notat: >-
      KREVER: adressesveipen bygget, og at en feil i den ikke lar en
      ukontrollert adresse se kontrollert ut.
  ytelse_bestatt:
    status: nei
    notat: >-
      KREVER: pinnet grense for sveipekostnaden og en målt kjøring.
  rollback_testet:
    status: nei
    notat: >-
      KREVER: en release å rulle tilbake. Modulen har ingen.
