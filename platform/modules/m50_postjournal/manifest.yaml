# M-50 POSTJOURNAL- OG INNSYNSVAKT — OFFENTLIG ER IKKE FRITT.
#
# `m50-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 124
# tildelt i docs/KLYNGE7-FUNDAMENT.md.
#
# v1 SENDER INGEN INNSYNSBEGJÆRING OG INGEN HENVENDELSE.
#
# DOMMEN, OG DEN ER IKKE DEN NÆRLIGGENDE: postjournaler ER offentlige,
# så den vanlige innvendingen mot utgående oppslag treffer ikke. Det
# som treffer er noe annet.
#
# EN POSTJOURNAL INNEHOLDER NAVNGITTE PRIVATPERSONER. At en opplysning
# er offentlig tilgjengelig gjør den ikke fri å samle, sammenstille og
# bruke til salg — formålsbegrensningen gjelder uansett kilde, og en
# systematisk høsting er en helt annen behandling enn et enkeltoppslag
# et menneske gjør. Det er derfor modulen er en VAKT og ikke en
# høstemaskin.
#
# DERFOR: v1 REGISTRERER JOURNALPOSTER ET MENNESKE HAR HENTET, og
# knytter dem til en sak. Den henter ikke selv. Et automatisk søk mot
# hver kommunes journal hører hjemme i oppdragskontraktens
# `ekstern_lesing` med målautorisasjon og frekvensgrense — ikke i en
# modulfil, og ikke uten at formålet er skrevet ned.
#
# HVERT TREFF BÆRER FORMÅLET SITT. Uten det er sammenstillingen en
# behandling ingen kan gjøre rede for, og «vi fant det på nett» er
# ikke et rettslig grunnlag.
#
# JOURNALENS FORMAT ER KOMMUNENS, OG DET ENDRES. Klyngens delte
# invariant: hver registrering bærer kildeversjonen sin.
#
# GRENSEN MOT M-18: M-18 eier ONBOARDINGEN av en kunde vi har.
# M-50 finner en sak som KAN bli en kunde. Overgangen er et menneskes.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m50_postjournal
navn: Postjournal- og innsynsvakt
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: grensen `m50-v1` bærer invarianten
# `treff_uten_formaal` — en sammenstilling av offentlige data uten et
# skrevet formål er en behandling ingen kan gjøre rede for.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m30_personvern
  - m37_unntak
kjerne: platform/modules/m50_postjournal
i18n_prefiks: postjournal

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m50_fasit.py`:
    #
    # M-50s fasitsett: fire kilder, to poster og fem personer med KJENT dom.
    #
    # Postjournalregisteret har seks funntyper over TRE subjektslag: kilden
    # (`kilde_id`), posten (`post_id`) og personen i posten (`person_id`).
    # Funnraden bærer NØYAKTIG én av nøklene (`journalfunn_en_noekkel`), så
    # subjektet leses som `coalesce(kilde_id, post_id, person_id)`.
    #
    #   kilde   1. `kilde_utloper_snart`   — gyldig til om 5 døgn (varsel 60)
    #           2. `kilde_utlopt`          — satt utløpt etter at en post ble
    #                                        registrert mot den
    #           3. `ingen_krav`            — tenant B har ingen krav
    #           4. (k_gyldig)              — uten sluttdato; postenes hjem
    #   post    5. `post_mot_utlopt_kilde` — posten mot den utløpte kilden
    #           6. (p_gyldig)              — posten mot den gyldige kilden
    #   person  7. `slettefrist_passert`   — frist for 5 døgn siden
    #           8. `slettefrist_naermer_seg` — frist om 10 døgn (varsel 30)
    #           9. (ren)                   — passert, ANONYMISERES mellom
    #                                        kjøringene
    #          10. (beholdes)              — frist om 200 døgn
    #          11. (i_utlopt)              — personen i posten mot den utløpte
    #                                        kilden, frist om 200 døgn
    #
    # REKKEFØLGEN ER EN AVHENGIGHET, som i M-47: `m50_registrer_post` nekter
    # uten krav og mot en kilde som ikke gjelder. Posten mot den utløpte
    # kilden registreres mens den gjelder, og kilden avvikles etterpå.
    #
    # PERSON-ID-ENE LAGES AV DØRA. Riggen slår dem opp etter navn gjennom
    # `m50_personene`, som er lesedøra flaten bruker.
    status: ja
    krav_id: m50-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m50-fasit-v1-20261118T220848Z.json
    artefakt_sha256: 8a0df1b057b586e792e95d870057812c010d83d2ff4ee70d31544cbd876a9160
    notat: >-
      Runde 01de8ddf: 11 subjekter, 0 funnavvik. Det rene subjektet fikk
      funn i første sveip og ble rettet mellom kjøringene; andre sveip
      lukket det (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m50-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m50-fasit-v1-20261118T220848Z.json
    artefakt_sha256: 8a0df1b057b586e792e95d870057812c010d83d2ff4ee70d31544cbd876a9160
    notat: >-
      10 hendelser i kjeden (kilde_avvikles: 1, kilde_registrert: 4,
      krav_satt: 1, person_anonymisert: 1, post_registrert: 2,
      sak_opprettet: 1), 0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m50-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m50-feilinjisering-v1-20261118T220849Z.json
    artefakt_sha256: 97a23c2d0611f4e013c0402aa3187d69b5db288951c0876539aae4f606af5e90
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 13 åpne og 2 lukkede over 5 tenanter, talt per funntype.
