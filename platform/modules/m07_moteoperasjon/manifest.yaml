# M-7 MØTEOPERASJONSAGENT — KLYNGE 9s FØRSTE.
#
# `m7-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 133
# tildelt i docs/KLYNGE9-FUNDAMENT.md. BYGGES FØRST i klyngen.
#
# KLYNGENS DELTE DOM: EN YTRING AVGITT I HUSETS NAVN KAN IKKE TAS
# TILBAKE — og den som leser den vet ikke at en maskin skrev den.
#
# M-7 BYGGES FØRST AV TO GRUNNER. Den er DEN SISTE FASE-1-MODULEN I
# HELE KATALOGEN — katalogens egen rekkefølge sier den er overmoden.
# Og den bygger OPPTAKSHJEMMELEN som M-43 arver: to modeller for samme
# hjemmel ville gitt to svar på «hadde vi lov».
#
# SAMTYKKEREGISTERET FINNES, MEN DET ER MARKEDSFØRINGENS. Verifisert
# mot basen: `samtykkehendelse` (M-44, 114) er nøklet på
# `mottaker_id`, `kanal` og `formal` — den svarer på «har vi lov til å
# sende dette», ikke på «har vi lov til å ta opp denne samtalen». Et
# fundament som stoppet ved navnet ville tildelt feil register.
#
# M-8 ER EN NABO, IKKE ET FUNDAMENT. `m8_slot`/`m8_slotvalg` (082) er
# tidsbooking mot eksterne — «finn et tidspunkt som passer». M-8 finner
# tidspunktet, M-7 eier det som skjer i møtet. En modul som utvidet
# slotregisteret til å bære referater ville gjort tidsbooking til
# møteledelse i stillhet.
#
# V1-DOMMEN: MODULEN FATTER INGEN BESLUTNING. En «beslutning» i et
# referat er noe MENNESKER tok; modulen kan skrive den ned, ikke fatte
# den. Og «lav sikkerhet merkes som ubekreftet» er vaktsetningens
# egen: et referat som utelater at maskinen var usikker, er en påstand
# om at den ikke var det.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m07_moteoperasjon
navn: Møteoperasjonsagent
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m08_kalender
kjerne: platform/modules/m07_moteoperasjon
i18n_prefiks: mote

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m07_fasit.py`:
    #
    # M-07s fasitsett: seks subjekter i to tenanter med KJENT dom.
    #
    # Møteregisteret har fire funntyper på `referanse` (møte-, aksjons- eller
    # punkt-id som tekst). Sveipen kan reise tre av dem; den fjerde er
    # utelukket av datamodellen (se `UNAABARE`). Kravene er satt så lavt
    # dørene tillater: referat- og aksjonsfrist 1 døgn, sikkerhetsterskel 7000
    # basispunkter.
    #
    #   tenant A
    #     1. `mote_uten_referat`         — møtet sluttet for 5 døgn siden
    #     2. `aksjon_over_frist`         — frist for 5 døgn siden, på et møte
    #                                      med et sikkert referatpunkt
    #     3. `ubekreftet_punkt_uavklart` — punkt ført med 1000 bp sikkerhet
    #     4. (ren)                       — som 1; får et referatpunkt MELLOM
    #                                      kjøringene
    #     5. (ok)                        — møtet sluttet i går for 5 døgn siden
    #                                      og har et sikkert referatpunkt
    #   tenant B
    #     6. `mote_uten_referat`         — samme regel i en annen tenant
    #
    # DØRENE TAR DATOENE: møtets start og slutt og aksjonens frist er
    # parametre, så riggen trenger verken bakdatering eller å vente et døgn.
    status: ja
    krav_id: m07-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m07-fasit-v1-20261119T142500Z.json
    artefakt_sha256: 78066cabd3a28c0fdae836905685b544a0289ef13294ee86b477ac53783ca821
    notat: >-
      Runde 406c88de: 6 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m07-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m07-fasit-v1-20261119T142500Z.json
    artefakt_sha256: 78066cabd3a28c0fdae836905685b544a0289ef13294ee86b477ac53783ca821
    notat: >-
      13 hendelser i kjeden (registrer_aksjon: 1, registrer_mote: 6,
      registrer_referatpunkt: 4, sett_krav: 2), 0 uten aktør, 0 som deler
      input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m07-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m07-feilinjisering-v1-20261119T142501Z.json
    artefakt_sha256: 343a38514fffe7567af4b66e3676d4cf9fbf1c90e01695acd726455b158e9c6d
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 34 åpne og 4 lukkede over 17 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m07-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m07-ytelse-v1-20261119T142500Z.json
    artefakt_sha256: 850242495064cd23b1d2bc63f8327045fc0098bf8d1389dd15010fd1031199c9
    notat: >-
      Tre kjøringer (0,0226 / 0,0192 / 0,0208 s) over 15 tenanter; den
      DÅRLIGSTE er dommen. 0,0226 s mot taket på 60 — 0,0015 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m07-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m07-rollback-v1-20261119T142502Z.json
    artefakt_sha256: 12632ae24bd641c78b8c5fe3ae2d06a727cc4dd679c36e4485b41a4149a5490b
    notat: >-
      Drillet a4cc8d58 ← forgjenger 5f57464a (ulike kjernedigester). Riggen
      hadde 0 funnrader før drillen, og den drepte kjøringen la ingen til.
      Forgjengerens bytes skrev de 5 funnene uten dubletter, og de drillede
      bytene fant 0 nye.
