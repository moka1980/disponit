# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m13-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 101
# tildelt i docs/KLYNGE3-FUNDAMENT.md.
#
# V1 ER AVSTEMMINGSREGISTERET. Katalogen lover automatisk bokføring ved
# full match. v1 BOKFØRER IKKE. Den registrerer bankposter og bilag,
# regner matchen, og viser de UAVSTEMTE postene med alder.
#
# DOMMEN: en automatisk bokføring er en skriving i regnskapet, og et
# regnskap som endres av noe ingen leste er ikke et regnskap. Å se de
# uavstemte postene er dessuten det som gjør matchreglene målbare —
# uten en målt treffrate er en autobokføring et veddemål.
#
# GRENSEN MOT M-23: M-13 eier BANKPOSTER — det som har skjedd på konto.
# M-23 eier FORDRINGER — det kunden skylder. En innbetaling er begge
# deler sett fra hver sin side, og v1 kobler dem IKKE automatisk:
# koblingen er et forslag i registeret, aldri en postering.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m13_avstemming
navn: Bankavstemmingsagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELL, MÅLT avhengighet: hver registrering og hver avstemmingsdom
# bokføres i evidenskjeden (m02) — en avstemming som ikke kan gjenfinnes
# er ikke en avstemming, den er en påstand.
avhengigheter:
  - m02_revisjonslogg          # registrering og avstemmingsdom i evidenskjeden
kjerne: platform/modules/m13_avstemming
i18n_prefiks: avstemming

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 18/9 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m13-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m13-suite-v1-20260918T081530Z.json
    artefakt_sha256: 94de86d852d9a914a4ae37b622caf564dbbc902d50984d9d806a3d70bb6e9118
    notat: >-
      5522 tester, 0 feilet, 0 hoppet; modulens andel 30 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/9 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet i `m13_fasit.py` gir hver av avstemmingsregisterets tre
    # funntyper nøyaktig ett objekt, og tre objekter som skal være rene.
    #
    # MODULEN HAR INGEN TERSKELTABELL: grensen er en sveipeparameter,
    # så settet måles mot modulens egen standardverdi på 30 døgn — den
    # samme arbeideren bruker. Den andre tenanten er derfor ikke der for
    # en regel om tenanten, slik den er i M-19 og M-27, men for å måle
    # at sveipen faktisk er KRYSS-TENANT: det forfalte bilaget ligger
    # alene der, og en sveip som bare så den første tenanten ville
    # mistet det.
    #
    # POSTEN SOM DEKKER er bokført like gammel som den uavstemte — det
    # eneste som skiller dem er avstemmingen. Sto den innenfor grensen i
    # stedet, ville raden vært ren uansett, og kontrollen hadde ikke
    # målt noe.
    status: ja
    krav_id: m13-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m13-fasit-v1-20260918T074211Z.json
    artefakt_sha256: e4517bc1e932f941c41112e140e30a754086ed963f04b9a408bdb5c44133db5b
    notat: >-
      Runde 8d6dad55: 6 objekter, 0 funnavvik. Første sveip ga 4 nye
      funn — også den rene posten, som fødes uavstemt og 60 døgn gammel.
      Avstemmingen som gjør den ren kom mellom kjøringene, mot et bilag
      med forfall fram i tid, og andre sveip ga 0 nye og lukket 1.
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m13-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m13-fasit-v1-20260918T074211Z.json
    artefakt_sha256: e4517bc1e932f941c41112e140e30a754086ed963f04b9a408bdb5c44133db5b
    notat: >-
      9 hendelser i kjeden (avstemming.opprettet: 2,
      bankpost.registrert: 3, bilag.registrert: 3, konto.registrert: 1),
      0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m13-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m13-feilinjisering-v1-20260918T074331Z.json
    artefakt_sha256: 59ca2e6f01aeaa65be3332917f70b2daef49502b3d480259a1966cc04126a6f7
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 34 åpne og 3 lukkede over 20 tenanter, talt per funntype.
      Tenantlisten er en UNION av bankposter og bilag; med bare den ene
      tabellen ville målingen mistet hver tenant som bare har bilag.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m13-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m13-ytelse-v1-20260918T074211Z.json
    artefakt_sha256: ed3758dd16a656d556b93464a5ae78eaa03a9f07c8b1a604f86f595ed7e03e53
    notat: >-
      Tre kjøringer (0,0211 / 0,0168 / 0,0178 s) over 12 tenanter; den
      DÅRLIGSTE er dommen. 0,0211 s mot taket på 60 — 0,0018 s per
      tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m13-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m13-rollback-v1-20260918T074213Z.json
    artefakt_sha256: 78710713ef2b239c0b860c291c4f93450c5592274a3b9937b87bd9e1d034b648
    notat: >-
      Drillet 745fafd8 ← forgjenger 5f57464a (ulike kjernedigester).
      Riggen hadde 0 funnrader før drillen, og den drepte kjøringen la
      ingen til. Forgjengerens bytes skrev de 4 funnene uten dubletter,
      og de drillede bytene fant 0 nye.
