# M-52 TOLL- OG HS-KODEAGENT — FEIL KODE GIR BOT, IKKE FORSINKELSE.
#
# `m52-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 122
# tildelt i docs/KLYNGE7-FUNDAMENT.md.
#
# v1 DEKLARERER INGENTING.
#
# DOMMEN: en HS-kode er en RETTSLIG PÅSTAND om hva en vare er.
# Spesifikasjonen sier det rett ut — feil kode gir bot, ikke bare
# forsinkelse — og boten treffer kunden, ikke oss. v1 foreslår, og
# forslaget er ikke en deklarasjon.
#
# ET FORSLAG UTEN GRUNNLAG ER VERRE ENN INGEN FORSLAG. En kode et
# menneske stempler fordi den sto der, produserer falsk trygghet: den
# ser like ferdig ut som en kode noen har tenkt på. Derfor bærer hvert
# forslag HVA det hviler på — hvilken nomenklaturversjon, hvilken
# regeltekst, hvilken tidligere klassifisering — og døra NEKTER å
# foreslå når grunnlaget er tynt.
#
# HS-NOMENKLATUREN REVIDERES. Klyngens delte invariant: hvert forslag
# bærer nomenklaturversjonen sin, og en versjon som er utløpt gjør
# forslaget til et sveipefunn.
#
# GRENSEN MOT M-28: M-28 eier TRANSPORTEN — hvor varen er og når den
# kommer. M-52 eier FORTOLLINGEN — hva varen er, rettslig. En vare kan
# være framme og feilklassifisert.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m52_tollkode
navn: Toll- og HS-kodeagent
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: grensen `m52-v1` bærer invarianten
# `forslag_uten_grunnlag` — en kode uten hva den hviler på er en
# gjetning i rettslig form.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m37_unntak
kjerne: platform/modules/m52_tollkode
i18n_prefiks: tollkode

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m52_fasit.py`:
    #
    # M-52s fasitsett: fire nomenklaturer og fem forslag med KJENT dom.
    #
    # Tollregisteret har sju funntyper over tre nøkler; settet bruker to:
    # nomenklaturen (`nomenklatur_id`) og forslaget (`forslag_id`). Subjektet
    # leses som `coalesce(nomenklatur_id, vare_id, forslag_id)`.
    #
    #   nomenklatur 1. `nomenklatur_utloper_snart` — gyldig til om 5 døgn
    #               2. `nomenklatur_utlopt`        — avviklet etter forslaget;
    #                                                eget system (`kn`), så
    #                                                ingenting avløser den
    #               3. `ingen_krav`                — tenant B har ingen krav
    #               4. (n_gyldig)                  — `hs` uten sluttdato
    #   forslag     5. `forslag_under_terskel`     — 50 % mot terskel 70
    #               6. `forslag_ikke_klart`        — 90 %, ikke merket klart
    #               7. `forslag_mot_utlopt_nomenklatur` — 90 %, merket klart
    #                                                FØR nomenklaturen avvikles
    #               8. (ren)                       — 90 %, ikke klart; merkes
    #                                                klart MELLOM kjøringene
    #               9. (ok)                        — 90 %, merket klart
    #
    # Hver vare har ett forslag, og sveipen leser det NYESTE per vare.
    #
    # To ting avgjør rekkefølgen. `m52_avgi_forslag` og `m52_merk_klart`
    # nekter mot en nomenklatur som ikke gjelder, så forslaget mot den
    # utløpte avgis OG merkes klart før avviklingen — uten klarmerkingen ville
    # det også fått `forslag_ikke_klart`. Og en utløpt nomenklatur er bare et
    # funn når ingen gyldig nomenklatur av SAMME system har avløst den.
    status: ja
    krav_id: m52-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m52-fasit-v1-20261118T221953Z.json
    artefakt_sha256: 6f06acf6106c81caa495af33594d2347486875af9bc1da60e9ac1a8794d27c11
    notat: >-
      Runde 4943fe63: 9 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
