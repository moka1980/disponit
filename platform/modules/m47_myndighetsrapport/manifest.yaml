    artefakt_sha256: 6396e7d5df240c273d35fe76dc2c09763122e27862af15e52ad57c80c1b3a31f
    notat: >-
      Drillet 5ec3c23a ← forgjenger 5f57464a (ulike kjernedigester). Riggen
