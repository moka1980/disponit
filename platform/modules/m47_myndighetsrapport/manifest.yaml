# M-47 MYNDIGHETSRAPPORTERINGSAGENT — FRISTEN ER PRODUKTET.
#
# `m47-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 123
# tildelt i docs/KLYNGE7-FUNDAMENT.md.
#
# v1 SENDER INGEN INNSENDING.
#
# DOMMEN: en innsending til en myndighet er BINDENDE og kan ikke
# kalles tilbake. Feil tall i en pålagt rapport er ikke en feil man
# retter — det er en korrigert innsending med sin egen historikk, og i
# noen tilfeller et avvik myndigheten ser.
#
# MEN HER ER FRAVÆRET IKKE NOK, OG DET SKILLER M-47 FRA KLYNGE 6.
#
# For de fem i klynge 6 var skaden å HANDLE. Her er skaden også å LA
# VÆRE: en frist som går uten innsending er nøyaktig det modulen ble
# bygget for å hindre. En modul som klargjør et utkast og lar fristen
# passere i stillhet, har forårsaket skaden den skulle avverge.
#
# DERFOR ER v1s PRODUKT FRISTVAKTEN, ikke dokumentet. Utkastet er
# sekundært; det som må virke er at ingen frist går uten at et
# menneske har sett den. En stille M-47 er verre enn ingen M-47.
#
# INNSENDINGSKRAVET ER MYNDIGHETENS, OG DET ENDRES. Klyngens delte
# invariant: hver plikt bærer hjemmelen og versjonen sin, og en plikt
# som ikke er bekreftet innenfor sitt gyldighetsvindu er et sveipefunn.
#
# GRENSEN MOT M-34: M-34 eier SERTIFISERING og etterlevelse av
# standarder man velger. M-47 eier PÅLAGTE innsendinger med frist. Den
# ene er noe man kan la være; den andre er ikke.
#
# GRENSEN MOT M-21: M-21 eier avtalefrister — våre egne kontrakter.
# M-47s frister er lovpålagte, og forskjellen er hvem som sanksjonerer.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m47_myndighetsrapport
navn: Myndighetsrapporteringsagent
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: grensen `m47-v1` bærer invarianten
# `frist_uten_varsel` — en frist ingen har sett er hele skaden.
avhengigheter:
  - m01_policy
  - m02_revisjonslogg
  - m37_unntak
kjerne: platform/modules/m47_myndighetsrapport
i18n_prefiks: myndighetsrapport

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m47_fasit.py`:
    #
    # M-47s fasitsett: fire regelverk og fem rapportplikter med KJENT dom.
    #
    # Myndighetsregisteret har seks funntyper over TO subjektslag: tre gjelder
    # regelverket (`regelverk_id`), tre gjelder plikten (`rapportplikt_id`).
    # `ingen_krav` kan stå på begge, men settet gir den bare til et regelverk.
    # Funnraden bærer NØYAKTIG én av nøklene (`myndighetsfunn_en_noekkel`), så
    # subjektet leses som `coalesce(regelverk_id, rapportplikt_id)`.
    #
    #   regelverk  1. `regelverk_utloper_snart` — gyldig til om 5 døgn
    #              2. `regelverk_utlopt`        — satt utløpt etter at en plikt
    #                                              ble registrert mot det
    #              3. `ingen_krav`              — tenant B har ingen krav
    #              4. (rv_gyldig)               — uten sluttdato; pliktenes hjem
    #   plikt      5. `frist_passert_uten_bevis` — frist for 5 døgn siden
    #              6. `frist_naermer_seg`        — frist om 5 døgn (varsel 14)
    #              7. `plikt_mot_utlopt_regelverk` — frist om 200 døgn
    #              8. (ren)                     — passert, får bevis MELLOM
    #                                              kjøringene
    #              9. (levert)                  — passert, men med bevis fra før
    #
    # REKKEFØLGEN ER EN AVHENGIGHET. `m47_registrer_plikt` nekter uten krav
    # og mot et regelverk som ikke gjelder. Plikten mot det utløpte regelverket
    # registreres derfor MENS det gjelder, og `m47_sett_gyldig_til` gjør det
    # utløpt etterpå — som en myndighet som kunngjør at et skjema avvikles.
    #
    # Alle datoer bygges i SQL (`current_date ± n`), aldri i Python.
    status: ja
    krav_id: m47-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m47-fasit-v1-20261118T220520Z.json
    artefakt_sha256: 74d242fed21ab2b886e88c6327b21964075061067a460d62e068fe267069f128
    notat: >-
      Runde ebad11a6: 9 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m47-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m47-fasit-v1-20261118T220520Z.json
    artefakt_sha256: 74d242fed21ab2b886e88c6327b21964075061067a460d62e068fe267069f128
    notat: >-
      14 hendelser i kjeden (bevis_registrert: 2, krav_satt: 1,
      plikt_registrert: 5, plikttype_registrert: 1, regelverk_avvikles: 1,
      regelverk_registrert: 4), 0 uten aktør, 0 som deler input_hash med en
      annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m47-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m47-feilinjisering-v1-20261118T220521Z.json
    artefakt_sha256: 31c653c8cfd5c35544be9e526bb1865a3a5abd5445124b97893c15e4749b84a7
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 23 åpne og 2 lukkede over 11 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m47-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m47-ytelse-v1-20261118T220520Z.json
    artefakt_sha256: 2ff3b6137dd8e1dc5c8586e8be6ca0e15592548c2e7e25318ca8d593fa224dfa
    notat: >-
      Tre kjøringer (0,0283 / 0,0259 / 0,0244 s) over 9 tenanter; den
      DÅRLIGSTE er dommen. 0,0283 s mot taket på 60 — 0,0031 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
