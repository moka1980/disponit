# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m24-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 105
# tildelt i docs/KLYNGE3-FUNDAMENT.md.
#
# V1 ER LEVERANDØR- OG SLA-REGISTERET. Katalogen lover
# leverandørbetaling innen policygrenser, og at agenten varsler når en
# innkjøpspris stiger over terskel. v1 BETALER INGENTING. Den
# registrerer avtalen (avtalt SLA, avtalt pris), måler den faktiske
# leveransen mot den, og gjør avvik til funn.
#
# DOMMEN: en utgående betaling er den ene handlingen i hele katalogen
# som er umulig å angre. Katalogen sier selv «innen policygrenser» —
# og de grensene må være målt før de kan settes. En terskel for
# prisstigning som ingen har målt normalvariasjonen bak, er et tall
# noen gjettet.
#
# GRENSEN MOT M-26: katalogen deler marginbeskyttelsen eksplisitt —
# M-24 OPPDAGER kostnadsøkningen, M-26 foreslår ny pris. Ingen av dem
# setter en pris. v1 holder seg på M-24s side av det snittet og
# beregner ikke ny pris i det hele tatt.
#
# GRENSEN MOT M-21: M-21 eier PLIKTER — våre frister mot omverdenen.
# M-24 eier den ANDRE veien: leverandørens forpliktelse mot oss, målt.
# Et SLA-brudd er et funn om DEM, ikke en plikt for oss.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m24_leverandor
navn: Leverandør- og innkjøpsagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter: grensen `m24-v1` bærer invarianten
# `terskel_hardkodet` — prisstigningsterskelen SKAL være en policyverdi,
# ikke en konstant i koden, av samme grunn som M-23s purretrinn: en
# terskel kodet inn er en fullmakt modulen ga seg selv. Da er m01_policy
# en reell avhengighet og ikke en høflighet, og den skal stå her.
avhengigheter:
  - m01_policy                 # terskelen er policy, ikke en konstant
  - m02_revisjonslogg          # avtale og måling i evidenskjeden
kjerne: platform/modules/m24_leverandor
i18n_prefiks: leverandor

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 18/9 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m24-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m24-suite-v1-20260918T023346Z.json
    artefakt_sha256: dd9ede3ac40943d82e6191dd872e5277f29c9dce38113c99dbd775d01065ac8d
    notat: >-
      5513 tester, 0 feilet, 0 hoppet; modulens andel 43 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/9 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet i `m24_fasit.py` gir hver av leverandørregisterets fem
    # funntyper nøyaktig én avtale, og én avtale som skal være REN.
    # Alt gjennom modulens egne dører; sveipen kalt gjennom
    # `modul.kjor()`, som arbeideren.
    #
    # FUNNTYPENE OVERLAPPER, og settet er bygget for å skille dem: hver
    # avtale som ikke skal være utløpt får `gyldig_til` godt utenfor
    # varselvinduet, og hver som ikke skal være stille får en fersk
    # leveranse.
    status: ja
    krav_id: m24-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m24-fasit-v1-20260918T014609Z.json
    artefakt_sha256: dc4ad798fd576ffbc63f8535a199760e45a83b59f72090089c91b58a5b1879bb
    notat: >-
      Runde 3808662d: 6 avtaler, 0 funnavvik. Første sveip ga 6 nye funn
      — også den rene avtalen, som fødes uten leveranser og med
      `gyldig_fra` 200 døgn tilbake. Leveransen som gjør den ren kom
      mellom kjøringene, og andre sveip ga 0 nye og lukket 1. Dommen
      re-regnes av per-subjekt-tabellen.
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m24-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m24-fasit-v1-20260918T014609Z.json
    artefakt_sha256: dc4ad798fd576ffbc63f8535a199760e45a83b59f72090089c91b58a5b1879bb
    notat: >-
      18 hendelser i kjeden (avtale.registrert: 6,
      leverandor.registrert: 6, leveranse.registrert: 5, terskler.satt:
      1), 0 uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først.
    status: ja
    krav_id: m24-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m24-feilinjisering-v1-20260918T074332Z.json
    artefakt_sha256: d712df52c621b649efd2c3607ffa93b6577b1ee8d3405a6c2885861914e89670
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 17 åpne og 2 lukkede over 7 tenanter, talt per funntype,
      fordi en sum kan stemme mens ett funn lukkes og et annet åpnes.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m24-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m24-ytelse-v1-20260918T014609Z.json
    artefakt_sha256: 683a668dc9d3dc87b11c8858bc6416ea38eb354b9d7e3a2802bc1224a2775d72
    notat: >-
      Tre kjøringer (0,0176 / 0,0183 / 0,0170 s) over 5 tenanter; den
      DÅRLIGSTE er dommen. 0,0183 s mot taket på 60 — 0,0037 s per
      tenant. Porten re-regner tallet og nekter en varighet som ikke er
      maksimum av kjøringene.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m24-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m24-rollback-v1-20260918T014807Z.json
    artefakt_sha256: d602a5981dc2fb57483408f65ff34af21e34701e33ae1b675558072a5bfc951f
    notat: >-
      Drillet ffd8cb3b ← forgjenger 5f57464a (ulike kjernedigester).
      Riggen hadde 0 funnrader før drillen, og den drepte kjøringen la
      ingen til — men arbeidernøkkelen ble først fri etter at den
      foreldreløse økten ble avsluttet: en backend som venter på lås
      merker ikke at klienten er borte. Forgjengerens bytes skrev de 6
      funnene uten dubletter, og de drillede bytene fant 0 nye.
