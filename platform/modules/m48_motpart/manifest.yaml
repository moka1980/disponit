# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m48-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 116
# tildelt i docs/KLYNGE6-FUNDAMENT.md.
#
# INGEN BRANSJEMAL NAVNGIR DENNE MODULEN. `VENTENDE` er tom; driveren
# er eierens prioritering i spesifikasjonen (v9), ikke et løfte vi alt
# har sendt ut til kunder. Det gjør tilbakeholdelsen mindre
# presserende — og desto viktigere å si tydelig hva v1 er.
#
# v1 SETTER INGEN KREDITTGRENSE OG AVSLÅR INGEN MOTPART.
#
# DOMMEN: spesifikasjonens utdata sier at kredittgrensen er «inngang
# til fordringsagenten M-23, ikke omvendt». En grense modulen satte
# selv ville altså blitt M-23s FASIT uten at et menneske hadde sett på
# den — og et avslag ville stengt en kunde ute på et tall ingen hadde
# etterprøvd.
#
# v1 GJØR TO TING: registrerer motparten med kilde og tidsstempel, og
# MÅLER den mot tenantens egen kredittpolicy. Forslaget er et forslag.
#
# HVERT OPPSLAG ER EN BEHANDLING AV PERSONDATA. Spesifikasjonens egen
# vakt krever formål, hjemmel og tidsstempel i loggen — og en rad uten
# dem er ikke en måling, det er en behandling ingen kan forsvare.
#
# v1 GJØR ETT UTGÅENDE OPPSLAG, OG BARE ETT (eierbeslutning 3/9).
# M-48 er klyngens unntak, og snittet går inne i modulen: av
# spesifikasjonens to eksterne kilder kobles FORETAKSREGISTERET på,
# mens KREDITTLEVERANDØREN holdes tilbake.
#
# Foretaksoppslaget er offentlig, uten hemmeligheter, og sender bare et
# organisasjonsnummer — offentlige foretaksdata, ikke persondata. Det
# er dessuten nødvendig i doktrinens egen forstand: motpartens roller
# og regnskapsstatus finnes ikke andre steder. Doktrinen om «den
# unødvendige forespørselen ER skaden» taler FOR dette oppslaget.
#
# Kredittleverandøren er noe annet: kommersiell, krever hemmeligheter,
# sender de reelle rettighetshavernes navn til en tredjepart, og gir en
# SCORE vi ville blitt fristet til å handle på. Spesifikasjonens egen
# vakt — «oppslag logges som behandling av persondata» — handler om
# den, ikke om et organisasjonsnummer. Porten heter
# `modulen_hentet_kredittdata`, og den står.
#
# Oppslaget som ER tillatt disiplineres av to porter:
# `oppslag_uten_ferskhetsvindu` (et oppslag på et orgnr vi alt har
# ferske data om er unødvendig — vinduet er tenantens) og
# `oppslag_mot_uregistrert_vert` (verten er én registrert konstant i
# modulen — `ssrf.py` pinner DNS og stenger ikke-routbare mål, men
# binder oss ikke til nettopp foretaksregisteret; den porten er vår).
#
# GRENSEN MOT M-23: M-23 eier FORDRINGEN — hva som faktisk skylder oss
# penger. M-48 eier MOTPARTEN og grunnlaget for hva vi tør gi den.
# v1 kobler dem ikke; koblingen er nettopp grensen vi ikke setter.
#
# GRENSEN MOT M-18: M-18 eier onboardingen av en kunde. M-48 eier
# kredittvurderingen av den. En kunde kan være onboardet uten å ha
# kreditt, og det er to forskjellige beslutninger.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m48_motpart
navn: Foretaks- og kredittvakt
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
# REELLE, MÅLTE avhengigheter: grensen `m48-v1` bærer invarianten
# `kredittpolicy_hardkodet` — hva som gir hvilken grense er tenantens
# policy, ikke en konstant i koden.
avhengigheter:
  - m01_policy                 # kredittpolicyen er policy, ikke en konstant
  - m02_revisjonslogg          # hvert oppslag i evidenskjeden
kjerne: platform/modules/m48_motpart
i18n_prefiks: motpart

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m48_fasit.py`:
    #
    # M-48s fasitsett: åtte motparter i tre tenanter med KJENT dom.
    #
    # Motpartsregisteret har åtte funntyper, alle på `motpart_id`.
    #
    #   tenant A (uvurdert etter 0 døgn)
    #     1. `uvurdert_motpart`       — registrert, aldri vurdert
    #     2. (ren)                    — som 1; får oppslag, profil og vurdering
    #                                   MELLOM kjøringene
    #   tenant B (ingen krav)
    #     3. `ingen_krav`
    #   tenant C (uvurdert etter 3650 døgn, tak 10 000 kr)
    #     4. `profil_uten_vurdering`  — profil fra registeret, ingen vurdering
    #     5. `motpart_avviklet`       — profilen sier «avviklet»; vurdert
    #     6. `forslag_over_tak`       — vurdert med 20 000 kr mot tak 10 000
    #     7. `gjentatte_oppslagsfeil` — fem feilede oppslag siste døgn
    #     8. (ok)                     — aktiv profil, vurdert under taket
    #
    # TO TENANTER MED KRAV, FORDI TO TERSKLER STRIDER. Med `uvurdert_dogn` 0
    # er hver motpart uten vurdering også uvurdert — også den som skal måle
    # `profil_uten_vurdering`. A måler uvurdert, C alt det andre.
    #
    # OPPSLAGENE GÅR GJENNOM DØRENE, ikke mot Brønnøysund: riggen reserverer
    # og fullfører selv, med svarstatusen den trenger. `oppslag_ferskhet_timer`
    # er 0, så samme motpart kan slås opp fem ganger på rad.
    status: ja
    krav_id: m48-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m48-fasit-v1-20261118T222807Z.json
    artefakt_sha256: 6315c2dc7c0aff060acb75b5ca87905f4ca10d8d2895634be6ab8153e8ced00f
    notat: >-
      Runde fc44a915: 8 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m48-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m48-fasit-v1-20261118T222807Z.json
    artefakt_sha256: 6315c2dc7c0aff060acb75b5ca87905f4ca10d8d2895634be6ab8153e8ced00f
    notat: >-
      39 hendelser i kjeden (foretaksoppslag_fullfort: 10,
      foretaksoppslag_reservert: 10, motpart_registrert: 8,
      motpartskrav_satt: 2, motpartsversjon_registrert: 5,
      motpartsvurdering_registrert: 4), 0 uten aktør, 0 som deler input_hash
      med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m48-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m48-feilinjisering-v1-20261118T222808Z.json
    artefakt_sha256: be023d20ff5bcbf039c0322bc99fbf508f80aaae46b49502ce9e759004811157
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 18 åpne og 3 lukkede over 7 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m48-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m48-ytelse-v1-20261118T222808Z.json
    artefakt_sha256: 649b82535cd9cdf2ca8f647b65403be501299e008b968347443f504d555970d2
    notat: >-
      Tre kjøringer (0,0240 / 0,0246 / 0,0255 s) over 4 tenanter; den
      DÅRLIGSTE er dommen. 0,0255 s mot taket på 60 — 0,0064 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m48-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m48-rollback-v1-20261118T222810Z.json
    artefakt_sha256: a77115396cc371d25458e7a404378c67aa7ad3d398f78041e96bdfdb7f2157e7
    notat: >-
      Drillet 2bd5fbfa ← forgjenger 5f57464a (ulike kjernedigester). Riggen
      hadde 0 funnrader før drillen, og den drepte kjøringen la ingen til.
      Forgjengerens bytes skrev de 7 funnene uten dubletter, og de drillede
      bytene fant 0 nye.
