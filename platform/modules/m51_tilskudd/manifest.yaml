    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m51-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m51-suite-v1-20261118T224854Z.json
    artefakt_sha256: f507deb6ad45258b7041af2414661e263473240e1d145bbdb2e4503c73e0b328
    notat: >-
      5522 tester, 0 feilet, 0 hoppet; modulens andel 38 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m51_fasit.py`:
    #
    # M-51s fasitsett: åtte støtteordninger med KJENT dom.
    #
    # Tilskuddsregisteret har sju funntyper, alle på `ordning_id`. Hver aktiv
    # ordning har en søknadsfrist, og to av typene leser den — så ordninger
    # som skal måle noe annet har fristen om 200 døgn, langt utenfor varselet
    # på 21. Et estimat med poster som ikke er ferdigstilt er den nøytrale
    # tilstanden: det gir verken `ingen_estimat` eller `estimat_uten_poster`.
    #
    #   1. `ingen_estimat`            — aktiv ordning uten estimat
    #   2. `estimat_uten_poster`      — estimat uten et eneste beløp
    #   3. `estimat_over_ordningstak` — sum 500 kr mot et tak på 300
    #   4. `frist_naermer_seg`        — frist om 5 døgn, estimatet ikke klart
    #   5. `frist_passert`            — frist for 5 døgn siden, ikke klart
    #   6. `ingen_krav`               — tenant B har ingen krav
    #   7. (ren)                      — uten estimat, får estimat og post
    #                                   MELLOM kjøringene
    #   8. (beholdes)                 — estimat med post, frist om 200 døgn
    #
    # Søknadsfristen er en dørparameter uten nedre grense, så både nær og
    # passert frist lages på dagen.
    status: ja
    krav_id: m51-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m51-fasit-v1-20261118T221136Z.json
    artefakt_sha256: 34300de753f208f941b5301aa866b8127043414ba9dc563953f93b613bcdf8a9
    notat: >-
      Runde 64f788aa: 8 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m51-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m51-fasit-v1-20261118T221136Z.json
    artefakt_sha256: 34300de753f208f941b5301aa866b8127043414ba9dc563953f93b613bcdf8a9
    notat: >-
      25 hendelser i kjeden (estimatpost_lagt_til: 5, kildepost_registrert:
      5, stotteordning_registrert: 8, tilskuddsestimat_opprettet: 6,
      tilskuddskrav_satt: 1), 0 uten aktør, 0 som deler input_hash med en
      annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m51-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m51-feilinjisering-v1-20261118T221137Z.json
    artefakt_sha256: fed2715240049ac37a8725033d8645065e5484e21b8e8199c9266661a44c47da
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 13 åpne og 1 lukkede over 5 tenanter, talt per funntype.
  ytelse_bestatt:
