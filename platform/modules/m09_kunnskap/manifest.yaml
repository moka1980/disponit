# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m9-v1` står i manifestskjema.KRAVGRENSER fra samme commit, og
# migrasjonsnummeret (095) er tildelt i docs/KLYNGE-FUNDAMENT.md.
#
# V1 ER ORDLISTEN MED KILDEKRAV. Katalogteksten lover også indeksering
# av intranett og filarkiv, og svar på spørsmål med presise kildepekere
# — altså en RAG-vei over en vektordatabase modulen selv oppgir som
# forutsetning. Verken søkeindeksen over eksterne kilder eller
# vektorbasen finnes.
#
# v1 bygger den delen som er ekte i dag og som resten uansett hviler
# på: et begrepsregister der HVERT begrep navngir en eier, en kilde og
# en gyldighetsdato, og et fritekstsøk over det. Fritekstsøk finnes
# ikke i plattformen fra før — ingen migrasjon har tsvector eller GIN —
# så M-9 bygger det selv, med EKSPLISITT regconfig
# (`to_tsvector('norwegian', …)`), aldri den sesjonsavhengige
# to-arguments-formen: en indeks bygget på en annen default_text_search
# _config enn spørringen er en indeks som stille slutter å treffe.
#
# DOMMEN v1 hviler på: et begrep uten kilde er urepresenterbart, og et
# begrep forbi gyldighetsdato er et FUNN — ikke en stille gammel rad.
# «Svar uten tilstrekkelig kildegrunnlag avvises» er katalogens eget
# krav; i v1 er det en NOT NULL, ikke en policy.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
# EVIDENSEN KOM 19/11 (migrasjon 212, ADR-002 D1): hver INSERT på
# `begrep` skriver én hendelse i revisjonsloggen gjennom en trigger, så
# begge dørene — og den neste — er dekket. M-9 er dermed klasse A, og
# den generiske sveiplesten gjelder (`deploy/staging/m09_fasit.py`).
id: m09_kunnskap
navn: Kunnskaps- og ordlisteagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# INGEN avhengigheter i v1: registeret er et tenant-skopet lager med
# dører og et søk. Det bestiller ingenting og beslutter ingenting.
avhengigheter: []
kjerne: platform/modules/m09_kunnskap
i18n_prefiks: kunnskap

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 19/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m09-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m09-suite-v1-20261119T103828Z.json
    artefakt_sha256: a82098a22c86fa2a606591b9fce1030dfb1a1c6a233b1243aea24e67f2c100fc
    notat: >-
      5556 tester, 0 feilet, 0 hoppet; modulens andel 38 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m09_fasit.py`:
    #
    # M-9s fasitsett: seks begreper i to tenanter med KJENT dom.
    #
    # Begrepsregisteret har to funntyper, begge på `begrep_id`, og sveipen ser
    # bare den GJELDENDE versjonen av hvert begrep. Varselvinduet er 30 døgn
    # (`begrepssveip.VARSELVINDU_DOGN`).
    #
    #   tenant A
    #     1. `utlopt`         — gyldig til for 5 døgn siden
    #     2. `utloper_snart`  — gyldig til om 10 døgn
    #     3. (ren)            — som 1; får en NY VERSJON mellom kjøringene,
    #                           gyldig ett år fram
    #     4. (ok)             — gyldig til om ett år
    #   tenant B
    #     5. `utlopt`         — samme regel i en annen tenant
    #     6. (ok)             — som 4
    #
    # DØRENE ER DEPLOYENS, IKKE RUNTIMES. v1 har ingen HTTP-skrivevei (095):
    # ordlisten fylles gjennom dørene av en sporet deploy-handling. Riggen
    # kaller dem derfor som registerets eier, med migratortilkoblingen — den
    # samme veien en deploy går. Evidensen skrives av triggeren i 212, ikke av
    # riggen.
    #
    # DEN RENE ER EN NY VERSJON, ikke en redigering: den gamle raden består
    # uendret med `gjeldende = false`, og funnet på den gamle `begrep_id`
    # skal lukkes fordi den ikke lenger er gjeldende. Den nye versjonen får
    # ingen funn.
    status: ja
    krav_id: m09-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m09-fasit-v1-20261119T102242Z.json
    artefakt_sha256: 3bd85e1de7ae051bec03960362c0c67728b6d03a95d3c5786e7ff4201a2d8a3a
    notat: >-
      Runde 54a37232: 6 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m09-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m09-fasit-v1-20261119T102242Z.json
    artefakt_sha256: 3bd85e1de7ae051bec03960362c0c67728b6d03a95d3c5786e7ff4201a2d8a3a
    notat: >-
      7 hendelser i kjeden (begrep.ny_versjon: 1, begrep.registrert: 6), 0
      uten aktør, 0 som deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m09-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m09-feilinjisering-v1-20261119T102243Z.json
    artefakt_sha256: 9c18efefcf67fcff90f51860e34ab70deea3d6e814a0922565cd60b1449907e1
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 7 åpne og 1 lukkede over 4 tenanter, talt per funntype.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m09-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m09-ytelse-v1-20261119T102242Z.json
    artefakt_sha256: a06d7beeb43ff5c966af68759c6e1523f8344eeb55688c423633f07ee29b2527
    notat: >-
      Tre kjøringer (0,0104 / 0,0099 / 0,0077 s) over 2 tenanter; den
      DÅRLIGSTE er dommen. 0,0104 s mot taket på 60 — 0,0052 s per tenant.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    status: ja
    krav_id: m09-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m09-rollback-v1-20261119T102312Z.json
    artefakt_sha256: 1faf3e7922bf92203f741317daa81922f69fb60d183f837f570cebc89df544b6
    notat: >-
      Drillet 8a322b55 ← forgjenger 5f57464a (ulike kjernedigester). Riggen
      hadde 0 funnrader før drillen, og den drepte kjøringen la ingen til.
      Forgjengerens bytes skrev de 4 funnene uten dubletter, og de drillede
      bytene fant 0 nye.
