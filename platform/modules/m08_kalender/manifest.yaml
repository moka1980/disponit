# M-8 Kalender- og kapasitetsagent — modulmanifest (DOM 1: egen
# modulmappe med manifest fra dag én).
#
# v1 er KUN tidsvalg-benen M-57s invitasjoner trenger (082): kunden
# definerer intervjuslots per prosess, kandidaten velger uten innlogging
# bak kapabilitetstoken, kunden ser valgene. Ingen kalenderskriving mot
# kundens kalender, ingen ICS, ingen oppdragstype — og derfor heller
# ingen registrering i modulregisteret ennå: M-57s manifest får INGEN
# registry-avhengighet på M-8 (DOM 1), koblingen er utsenderens kall til
# den claimer-eide utstederdøren, målt i testene, aldri en
# katalogpåstand.
#
# ADR-002 (19.11.2026): M-8 er klasse C. Fra 214 skriver hver skrivende
# vei sin hendelse i evidenskjeden, og lesten er
# `deploy/staging/m08-lest.py` (M-57-kjeden gjennom testsuitens hjelpere).
#
# Status er UNDER_UTVIKLING til en M-8-aksept er kjørt og skrevet i
# basen — flippen er katalogens AVLESNING av en aksepthendelse, aldri en
# påstand i forkant (m56/m02-formen, som M-57s eget manifest).
id: m08_kalender
navn: Kalender- og kapasitetsagent (M-8)
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
avhengigheter:
  - m02_revisjonslogg          # én skrivevei til evidenskjeden
kjerne: platform/modules/m08_kalender
i18n_prefiks: m08kalender

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 19/11 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m08-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m08-suite-v1-20261119T131841Z.json
    artefakt_sha256: bc19481bc4bc87274e5dfb235679c7bae3ae79ba4101dd44911d3a46a6cdb22d
    notat: >-
      5556 tester, 0 feilet, 0 hoppet; modulens andel 20 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med `deploy/staging/m08-lest.py` (ADR-002
    # klasse C) i den isolerte basen på 55432. Riggen går M-57-kjedens lovlige
    # vei (prosess, kandidater, signert liste, token) gjennom testsuitens egne
    # hjelpere, med tenanten byttet per kjøring.
    status: ja
    krav_id: m08-fasit-v1
    bevismaalinger:
      - maalt.tilstandsavvik
      - maalt.utfall_lik_fasit
      - maalt.gjenspill_urort
    artefakt: deploy/staging/artefakter/m08-fasit-v1-20261119T130327Z.json
    artefakt_sha256: 915cbb1700b323603f8f278c2e7e8ed726b11938b204f5d899e21ac1e7640e88
    notat: >-
      To tenanter, 0 tilstandsavvik. Valgdørens utfall var fasitens (valgt,
      slot_fullt, valgt / valgt), og et gjentatt valg bekreftet samme tid uten
      å skrive en eneste rad.
  revisjonslogg_korrekt:
    # ADR-002 D1: triggerne i 214 skriver én hendelse per slot-opprettelse,
    # deaktivering, tokenutstedelse og kandidatvalg. Token-id-en (en
    # kapabilitet) skrives aldri.
    status: ja
    krav_id: m08-fasit-v1
    bevismaalinger:
      - maalt.evidens_avvik
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m08-fasit-v1-20261119T130327Z.json
    artefakt_sha256: 915cbb1700b323603f8f278c2e7e8ed726b11938b204f5d899e21ac1e7640e88
    notat: >-
      11 hendelser, nøyaktig per handling og tenant (0 avvik);
      0 uten aktør og 0 delte input_hash.
  feilinjisering_til_unntakskø:
    # ADR-002 D2, KLASSE C: et vaktbrudd avvises typet, uten spor; den
    # offentlige døra gir det uniforme avslaget på feil MAC.
    status: ja
    krav_id: m08-feilinjisering-v1
    bevismaalinger:
      - maalt.brudd
      - maalt.injiserte
    artefakt: deploy/staging/artefakter/m08-feilinjisering-v1-20261119T130328Z.json
    artefakt_sha256: 16d7f1f6b72ce13ce32dda414f6ee244731bef52ac9c8c751768f1e5df5b0c09
    notat: >-
      Fem brudd: deaktiver_slot_med_valg (23000), materiell_idempotenskonflikt (23505), dor_uten_tenantkontekst (42501), flytt_slottid (42501), valg_med_feil_mac (uniformt_avslag).
      Alle avvist, og digesten over modulens tre tabeller og revisjonsloggen
      var uendret etter hvert.
  ytelse_bestatt:
    # ADR-002 D4: kandidatens oppslag — den offentlige veien — under last.
    status: ja
    krav_id: m08-ytelse-v1
    bevismaalinger:
      - maalt.p95_ms
      - maalt.feilede
      - maalt.riktige
    artefakt: deploy/staging/artefakter/m08-ytelse-v1-20261119T130332Z.json
    artefakt_sha256: 3d4a7030f2289595274b6e9eeed922cb7a4dc8c07a361a85e17da2b14c73a978
    notat: >-
      200 oppslag: p50 0.737 ms, p95 2.538 ms (taket er 100 ms); 0 feilede.
  rollback_testet:
    # ADR-002 D3. Forgjengeren MÅ kjenne 214 (oppstartsvakten nekter ukjente
    # migrasjoner); den er releasen som innførte 214.
    status: ja
    krav_id: m08-rollback-v1
    bevismaalinger:
      - maalt.svar_like
      - maalt.kandidat_baerer_riggen
    artefakt: deploy/staging/artefakter/m08-rollback-v1-20261119T130331Z.json
    artefakt_sha256: 3d482e037791723776155689d89d9edade73731872d253c344df985d5c93a569
    notat: >-
      Kjerne 2f54043c3093 ← forgjenger 75db0db114b9: begge svarte
      200 på GET /v1/rekruttering/tidsvalg med like svar, og svaret bærer
      riggens slots.
