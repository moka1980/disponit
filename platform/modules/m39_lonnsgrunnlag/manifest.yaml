    status: ja
    krav_id: m39-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m39-suite-v1-20260918T063524Z.json
    artefakt_sha256: 21ae823e64a7d10f7205c4aed79406581488c9e151f11d68f410b0220dcf7135
    notat: >-
      5518 tester, 0 feilet, 0 hoppet; modulens andel 35 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/9 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet i `m39_fasit.py` gir hver av lønnsgrunnlagets fem
    # funntyper nøyaktig én lønnstaker, og én taker som skal være REN.
    #
    # FUNNENE AGGREGERES PER LØNNSTAKER, ikke per dag. Derfor har hver
    # merkelapp sin EGEN taker med NØYAKTIG én dag: to dager på samme
    # taker ville blandet to dommer i én rad.
    #
    # OVERTIDSFUNNET KREVER IKKE PLAN, så den planløse dagen ligger
    # under normaltiden, og overtidsdagen er ført nøyaktig som planlagt
    # — ellers hadde begge slått inn på samme taker.
    status: ja
    krav_id: m39-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m39-fasit-v1-20260918T060541Z.json
    artefakt_sha256: 6054ce72799a68aa819fb2e21380e324e721e70128bc7821db01497b5026e543
    notat: >-
      Runde 33f0938f: 6 lønnstakere, 0 funnavvik. Første sveip ga 6 nye
      funn — også den rene takeren, som fødes uten arbeidsplan. Planen
      som gjør den ren kom mellom kjøringene og er ført nøyaktig som
      planlagt på samme kode, så ingen annen funntype tok plassen.
      Andre sveip ga 0 nye og lukket 1.
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m39-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m39-fasit-v1-20260918T060541Z.json
    artefakt_sha256: 6054ce72799a68aa819fb2e21380e324e721e70128bc7821db01497b5026e543
    notat: >-
      18 hendelser i kjeden (arbeidsplan_satt: 5,
      lonnstaker_opprettet: 6, lonnsterskler_satt: 1, timer_registrert:
