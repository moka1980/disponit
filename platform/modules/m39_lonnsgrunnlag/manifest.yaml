    artefakt: deploy/staging/artefakter/m39-ytelse-v1-20260918T060542Z.json
    artefakt_sha256: d52da20cd6588109d8c8631fe06610d936220114586de3dc865375a0d44c8156
    notat: >-
      Tre kjøringer (0,0223 / 0,0185 / 0,0233 s) over 3 tenanter; den
