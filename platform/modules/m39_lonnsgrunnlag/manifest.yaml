      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m39-feilinjisering-v1-20260918T074334Z.json
    artefakt_sha256: f0f2b92a897b709fa53309f83282bdd883df0d363bc783ef97746657f381811f
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
