# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m27-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 109
# tildelt i docs/KLYNGE4-FUNDAMENT.md.
#
# HVA POLICYEN ALT LOVER: `bransjemal-netthandel.yaml` og
# `bransjemal-handverk-bygg.yaml` navngir denne modulen som
# verifikatorene `v_lager` (`lager_reservert`, `retur_registrert`) og
# `v_prognose` (`prognose_konfidens`) — og bruker dem til å slippe
# `lager.bestill_pafyll` og `materiell.bestill` gjennom som
# `modus: auto`.
#
# v1 ER BEHOLDNINGSREGISTERET SOM IKKE BESTILLER.
#
# DOMMEN: en automatisk innkjøpsordre er penger ut døra på en prognose
# ingen har målt. Katalogen lover en etterspørselsprognose med
# konfidens; en konfidens uten en målt treffhistorikk er et tall
# modulen fant på om seg selv. v1 lager ingen prognose i det hele tatt.
#
# v1 teller beholdningen, registrerer hver bevegelse (inn, ut, retur,
# svinn, telling), og gjør «under bestillingspunktet» til et FUNN.
#
# BEHOLDNINGEN ER SUMMEN AV BEVEGELSENE, aldri et fritt tall. Samme dom
# som M-23s saldo: en vedlikeholdt avledning ingen kontrollerer er en
# denormalisering som driver — og en lagerbeholdning som har drevet, er
# en beholdning ingen kan bestille mot.
#
# OG DEN KAN IKKE VÆRE NEGATIV. Man kan ikke ha mindre enn ingenting på
# lager; en negativ beholdning er alltid en manglende bevegelse, og den
# skal si fra i det den oppstår framfor å bli et tall noen regner videre
# på.
#
# BESTILLINGSPUNKTET ER TENANTENS. «Bestill når vi har mindre enn
# tjue» er en forretningsbeslutning, og et punkt kodet inn ville vært
# en fullmakt modulen ga seg selv — samme dom som M-23s purretrinn og
# M-24s terskler.
#
# GRENSEN MOT M-24: M-24 eier AVTALEN med leverandøren et påfyll ville
# gått på. M-27 eier BEHOLDNINGEN. Et passert bestillingspunkt er et
# funn her; hvilken avtale bestillingen ville gått på, er M-24s rad.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m27_lager
navn: Lager- og logistikkagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter: grensen `m27-v1` bærer invarianten
# `bestillingspunkt_hardkodet` — punktet SKAL være en policyverdi og
# ikke en konstant i koden.
avhengigheter:
  - m01_policy                 # bestillingspunktet er policy, ikke en konstant
  - m02_revisjonslogg          # hver bevegelse i evidenskjeden
kjerne: platform/modules/m27_lager
i18n_prefiks: lager

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 18/9 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m27-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m27-suite-v1-20260918T010558Z.json
    artefakt_sha256: 11756ee550759e120bbce9ae72f0fa097ac541be9ee8b29ee532a9124df57a45
    notat: >-
      5509 tester, 0 feilet, 0 hoppet; modulens andel 29 tester, 0 feilet,
      0 hoppet. Bevisroten dekker produsenten OG andelen, så en endret
      testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/9 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet i `m27_fasit.py` gir hver av lagerregisterets NÅBARE
    # funntyper nøyaktig én vare, og to varer som skal være rene. Alt
    # gjennom modulens egne dører; sveipen kalt gjennom `modul.kjor()`,
    # som arbeideren.
    #
    # `uten_bestillingspunkt` er IKKE NÅBAR for en vare opprettet i dag,
    # og det er regelen som virker: kandidaten krever at nådefristen er
    # passert, og registreringsdøra har ingen parameter for `opprettet`.
    # Settet bærer en NEGATIV KONTROLL i stedet — en vare uten punkt som
    # skal stå uten funn. Unntaket står i `UNAABARE`, med grunn, og
    # porten krever at settet ellers dekker hele CHECK-beskrankningen.
    status: ja
    krav_id: m27-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m27-fasit-v1-20260918T014556Z.json
    artefakt_sha256: b1174c16dbc9819caffcef9cba9e3416f535cd8733a38475d809873ed6f0092f
    notat: >-
      Runde 3943fa2e: 6 varer, 0 funnavvik. Første sveip ga 5 nye funn —
      også den rene varen, som fødes med sin siste bevegelse 200 døgn
      tilbake. Bevegelsen som gjør den ren kom mellom kjøringene, og
      andre sveip ga 0 nye og lukket 1. Dommen re-regnes av
      per-subjekt-tabellen.
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m27-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m27-fasit-v1-20260918T014556Z.json
    artefakt_sha256: b1174c16dbc9819caffcef9cba9e3416f535cd8733a38475d809873ed6f0092f
    notat: >-
      22 hendelser i kjeden (bestillingspunkt.satt: 5,
      bevegelse.registrert: 7, lagerterskel.satt: 1, telling.registrert:
      3, vare.registrert: 6), 0 uten aktør, 0 som deler input_hash med en
      annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m27-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m27-feilinjisering-v1-20260918T010718Z.json
    artefakt_sha256: d21ddc4b35626880f75be6146c2c6d4c60b3ae22b55f10817337024272e83e66
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 22 åpne og 3 lukkede over 11 tenanter, talt per funntype,
      fordi en sum kan stemme mens ett funn lukkes og et annet åpnes.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m27-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m27-ytelse-v1-20260918T010717Z.json
    artefakt_sha256: 7600bc69dbcc3038d1ab2239972328fe09fc77cb858262a2eea989fc3cc85e5c
    notat: >-
      Tre kjøringer (0,0277 / 0,0338 / 0,0281 s) over 9 tenanter; den
      DÅRLIGSTE er dommen. 0,0338 s mot taket på 60 — 0,0038 s per
      tenant. Porten re-regner tallet og nekter en varighet som ikke er
      maksimum av kjøringene.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: M-27 har ingen egen release og ruller
    # med kjernen, så drillen måler REGISTERETS tilstand over en rulling
    # av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE på
    # funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL midt
    # i skrivingen.
    status: ja
    krav_id: m27-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m27-rollback-v1-20260918T014810Z.json
    artefakt_sha256: 94190b5830c37db9612c8f26c12e025bbb96dcc26b0c1870db6b0fe3f8b3e6b0
    notat: >-
      Drillet 7bc276eb ← forgjenger 5f57464a (ulike kjernedigester;
      modulens egne filer er like, som de skal være i kjerneformen). Den
      drepte kjøringen skrev 0 funn, og arbeidernøkkelen ble fri — men
      FØRST etter at den foreldreløse økten ble avsluttet: en backend som
      venter på lås merker ikke at klienten er borte. Forgjengerens bytes
      skrev de 5 funnene uten dubletter, og de drillede bytene fant 0
      nye.
