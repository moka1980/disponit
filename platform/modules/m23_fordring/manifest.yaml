# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m23-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 104
# tildelt i docs/KLYNGE3-FUNDAMENT.md.
#
# V1 ER FORDRINGSREGISTERET. Katalogen lover at agenten FORESLÅR en
# nedbetalingsplan innenfor eierens forhåndsgodkjente grenser når
# kunden oppgir betalingsproblemer. v1 FORESLÅR INGENTING OVERFOR
# KUNDEN. Den registrerer fordringen, regner aldersfordelingen, og
# gjør en fordring som passerer sitt eget purretrinn til et FUNN.
#
# DOMMEN: et forslag om nedbetalingsplan er et TILBUD. Et tilbud som
# når kunden er bindende i praksis selv om det ikke er det juridisk,
# og «innenfor eierens forhåndsgodkjente grenser» forutsetter at de
# grensene finnes som policy — de gjør de ikke ennå. Å bygge
# tilbudsveien før grensen er å la modulen definere sin egen fullmakt.
#
# DEN SKARPE FORSKJELLEN FRA SØSKNENE: dette er PENGER OG EN KUNDE.
# En purring sendt for tidlig, til feil kunde, eller på en fordring som
# alt er betalt, er en skade som ikke kan trekkes tilbake. Derfor
# sender v1 ingenting: purretrinnet blir et funn eieren leser.
#
# GRENSEN MOT M-13: M-13 eier BANKPOSTER — det som har skjedd på konto.
# M-23 eier FORDRINGER — det kunden skylder. v1 kobler dem ikke
# automatisk; en ubetalt fordring med en umatchet innbetaling i samme
# størrelsesorden er et FUNN å se på, ikke en lukking.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m23_fordring
navn: Kundefordringsagent
versjon: 0.1.0
status: under_utvikling
driftstilstand: ikke_i_drift
avhengigheter:
  - m01_policy                 # purretrinn og grenser er policy, ikke kode
  - m02_revisjonslogg          # fordring og trinnendring i evidenskjeden
kjerne: platform/modules/m23_fordring
i18n_prefiks: fordring

staging_sjekkliste:
  tester_gronne_pa_staging:
    # NOTATET VAR UTDATERT VED FØDSELEN: «Ingen kode finnes». Modulen har
    # siden fått migrasjonene 104/146/150/151, ti HTTP-ruter, en sveip med
    # egen rolle og timer, og 101 egne tester i tolv filer.
    #
    # TRE TING MÅTTE STEMME FØR MÅLINGEN VAR ÆRLIG, og hver av dem ga
    # først røde tall som ikke var produktets:
    #   * FULLT UTSJEKK, ikke release-treet: utrullingen er beskåret (144
    #     av 187 docs-filer), og `test_katalog` feiler der av konstruksjon.
    #   * FERSK BASE per kjøring: en gjenbrukt testbase driver, og
    #     driften ser ut som regresjoner (58 → 5 → 3 feil over tre
    #     kjøringer mot samme base).
    #   * ARBEIDERROLLENS DSN: migrasjon 039 forgrener på om
    #     `disponit_arbeider` finnes i KLYNGEN, og REVOKEr da
    #     `ventende_overtakelseskonflikter` fra `disponit`. Riggen har
    #     rollen, CI har den ikke. Uten `DISPONIT_TEST_ARBEIDER_DSN` går
    #     testen runtime-veien mot en funksjon den nettopp mistet — den
    #     halvferdige rolleutrullingen migrasjonen selv advarer mot, og
    #     grunnen til at `opp.sh` har preflighten `vurder_arbeiderskille`.
    status: ja
    krav_id: m23-suite-v1
    bevismaalinger:
      - maalt.tester_totalt
      - maalt.tester_feilet
      - maalt.m23_tester
      - maalt.m23_feilet
      - maalt.m23_hoppet
    artefakt: deploy/staging/artefakter/m23-suite-v1-20260915T072002Z.json
    artefakt_sha256: 3e7dea65356996fcea3fcb3d86a58951fefa70bd68e45e23fed929c220bbda5c
    notat: >-
      5409 av 5409 tester KJØRT på disponit-srv, null feilet, null
      hoppet, exit 0. M-23s egen andel er PINNET
      (`manifestskjema.M23_SUITE_ANDEL`: tolv filer modulen eier i sin
      helhet) og målt for seg: 101 av 101 kjørt, null feilet, NULL
      HOPPET. Det siste er det som skiller «bestått» fra «ikke forsøkt»
      — hele andelen er `skipif(not DSN)`, og fasitporten krever i
      tillegg sveiperollens egen DSN.
  syntetisk_datasett_likt_lokalt:
    # SETTET FINNES NÅ: `deploy/staging/m23_fasit.py` — 21 fordringer
    # over to tenanter (en med purreplan, en uten), med en fordring på
    # NØYAKTIG hver kant og én på hver side: bøttekantene 0/1, 30/31,
    # 60/61, 90/91, og trinnkantene 2/3, 13/14, 27/28. To fasiter,
    # begge skrevet FØR kjøringen. CI driver samme sett mot lokal base
    # (`test_m23_fasit_port.py`), så «likt lokalt» er en STÅENDE
    # måling, ikke et minne fra en runde.
    #
    # NI MUTASJONER KJØRT MOT BASEN, ni fall, hver på sin navngitte rad
    # — de tre funnoperatorene (`>=`, `<`, `> 90`), `AND f.trinn = 0`,
    # de fire bøttekantene, og et fjernet evidenskall.
    #
    # STÅR LIKEVEL `nei`: staging-leddet er ikke kjørt. Punktet krever
    # settet drevet PÅ STAGING, og artefaktet finnes ikke ennå.
    status: ja
    krav_id: m23-fasit-v1
    bevismaalinger:
      - maalt.fordringer
      - maalt.ventede_funn
      - maalt.funnavvik
      - maalt.botteavvik
    artefakt: deploy/staging/artefakter/m23-fasit-v1-20260914T164015Z.json
    artefakt_sha256: c405385c8870cf450a0be726234cdcbdf6a1a564854a316a794f2d37e774ee44
    notat: >-
      21 fordringer, 10 ventede funn, NULL avvik på begge fasitene — kjørt
      mot disponit.com 14/9 gjennom kundens egne dører, sveipet av
      `fordringssveip.kjor()` som sveiperollen, og lest gjennom
      `api.fordring.svar_for`. Samme sett kjøres mot lokal base ved hver
      CI-runde (`test_m23_fasit_port`), og bindingen er BYTENE:
      `sett_sha256` må stemme i begge ledd, ellers er punktet rødt.
  revisjonslogg_korrekt:
    # MÅLES I SAMME KJØRING som fasiten, og på de samme radene: 21
    # `fordring.registrert`, 21 `fordring.trinn` (trinnet flyttes ETT om
    # gangen, så en fordring på trinn 3 er tre hendelser) og 1
    # `purreplan.satt`. «Med identitet» er målt bokstavelig: hver
    # registrering må ha SIN EGEN `input_hash` — en kjede som skrev samme
    # hash for alle 21 ville hatt riktig antall rader og null sporbarhet.
    status: ja
    krav_id: m23-fasit-v1
    bevismaalinger:
      - maalt.evidenshendelser
      - maalt.evidensavvik
    artefakt: deploy/staging/artefakter/m23-fasit-v1-20260914T164015Z.json
    artefakt_sha256: c405385c8870cf450a0be726234cdcbdf6a1a564854a316a794f2d37e774ee44
    notat: >-
      43 hendelser i kjeden, null avvik: 21 `fordring.registrert`, 21
      `fordring.trinn` og 1 `purreplan.satt`, hver med aktør og hver med
      SIN EGEN `input_hash`. Målingen er felt av en mutasjon — fjernes
      evidenskallet fra `m23_neste_trinn`, går 21 hendelser til 0 mens
      funnene står uendret. Det er den stille varianten punktet finnes
      for.
  feilinjisering_til_unntakskø:
    # MÅLINGEN VAR GJORT, BINDINGEN MANGLET. Bevisrunden 9/9 gikk mot
    # disponit.com med Fjordlys Elektro AS og injiserte fire ekte feil —
    # men `m23-purring-v1` hadde tom `punktbinding`, så ingen av tallene
    # kunne flippe et punkt. Evidensen lå ubrukt i fire døgn.
    #
    # KRAVET, ORDRETT: «at en feil i den ALDRI kan etterlate en fordring
    # merket purret uten at trinnet ble registrert.» Det er nettopp
    # `kvittering_uten_bokforing` (1 forsøk, 0 brudd): kvitteringen nådde
    # registeret, fordringen står på trinnet som ble purret, hendelsen i
    # historikken, evidensen i loggen.
    status: ja
    krav_id: m23-purring-v1
    bevismaalinger:
      - maalt.policygrense_omgaatt_brudd
      - maalt.kvittering_uten_bokforing_brudd
      - maalt.kill_switch_konsumerte_trinn_brudd
      - maalt.sending_uten_mottaker_brudd
    artefakt: deploy/staging/artefakter/m23-purring-v1-20260909T113000Z.json
    artefakt_sha256: f6ffd1773b23cec51a62c062e83e8bff9991d836efc494255a061842265acdac
    notat: >-
      Fire injiserte feil mot disponit.com, alle fire havnet der de
      skulle: policygrensen og vilkåret stoppet i UNNTAKSKØEN som sak
      121/122/123 (aldri stille, aldri tillat); kvitteringen nådde
      registeret; kill-switch midt i kjeden stoppet UTEN å brenne
      trinnet — fordringen var kandidat igjen da bryteren kom på; og
      uten adresse ble det verken bestilt eller sendt. 0 brudd på alle
      fire. Ekte oppdrag gjennom modulen, ikke stub-SMTP.
  ytelse_bestatt:
    # GRENSEN ER PINNET: `maks_sveipetid_ms: 30000` i KRAVGRENSER, og
    # porten avviser 0 — en sveip ingen tok tiden på er ikke en
    # ytelsesmåling, og 0 ville bestått ethvert tak.
    status: ja
    krav_id: m23-fasit-v1
    bevismaalinger:
      - maalt.sveipetid_ms
    artefakt: deploy/staging/artefakter/m23-fasit-v1-20260914T164015Z.json
    artefakt_sha256: c405385c8870cf450a0be726234cdcbdf6a1a564854a316a794f2d37e774ee44
    notat: >-
      17 ms mot taket på 30 000. NEVNEREN STÅR I ARTEFAKTET: uten
      `sveip_tenanter` ville en sveip som gikk hjem igjen uten å røre en
      tenant vært rask og bestått taket. Porten avviser også 0 ms — en
      sveip ingen tok tiden på er ikke en ytelsesmåling. MERK AT DE TO
      TALLENE TELLER ULIKE TING, og det er villet: `oppsett.tenanter` er
      de TO settet selv opprettet, mens `maalt.sveip_tenanter` er 3 fordi
      sveipen er KRYSS-TENANT og også gikk gjennom `disponit` — tenanten
      purrerunden 9/9 brukte. Kostnaden skal måles over alt sveipen
      faktisk rører, ikke bare over det denne runden la inn.
  rollback_testet:
    # BLOKKERT, IKKE «NEI» — og forskjellen er at blokkeringen har en
    # navngitt årsak som lar seg måle bort.
    #
    # MÅLT 15/9 i modulregisteret på disponit-srv: `m23_fordring` har
    # NØYAKTIG ÉN release, `m23-r1` (digest 5824bca07eae, registrert
    # 9/9), og én deployment i livsløpet `claiming`. En flippedrill må
    # rulle tilbake TIL forgjengerens bytes — `krev_release_digest_bundet`
    # i `m23-rollback-v1` håndhever nettopp det. Det finnes ingen
    # forgjenger.
    #
    # Å REGISTRERE EN «RULLBAKK» NÅ VILLE VÆRT BEDRAGERIET PORTEN FINNES
    # FOR Å FANGE. Med bare én bygging ville rullbakkens digest vært
    # kandidatens egen under et nytt navn, og drillen ville stått grønn
    # uten at det man ruller tilbake TIL noen gang var prøvd — ordrett
    # funnet Codex gjorde på m56 (#117 runde 6).
    #
    # SAMME FORM SOM m56 HADDE: den bar «kan ikke kjøres (forrige release
    # før 039)» til forutsetningen fantes, og ble så flippet. Dette
    # punktet flippes den dagen M-23 får sin andre release — altså ved
    # neste ekte endring i modulen — og drillen kjøres mot den.
    #
    # ARBEIDEREN ER INSTALLERT OG KJØRER (`disponit-m23.service`: enabled,
    # active), så blokkeringen er IKKE at maskineriet mangler. Det er
    # historikken som mangler.
    status: blokkert
    blokkert_av: >-
      m23_fordring har én release (m23-r1). En flippedrill må rulle
      tilbake til FORGJENGERENS bytes, og det finnes ingen forgjenger å
      rulle tilbake til. Låses opp av modulens andre release.
    krav_id: m23-rollback-v1
