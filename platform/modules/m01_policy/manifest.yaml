# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
id: m01_policy
navn: Policy- og fullmaktsmotor (M-1)
versjon: 0.1.0
status: under_utvikling        # aktiv | inaktiv | under_utvikling
avhengigheter: []              # M-1 er roten — ingen avhengigheter
kjerne: platform/core/policy_validator   # hvor koden bor
i18n_prefiks: m01              # alle modulens tekstnøkler starter slik

# Strukturert format (v2 Del 7 + v3-delta pkt. 7). Gyldige verdier er
# ja | nei | blokkert; `blokkert` KREVER `blokkert_av`. Et punkt uten
# definert, målbar grense regnes som `nei` — en port man ikke kan måle er
# ingen port.
staging_sjekkliste:
  tester_gronne_pa_staging:
    status: ja
    notat: >-
      Kjørt av Claude Code på Cloud Server S. PR-004: 74 passed.
      PR-005a: 155 passed med /etc/disponit/staging.env lastet.
      PR-005b (main 2340849): 230 passed, INGEN hoppet, tre kjøringer på
      rad. Miljøfila er chmod 600/root — uten sudo blir 101 tester stille
      hoppet over, og en hoppet test er ikke en bestått test.
  syntetisk_datasett_likt_lokalt:
    status: ja
    notat: >-
      180 hendelser: 84 TILLAT / 3 STOPP / 93 UNNTAK — identisk med lokalt.
  revisjonslogg_korrekt:
    status: ja
    notat: >-
      Ekte beslutning gjennom sikker_beslutning_pg lagret med
      tenant/aktor/kilde fra konteksten; UPDATE og DELETE avvist av
      databasetriggeren. PR-005b legger til evidensfeltene (handling,
      request_id, idempotency_key, policy_content_hash,
      attestation_set_hash).
  feilinjisering_til_unntakskø:
    # PR-005b bygger LAGRINGEN (M-37-tabellene, routing, kryptering), men
    # ikke behandlingsmotoren. Punktet krever at en injisert feil faktisk
    # BEHANDLES i køen, og det er PR-006. Derfor fortsatt blokkert — ikke
    # «ja» fordi halve veien nå finnes.
    status: blokkert
    blokkert_av: m37
  ytelse_bestatt:
    # Grensen ER definert og målbar (perf-m01-v1): 100 beslutninger/sekund,
    # 20 samtidige, p95 < 150 ms, null feil, 1:1 mellom beslutning og
    # loggpost. Skriptet finnes: deploy/staging/lasttest-m01.py.
    # Kjørt på staging (Cloud Server S) 2026-08-02 etter at PR-005b var
    # merget: 6 000 målte forespørsler @ 100/s, 20 samtidige, 0 feil,
    # p95 24,1 ms mot kravet 150 ms. Etterkontrollen mot databasen ga
    # 6 000 auditerte svar = 6 000 revisjonsrader (1:1) og 1 200
    # unntaksrader i normal kø, som er det routingreglene forventer.
    # Manifestfeltet er ikke beviset — artefaktet er.
    status: ja
    krav_id: perf-m01-v1
    artefakt: deploy/staging/artefakter/perf-m01-v1-maal-20260802T203540.json
  rollback_testet:
    # Splittet per review D2: den TEKNISKE deaktiveringen via registeret kan
    # bevises nå og er derfor `nei` (ikke gjort ennå), ikke `blokkert`.
    # Ende-til-ende-varianten dekkes av feilinjiseringspunktet over, som ER
    # blokkert av m37.
    status: nei
    krav_id: rollback-m01-v1
