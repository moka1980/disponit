# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
id: m01_policy
navn: Policy- og fullmaktsmotor (M-1)
versjon: 0.1.0
status: under_utvikling        # aktiv | inaktiv | under_utvikling
avhengigheter: []              # M-1 er roten — ingen avhengigheter
kjerne: platform/core/policy_validator   # hvor koden bor
i18n_prefiks: m01              # alle modulens tekstnøkler starter slik

# Strukturert format (v2 Del 7 + v3-delta pkt. 7). Gyldige verdier er
# ja | nei | blokkert; `blokkert` KREVER `blokkert_av`. Et punkt uten
# definert, målbar grense regnes som `nei` — en port man ikke kan måle er
# ingen port.
staging_sjekkliste:
  tester_gronne_pa_staging:
    status: ja
    notat: >-
      Kjørt av Claude Code på Cloud Server S. PR-004: 74 passed.
      PR-005a: 155 passed med /etc/disponit/staging.env lastet.
      PR-005b (main 2340849): 230 passed, INGEN hoppet, tre kjøringer på
      rad. Miljøfila er chmod 600/root — uten sudo blir 101 tester stille
      hoppet over, og en hoppet test er ikke en bestått test.
  syntetisk_datasett_likt_lokalt:
    status: ja
    notat: >-
      180 hendelser: 84 TILLAT / 3 STOPP / 93 UNNTAK — identisk med lokalt.
  revisjonslogg_korrekt:
    status: ja
    notat: >-
      Ekte beslutning gjennom sikker_beslutning_pg lagret med
      tenant/aktor/kilde fra konteksten; UPDATE og DELETE avvist av
      databasetriggeren. PR-005b legger til evidensfeltene (handling,
      request_id, idempotency_key, policy_content_hash,
      attestation_set_hash).
  feilinjisering_til_unntakskø:
    # PR-006 bygger BEHANDLINGSMOTOREN (claim, reparasjonsregister, outbox,
    # arbeidskapabiliteter). Punktet krever likevel et MÅLT artefakt gjennom
    # evidensporten, og den kjøringen skjer på staging ETTER merge —
    # rekkefølgen fra klarsignalet. Grensene er nå definert i KRAVGRENSER
    # (`feilinjisering-m01-v1`), slik at den som gjør kjøringen har en fasit
    # før arbeidet, ikke etter.
    #
    # MÅLT på staging 2026-08-05, etter at PR-007 (R1 som tofaseprotokoll)
    # var merget som `de1c05a`. Selen er deploy/staging/feilinjisering-m01.py:
    # 24 ekte feil injisert gjennom det ordinære API-et over FIRE kategorier
    # (manglende_data, over_grense, regelkonflikt, ukjent), behandlet av
    # M-37 som EGEN PROSESS, med syntetisk verifikator og eiermodul som to
    # ytterligere prosesser. Ingen unntaksrad er skrevet av selen — sakene
    # oppstår fordi motoren blokkerer dem.
    #
    # Resultat: 24/24 terminale, 12/12 reparerbare LØST, 12/12 ikke-
    # reparerbare til manuell, p95 64,6 ms under 400 samtidige beslutninger
    # MENS arbeideren behandlet, 2 lease-tap med re-claim, og null treff på
    # de 24 kanarifuglene — verken i databasen eller i arbeiderloggen.
    #
    # FIRE kjøringer: p95 64,6 / 57,0 / 60,2 / 51,5 ms. Artefaktet som
    # ligger her er den DÅRLIGSTE, ikke den beste — evidens skal ikke plukke
    # det peneste tallet (samme regel som for ytelsespunktet over).
    #
    # Første kjøring var RØD og er verdt å huske: selen signerte
    # lastforespørslene med en hardkodet nøkkel som ikke fantes i stagings
    # nøkkelregister. Hver forespørsel ble da en
    # `attestasjon_signatur_ugyldig`-SIKKERHETSSAK, 313 slike fløt inn i køen
    # ved siden av de 24 injiserte, og terminalandelen sto på 0,5. Feilen lå
    # i selen, ikke i M-37 — men den ville sett ut som en produktfeil for
    # den som bare leste tallet.
    status: ja
    krav_id: feilinjisering-m01-v1
    artefakt: deploy/staging/artefakter/feilinjisering-m01-v1-20260805T074109.json
    artefakt_sha256: 9315e345a5a000b6f06a229cf6fb7a44de0bd93f5f1551b0a8047ad378a13cbe
  ytelse_bestatt:
    # Grensen ER definert og målbar (perf-m01-v1): 100 beslutninger/sekund,
    # 20 samtidige, p95 < 150 ms, null feil, 1:1 mellom beslutning og
    # loggpost. Skriptet finnes: deploy/staging/lasttest-m01.py.
    # Kjørt på staging (Cloud Server S) 2026-08-02 etter at PR-005b var
    # merget: 6 000 målte forespørsler @ 100/s, 20 samtidige, 0 feil,
    # p95 82,3 ms mot kravet 150 ms. Etterkontrollen mot databasen ga
    # 6 000 auditerte svar = 6 000 revisjonsrader (1:1) og 1 200
    # unntaksrader i normal kø, som er det routingreglene forventer.
    # Manifestfeltet er ikke beviset — artefaktet er, og det ligger i
    # repoet (.gitignore-unntak) fordi en sti uten fil ikke er en
    # evidenskjede. `manifestskjema.valider_artefakter` åpner filen,
    # verifiserer sha256 mot innholdet og måler tallene mot KRAVGRENSER,
    # så et oppdiktet artefakt hjelper ikke.
    #
    # TRE kjøringer, p95 24,1 / 82,3 / 24,3 ms — alle bestått. Artefaktet
    # som ligger her er den DÅRLIGSTE (82,3 ms), ikke den beste: evidens
    # skal ikke plukke det peneste tallet. Utslaget er IKKE forklart av
    # datamengde — kjøringen med størst base (52 MB) var den raskeste, så
    # den hypotesen er testet og forkastet. Mest sannsynlig kontensjon på
    # en delt 2-kjerners boks (WCAGvakt-produksjon + to trading-bots).
    # Marginen er dermed tynnere enn ett enkelt tall antyder: verste
    # kjøring brukte 55 % av budsjettet og hadde p99 på 207 ms.
    status: ja
    krav_id: perf-m01-v1
    artefakt: deploy/staging/artefakter/perf-m01-v1-maal-20260802T205915.json
    artefakt_sha256: 12e3ec3e5d3ad931b0ff27ee71ef0b9ecebf7542e022d0a6a62a90caed9b8cc4
  rollback_testet:
    # Splittet per review D2: den TEKNISKE deaktiveringen via registeret er
    # den som måles her. Ende-til-ende-varianten dekkes av
    # feilinjiseringspunktet over.
    #
    # MÅLT på staging 2026-08-05 med deploy/staging/rollback-m01.py:
    # modulen deaktivert MENS trafikk pågikk, 113 forespørsler sendt i
    # vinduet der modulen beviselig var av — ALLE fikk 503 `modul_inaktiv`,
    # ingen 500 og ingen hengende forbindelse. Null tapte loggposter, null
    # halvferdige transaksjoner, og radtellingen for de åtte tabellene var
    # identisk ved starten og slutten av av-vinduet.
    #
    # Deaktivering effektiv etter 0,465 s, reaktivering etter 0,561 s (tak
    # 5,0 s begge veier). TRE kjøringer: 0,479/0,447, 0,465/0,561,
    # 0,418/0,521 — artefaktet her har det STØRSTE enkelttallet, ikke det
    # peneste snittet.
    #
    # Første kjøring ga 0,96 og var min egen målefeil: den merket
    # forespørsler som «av» i det øyeblikket kommandoen ble gitt. De som
    # rakk den gamle prosessen før den var nede fikk et normalt 200 — riktig
    # svar fra en modul som fortsatt var på. Andelen regnes nå kun over
    # perioden der modulen beviselig var av; overgangens kostnad står i
    # `deaktivering_effektiv_s`, som inkluderer hele restartvinduet.
    status: ja
    krav_id: rollback-m01-v1
    artefakt: deploy/staging/artefakter/rollback-m01-v1-20260805T075341.json
    artefakt_sha256: 33104868221c8ca6a160f39e1b24c2a72fbaa4db2fe0d8daaffb810d067811fd
