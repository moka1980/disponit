# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m21-v1` står i manifestskjema.KRAVGRENSER fra samme commit, og
# migrasjonsnummeret (096) er tildelt i docs/KLYNGE-FUNDAMENT.md.
#
# V1 ER FORPLIKTELSESREGISTERET OG FRISTVARSLENE. Katalogteksten lover
# også uttrekk av parter, datoer og plikter FRA avtaledokumenter, og
# forberedt innsending til offentlige mottakere med kvitteringsbevis.
# Uttrekket forutsetter dokumentanalysen modulen selv oppgir som
# avhengighet; innsendingen forutsetter et mandat og et maskinelt
# grensesnitt per mottaker. Ingen av delene finnes.
#
# v1 er den delen som gir verdi uten dem: plikter REGISTRERES manuelt
# med eier, frist og kildehenvisning, og en sveip køer varsel i god tid
# før hver frist. Sveipen legges som FORPASS i varselsenderen — ikke som
# en ny timer ved siden av: en ny varslingsvei er en ny vei å miste et
# varsel i, og varselsenderens rytme, backoff og idempotens er alt
# vunnet argumenter.
#
# TRE DOMMER v1 hviler på:
#   * En plikt UTEN EIER er urepresenterbar. «Plikter uten eier» er
#     katalogens egen KPI; i v1 er den en NOT NULL, ikke en rapport.
#   * En frist LUKKES ALDRI av at tiden går. Den lukkes av en skrevet
#     kvittering eller en eksplisitt status — katalogens eget
#     akseptkrav, håndhevet i datamodellen.
#   * Varselet er IDEMPOTENT per (plikt, varslingspunkt). En frist som
#     nærmer seg over mange sveip skal gi ett varsel per punkt, ikke ett
#     per sveip — ellers lærer folk å overse dem.
#
# GJENBRUKER `bestilling:opprett`: registrering av en plikt er en
# bestilling i plattformens forstand og trenger IKKE et nytt scope.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m21_avtalefrist
navn: Avtale- og fristagent
versjon: 0.1.0
status: under_utvikling        # aktiv | inaktiv | under_utvikling
driftstilstand: ikke_i_drift   # ikke_i_drift | staging | produksjon
# REELL, MÅLT avhengighet (m35-formen, ulikt de fire søsknene i
# klyngen): M-21 KØER VARSEL. Varselveien er tenant- og brukerskopet og
# hører til plattformens varselmodell; forpliktelsesregisteret er den
# ene modulen i «orden i eget hus» som faktisk rekker ut til et
# menneske. m02 føres fordi et fristvarsel er en handling som skal
# kunne gjenfinnes i evidenskjeden — ikke bare i en varseltabell.
avhengigheter:
  - m02_revisjonslogg          # fristvarslene skal kunne gjenfinnes
kjerne: platform/modules/m21_avtalefrist
i18n_prefiks: avtalefrist

staging_sjekkliste:
  tester_gronne_pa_staging:
    status: nei
    notat: >-
      SUITEN KJØRER.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 19/11 PÅ disponit.com med `deploy/staging/forpass-lest.py --modul
    # m21_avtalefrist` (ADR-003 klasse E) i den isolerte basen på 55432. Forpasset
    # kjøres gjennom den EKTE senderen som disponit_varselsender, med en
    # oppsamlende send i stedet for SMTP.
    status: ja
    krav_id: m21-fasit-v1
    bevismaalinger:
      - maalt.ankeravvik
      - maalt.ankre_kjoring1
      - maalt.kjoring2_nye
      - maalt.varselavvik
      - maalt.epost_sendt
    artefakt: deploy/staging/artefakter/m21-fasit-v1-20261119T210453Z.json
    artefakt_sha256: 4236ee5869562f8fca8c5f4fc412fbe6acda578d2956e613a68d9a04e60f24e3
    notat: >-
      8 subjekter i to tenanter, 9 ankre etter første kjøring og
      0 avvik fra fasiten; 3 subjekter skulle ikke varsles og ble
      det ikke. Hvert anker peker på ett varsel til eieren (0 avvik), og
      kanalvalget ble fulgt (e-post {'a': 0, 'b': 1}). Mellom kjøringene ble ett
      subjekt kvittert/fornyet; andre kjøring køet 0 nye.
  revisjonslogg_korrekt:
    # ADR-002 D1 (gjelder klasse E uendret): hver dør og hvert køet varsel
    # skriver én hendelse med aktør og egen input_hash.
    status: ja
    krav_id: m21-fasit-v1
    bevismaalinger:
      - maalt.evidens_avvik
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m21-fasit-v1-20261119T210453Z.json
    artefakt_sha256: 4236ee5869562f8fca8c5f4fc412fbe6acda578d2956e613a68d9a04e60f24e3
    notat: >-
      20 hendelser, nøyaktig per handling og tenant (0 avvik);
      0 uten aktør og 0 delte input_hash.
  feilinjisering_til_unntakskø:
    # ADR-003 E2: to ekte driftsfeil i forpasset — tilbaketrukket EXECUTE og et
    # låst register (lock_timeout) — aldri en bryter rigget inne i modulen.
    status: ja
    krav_id: m21-feilinjisering-v1
    bevismaalinger:
      - maalt.injeksjoner
      - maalt.injiserte
    artefakt: deploy/staging/artefakter/m21-feilinjisering-v1-20261119T210458Z.json
    artefakt_sha256: ba633442d60eab73c235e21b721cc74757fdfbd8224ce7e369ea5c41441ad457
    notat: >-
      execute_trukket: forpass_feil 1, ordinær sending gikk, 0 ankre, kode 2; register_laast: forpass_feil 1, ordinær sending gikk, 0 ankre, kode 2. Etter reparasjonen gikk forpasset rent (kode 0) og nådde fasitens
      9 ankre.
  ytelse_bestatt:
    # ADR-003 E4: forpasset alene, fullt tak forfalne subjekter per kjøring.
    status: ja
    krav_id: m21-ytelse-v1
    bevismaalinger:
      - maalt.maks_sekunder
      - maalt.kjoringer
      - maalt.koet_totalt
    artefakt: deploy/staging/artefakter/m21-ytelse-v1-20261119T210500Z.json
    artefakt_sha256: 12e16bfbc4dd48750c86c5fc1c5689dcba5aa9fa0e42493428f290b6b9d01630
    notat: >-
      5 kjøringer à 100: maks 0.0636 s (taket er 5 s), 500 køet.
  rollback_testet:
    # ADR-003 E3: kjernen rullet; forgjengerens og kandidatens sender på hvert
    # sitt like sett, og kandidaten over forgjengerens sett.
    status: ja
    krav_id: m21-rollback-v1
    bevismaalinger:
      - maalt.ankre_like
      - maalt.kandidat_etter_rullbakk_nye
    artefakt: deploy/staging/artefakter/m21-rollback-v1-20261119T210459Z.json
    artefakt_sha256: 8f3d5b2f8e9c8476702694b013bc0cfea7216010fffbc4f5b66883bce546ef8c
    notat: >-
      Kjerne 3b3567c63394 ← forgjenger a108dd30aa42: like ankre
      per subjekt, lik fasiten; kandidaten etter forgjengeren køet
      0 nye — ingen dobbeltvarsel over rullingen.
