      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m49-suite-v1-20261118T233132Z.json
    artefakt_sha256: d20502cc14794fd325f866d235f9d5c10bf168f016af35cf259211404b662ce1
    notat: >-
      5524 tester, 0 feilet, 0 hoppet; modulens andel 35 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/11 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet er `m49_fasit.py`:
    #
    # M-49s fasitsett: åtte subjekter i tre tenanter med KJENT dom.
    #
    # Sanksjonsregisteret har sju funntyper, alle på `subjekt_id`.
    #
    #   tenant A (krav: matchterskel 85, gyldig 90, uavklart 0, ukontrollert 0)
    #     1. `ukontrollert_subjekt`      — aldri kontrollert
    #     2. `uavklart_treff`            — kontrollert med et treff ingen har
    #                                       avklart
    #     3. `bekreftet_treff`           — treffet er avklart som samme part
    #     4. `kontroll_mot_gammel_liste` — kontrollert mot OFAC-lista som så
    #                                       ble avløst av en nyere
    #     5. (ren)                       — aldri kontrollert; kontrolleres uten
    #                                       treff MELLOM kjøringene
    #     6. (ok)                        — kontrollert uten treff mot EU-lista
    #   tenant B (ingen krav)
    #     7. `ingen_krav`
    #   tenant C (krav, men ingen lister)
    #     8. `ingen_liste`
    #
    # TERSKLENE PÅ NULL ER POENGET, IKKE EN SNARVEI. `ukontrollert_dogn` og
    # `uavklart_frist_dogn` har gulv 0, og da er «opprettet før nå» og
    # «registrert før nå» nok — begge tidsfunnene kan måles på én dag. Tenant
    # C har derfor `ukontrollert_dogn` 3650: subjektet der skal måle
    # `ingen_liste` og ingenting annet.
    #
    # TO LISTEKILDER: de andre kontrollene går mot EU-lista, som aldri
    # avløses. Bare subjektet som skal måle den gamle lista, kontrolleres mot
    # OFAC — og den nye OFAC-lista registreres ETTER kontrollen.
    status: ja
    krav_id: m49-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m49-fasit-v1-20261118T222507Z.json
    artefakt_sha256: 4469b8c0ff4d6a92f97ed8f5e530d35888afc6d6dc0f2012e8596455ee6e1d50
    notat: >-
      Runde 0c81cc4d: 8 subjekter, 0 funnavvik. Det rene subjektet fikk funn
      i første sveip og ble rettet mellom kjøringene; andre sveip lukket det
      (0 avvik etter andre sveip).
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`. Delt artefakt er
    # lovlig her fordi hendelsene er PRODUSERT av nettopp de dørene
    # fasiten kjørte.
    status: ja
    krav_id: m49-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m49-fasit-v1-20261118T222507Z.json
    artefakt_sha256: 4469b8c0ff4d6a92f97ed8f5e530d35888afc6d6dc0f2012e8596455ee6e1d50
    notat: >-
      19 hendelser i kjeden (sanksjonskontroll_utfort: 5,
      sanksjonskrav_satt: 2, sanksjonsliste_lastet: 3,
      sanksjonssubjekt_registrert: 8, treff_avklart: 1), 0 uten aktør, 0 som
      deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først, siden et tomt register står stille
    # uansett hva kjøringen gjorde.
    status: ja
    krav_id: m49-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m49-feilinjisering-v1-20261118T222508Z.json
    artefakt_sha256: 5028c17298716e119cb4cc08c4011c5c544cf35223526a12adee4ce3d9bfd5ce
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
