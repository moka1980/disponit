# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# MAPPENAVNET bærer katalognummeret M-56 (tildelt i frontsidetekst-steget,
# INNHOLD-wcag-katalog-og-frontside 2026-08-19), slik hodet her alltid har
# sagt at det skulle: mNN_-vakten (test_ui_kontrakt) tvinger dermed frem
# den bevisste UI-oppdateringen i MODULSTATUS. Databasens modul_id er
# fortsatt `m_wcag_audit` (vedtatt i 014c §1) og endres ikke av
# registernavnet. Statusflippet (status/driftstilstand) er IKKE en del av
# nummer-tildelingen — det står bak akseptporten under (rollback-punktet),
# som før. Forsiden har derfor INGEN «I drift»-etikett for M-56: et eget
# statusfelt i katalogen sto kort i #109 og er tatt ut igjen (Codex P1).
# Flaten har én statusakse, og den er avledet av dette manifestet.
# OMDØPINGEN STOPPER VED kontrakt/KONTRAKT.md: den fila er hash-bundet
# (`modulkontrakt.kontrakt_hash`, kontraktversjon 1, alt registrert), så
# stien den nevner er den gamle med vilje. Codex P1 på #109; porten står i
# test_motor_axe.py::test_kontraktsdokumentet_er_frosset_pa_den_registrerte_hashen.
# DENNE fila går motsatt vei: bytene hennes er `manifest_hash` på
# release-raden, og en endring her er derfor en NY RELEASE, ikke en frossen
# tekst. Omdøpingen ga `wcag-r2` som default i staging-sjekklisten (Codex P1
# på #109); neste endring — statusflippet under er en av dem — krever samme
# to-linjers bump, og porten
# test_motor_axe.py::test_release_id_folger_manifestets_bytes stopper
# glemselen i CI i stedet for i en staging-runde.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
id: wcag_audit
navn: Automatisk WCAG-kontroll (controller)
versjon: 0.1.0
status: under_utvikling        # aktiv | inaktiv | under_utvikling
# AKSEPTPORTEN ER BESTÅTT — OG FLIPPET VENTER PÅ AVHENGIGHETEN (049,
# dokumentert avvik fra akseptflipp-klarsignalet §4):
#
# Porten: alle seks sjekklistepunktene under står `ja` med krav_id +
# innsjekket, sha256-bundet artefakt + strukturerte `bevismaalinger`
# (`wcag-kontroll-v1` og `rollback-m56-v1` i manifestskjema.KRAVGRENSER,
# så CI RE-MÅLER tallene ved hver kjøring), flippedrillen er KJØRT
# 2026-08-20 (se `rollback_testet`), og i basen skrives aksepten som en
# immutabel hendelse (`modulaksept`, migrasjon 049; deploy/staging/
# m56-aksept.py) som FK-refererer drillraden, det promoterte
# E2E-artefaktet fra NØYAKTIG den aksepterte deploymentraden
# (m_wcag_audit, staging, wcag-r13), og én observasjon per grensepunkt.
# #89-tilbaketrekkingens to mangler er dermed lukket.
#
# Blokkeren er registerets EGEN konsistensregel (registry.valider): en
# `aktiv` modul kan ikke avhenge av en som ikke er aktiv, og
# `m02_revisjonslogg` står `under_utvikling` med tre ubundne
# sjekklistepunkter. Regelen gjør nøyaktig jobben sin — å flippe her
# ville gjort registeret rødt i CI. Flippet (status → aktiv,
# driftstilstand → produksjon, katalogetiketten via MODULSTATUS) skjer i
# m02-aksept-arcen, som en to-linjers endring UTEN nye porter: alle
# portene for m56 er bestått og bundet HER.
#
# MILJØAKSEN (når flippet skjer): aksepthendelsen binder deploymentraden
# SLIK DEN FAKTISK KJØRER — (staging, wcag-r13); det finnes ett miljø.
# `driftstilstand: produksjon` er katalogens sannhet om BRUK, ikke om
# miljøetiketten; et eget produksjonsmiljø krever egen aksept med egen
# drill (port 14 i 049).
driftstilstand: ikke_i_drift   # ikke_i_drift | staging | produksjon
avhengigheter:
  - m01_policy                 # bestilling og frekvens går gjennom policyporten
  - m02_revisjonslogg          # én skrivevei til evidenskjeden
kjerne: platform/modules/m56_wcag_audit
i18n_prefiks: wcagaudit

# GRENSEN (klarsignalet §2): modulen er KUNDE av kontrollmotoren, ikke en
# kopi. Motoren (axe-core i headless Chromium) bor i wcag_checker-repoet og
# kjører i browser-containeren (014b §6) uten credentials; controlleren
# claimer, styrer, pakker, laster opp og kvitterer. Alt som kommer ut av
# motoren er ubetrodd inndata og skjemavalideres — av controlleren FØR
# innsending, og av plattformen ved opplasting OG promotering (036).
staging_sjekkliste:
  # Sjekklisteformen er LUKKET (manifest-skjema.json) — punktene under er
  # plattformens seks akseptpunkter. 014c-spesifikke bevis (syntetisk
  # fasit, egress/robots, bestillingsveien) føres som notater under de
  # punktene de faktisk beviser, med krav_id wcag-kontroll-v1 (§12).
  #
  # MÅLINGEN ER BUNDET (049): evidens.jsonl fra målerunden 2026-08-18 er
  # sjekket inn (deploy/staging/artefakter/evidens-wcag-runde-20260818.
  # jsonl), sammendraget avledes MEKANISK av den
  # (deploy/staging/wcag-kontroll-artefakt.py — utvalgsreglene står i
  # skriptets docstring og CI regenererer og sammenligner), og
  # `wcag-kontroll-v1` er registrert i `manifestskjema.KRAVGRENSER` med
  # grensene fra 014c §12. Den root-eide serverfilen er ikke lenger
  # kilden: SP-11-byteporten gjelder de innsjekkede bytene.
  # Punktene under deler dét artefaktet, og `bevismaalinger` per punkt
  # sier hva NETTOPP det punktet henter ut — tredjelaget i
  # `valider_artefakter`, som skiller legitim deling fra lånt konklusjon.
  tester_gronne_pa_staging:
    status: ja
    krav_id: wcag-kontroll-v1
    bevismaalinger:
      - maalt.kjoringer_signert_innen_frist
      - maalt.avvik_mot_fasit
    artefakt: deploy/staging/artefakter/wcag-kontroll-v1-20260818T200413.json
    artefakt_sha256: 3eaa69dff66c7015be30c8060aa0fdd2d2fd32f64c65d8ad4a79c63c8926d84f
    notat: >-
      MÅLT 2026-08-18, BUNDET 2026-08-20 (049).
      På disponit-srv (release wcag-r1 — byte-identisk med den aksepterte
      wcag-r13, alle m56-releaser deler artifact_digest af92b705…): ekte motor
      (axe-core-4.10.3, Chromium 131.0.6778.33, docker, image
      sha256:af92b705…) gjennom hele produksjonskjeden bestilling→claim→
      motor→rapport→signert kvittering→promotert artefakt.
      kontroll.ti_kjoringer_signert_innen_frist = 10/10 ·
      funn.avvik_mot_fasit = 0 (begge scenarier) · port 18/19: blokkerte
      subressurser og avkorting ([true,4,13]) i rapporten · port 20:
      0 /privat/-forespørsler i målets logg, robots-5xx ga nøyaktig 1 side ·
      port 21: frekvens 4×tillat + femte=brudd→unntakskø · port 24:
      motormiljøet målt i containeren, 0 lekkasjer (kanari-DISPONIT_KEK og
      DATABASE_URL nådde aldri motoren).
  syntetisk_datasett_likt_lokalt:
    status: ja
    krav_id: wcag-kontroll-v1
    bevismaalinger:
      - maalt.avvik_mot_fasit
    artefakt: deploy/staging/artefakter/wcag-kontroll-v1-20260818T200413.json
    artefakt_sha256: 3eaa69dff66c7015be30c8060aa0fdd2d2fd32f64c65d8ad4a79c63c8926d84f
    notat: >-
      MÅLT 2026-08-18, BUNDET 2026-08-20 (049). Testnettstedet (platform/modules/wcag_audit/testnettsted/, fasit
      skrevet fra konstruksjonen) er identisk lokalt og på staging (samme
      commit); fasitkontrollen ga avvik=0 begge steder 2026-08-18.
  revisjonslogg_korrekt:
    status: ja
    krav_id: wcag-kontroll-v1
    bevismaalinger:
      - maalt.kjoringer_signert_innen_frist
    artefakt: deploy/staging/artefakter/wcag-kontroll-v1-20260818T200413.json
    artefakt_sha256: 3eaa69dff66c7015be30c8060aa0fdd2d2fd32f64c65d8ad4a79c63c8926d84f
    notat: >-
      MÅLT 2026-08-18, BUNDET 2026-08-20 (049). Verifisert i
      staging-kjøringen: kvitteringen attesterer release,
      regelsett, sider og artefakthash (PR-006-signert, verifikator
      v_wcag_audit mot nøkkelregisteret); rapport-lese-API-et leverer det
      promoterte artefaktet dekryptert.
  feilinjisering_til_unntakskø:
    status: ja
    krav_id: wcag-kontroll-v1
    bevismaalinger:
      - maalt.feilinjisering_feilet_med_kvittering
      - maalt.feilinjisering_promoterte_artefakter
      - maalt.evidensfrist_reapet
    artefakt: deploy/staging/artefakter/wcag-kontroll-v1-20260818T200413.json
    artefakt_sha256: 3eaa69dff66c7015be30c8060aa0fdd2d2fd32f64c65d8ad4a79c63c8926d84f
    notat: >-
      MÅLT 2026-08-18, BUNDET 2026-08-20 (049). Motorfeil (kommando exit 1) → kvittering 'avbrutt', oppdrag
      feilet MED signert feilkvittering, 0 promoterte artefakter;
      evidensfrist overskredet → reap_evidensfrister → idempotent
      evidensfrist-sak + oppdrag feilet (evidens 2026-08-18).
  ytelse_bestatt:
    status: ja
    krav_id: wcag-kontroll-v1
    bevismaalinger:
      - maalt.kjoringer_signert_innen_frist
      - maalt.kjoringer_krav
    artefakt: deploy/staging/artefakter/wcag-kontroll-v1-20260818T200413.json
    artefakt_sha256: 3eaa69dff66c7015be30c8060aa0fdd2d2fd32f64c65d8ad4a79c63c8926d84f
    notat: >-
      MÅLT 2026-08-18, BUNDET 2026-08-20 (049). 10/10 kjøringer signert innen frist (verste 2.1 s mot 1800/3600 s
      budsjett — det syntetiske nettstedet er lite; fristene deklarert i
      oppdragskontrakt.UTFORELSESFRIST_VALG og skrevet på radene, motoren
      fikk claimets restvindu minus avslutningsmarginen).
  rollback_testet:
    # DRILLEN ER KJØRT (2026-08-20, deploy/staging/rollback-m56.py) — den
    # gamle noten om at den ikke KUNNE kjøres (forrige release før 039)
    # var sann da den ble skrevet og er slettet fordi den ikke er det
    # lenger: r11 og r13 deler migrasjonstilstand OG bytes.
    #
    # LIVSLØPET ER ENVEIS (014): `bytt_release` nekter å re-claime en
    # drenert deployment, så drillen KONSUMERER den drillede releasen og
    # «fram igjen» lander på akseptkandidaten — en NY deploymentrad med de
    # SAMME bytene (digestporten i `registrer_moduldrill` håndhever
    # likheten). Aksepten binder kandidaten: raden som faktisk kjører, og
    # hvis fødsel og claim-opptak drillen selv bevitnet. At alle m56-
    # releasene deler digest er A1s levende bevis: digest kunne aldri
    # skilt drillet fra udrillet — bare deployment-identiteten kan.
    status: ja
    krav_id: rollback-m56-v1
    bevismaalinger:
      - maalt.nye_oppdrag_claimet_av_drillet_release
      - maalt.inflight_utfall
      - maalt.kandidat_promoterte_artefakter
    artefakt: deploy/staging/artefakter/rollback-m56-v1-20260820T132200.json
    artefakt_sha256: 8d98e8d1889e77b632c04f92be32f2bbceb34498c3e2d22af5ca7b600fb3e3e0
    notat: >-
      KJØRT 2026-08-20 mot (m_wcag_audit, staging): wcag-r11 rullet til
      wcag-r12 MENS oppdrag 54 var claimet — oppdraget fullførte utfort
      med signert kvittering og promotert artefakt 1,5 s etter rullingen
      (SP-3: rent utfall, aldri falskt verdikt); den drenerte releasen
      claimet INGENTING på 25 s med levende arbeider; kandidaten wcag-r13
      (byte-identisk, digest af92b705…) plukket det ventende oppdraget og
      promoterte E2E-artefaktet ad1579e2… 12,4 s etter fram-rullingen.
      Basen bærer drillraden i `moduldrill` (049) og aksepthendelsen
      FK-refererer den.
