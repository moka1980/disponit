# Modulmanifest — registeret leser KUN denne filen, aldri koden.
# Format: platform/core/manifest-skjema.json (validert i CI, PR-005b).
#
# REGISTRERT VED FØDSELEN, FØR koden (§0-regelen, m57): grensen
# `m42-v1` står i KRAVGRENSER fra samme commit, migrasjonsnummer 110
# tildelt i docs/KLYNGE4-FUNDAMENT.md.
#
# HVA POLICYEN ALT LOVER: `bransjemal-tjenestebedrift.yaml` og
# `bransjemal-handverk-bygg.yaml` navngir denne modulen som TO
# verifikatorer — `v_bank` (`konto_verifisert`,
# `konto_verifisert_uavhengig`) og `v_svindel` (`svindelsjekk_bestatt`)
# — og bruker dem til å slippe utgående betalinger gjennom.
#
# DETTE ER KLYNGENS SKARPESTE MODUL, og den er skarp i BEGGE retninger.
#
# v1 VERIFISERER INGEN KONTO MOT EN EKSTERN KANAL, OG DEN STOPPER INGEN
# BETALING.
#
# Det andre er den uvante halvdelen, og den er den viktigste: det
# farligste en svindelvakt kan gjøre er ikke å slippe noe gjennom — det
# er å STOPPE noe. En vakt som blokkerer feil er sin egen skade: en
# leverandør som ikke får betalt, en lønn som ikke kommer, en frist som
# ryker. Og en vakt ingen har målt, vet ikke hvor ofte den tar feil. Å
# gi en umålt vakt stoppmyndighet er å bytte én risiko mot en annen og
# kalle det sikkerhet.
#
# Det første er husets vante snitt: v1 ringer ingen bank, kaller intet
# API, og signerer ingen attestasjon. `konto_verifisert` er en
# attestasjon som autoriserer at penger går ut; den fullmakten tas ikke
# før grunnlaget under den finnes.
#
# HVA v1 DA ER: kontohistorikken. Hvilket kontonummer som ble oppgitt,
# av hvem, når, og HVORDAN et menneske verifiserte det — tilbakering til
# et kjent nummer, signert brev, oppmøte — med metoden skrevet ned.
#
# OG DEN ENE MÅLINGEN SOM BETYR MEST: en KONTOENDRING PÅ EN LEVERANDØR
# VI ALT BETALER er et funn. Det er det høyeste enkeltsignalet som
# finnes i denne svindelklassen — en e-post med nytt kontonummer fra en
# «leverandør» er selve angrepet — og ingen kan handle på det hvis det
# ikke er skrevet ned at kontoen ble endret.
#
# EN VERIFIKASJON UTEN ET MENNESKE OG EN METODE ER INGEN VERIFIKASJON.
# «Verifisert: ja» uten hvem og hvordan er en rad som ser ut som en
# kontroll og ikke er det — og det er verre enn ingen rad, fordi noen
# handler på den.
#
# GRENSEN MOT M-24: M-24 eier LEVERANDØREN. M-42 eier KONTONUMMERET og
# HISTORIKKEN. Kontoen henger på leverandøren, men det er historikken —
# hvem oppga hvilken konto når — som avslører svindelen, ikke gjeldende
# verdi. Et register som bare bar siste kontonummer ville slettet
# beviset i det angrepet lyktes.
#
# GRENSEN MOT M-37: en mistenkelig kontoendring hører til M-37s
# unntakskø. Ingen ny kø.
#
# TO AKSER, ÆRLIG LEST: ingen aksepthendelse, ingen kode, ingen release.
id: m42_kontovakt
navn: Kontoverifikasjons- og transaksjonsvaktagent
versjon: 0.1.0
status: aktiv
driftstilstand: produksjon
# REELLE, MÅLTE avhengigheter: grensen `m42-v1` bærer invarianten
# `verifikasjonskrav_hardkodet` — hvilke metoder som teller som
# uavhengig verifikasjon, og hvor lenge en verifikasjon står, er
# tenantens beslutning og ikke modulens.
avhengigheter:
  - m01_policy                 # verifikasjonskravene er policy
  - m02_revisjonslogg          # hver kontoendring i evidenskjeden
  - m37_unntak                 # mistenkelig endring til den ENE køen
kjerne: platform/modules/m42_kontovakt
i18n_prefiks: kontovakt

staging_sjekkliste:
  tester_gronne_pa_staging:
    # MÅLT 18/9 PÅ disponit-srv med den generiske suiteprodusenten: fersk
    # base fra utsjekket, hele suiten og modulens egen andel hver for seg.
    status: ja
    krav_id: m42-suite-v1
    bevismaalinger:
      - maalt.andel_feilet
      - maalt.andel_tester
      - maalt.andel_hoppet
      - maalt.andel_exitkode
      - maalt.tester_feilet
      - maalt.tester_totalt
      - maalt.tester_hoppet
      - maalt.suite_exitkode
    artefakt: deploy/staging/artefakter/m42-suite-v1-20260918T024838Z.json
    artefakt_sha256: 6c93bde66e31802836c276e0ecff57c893440d3c37df6936645c5876fe8336fd
    notat: >-
      5513 tester, 0 feilet, 0 hoppet; modulens andel 26 tester,
      0 feilet, 0 hoppet. Bevisroten dekker produsenten OG andelen,
      så en endret testfil felles av porten.
  syntetisk_datasett_likt_lokalt:
    # MÅLT 18/9 PÅ disponit.com med den GENERISKE fasitprodusenten.
    # Settet i `m42_fasit.py` gir hver av kontoregisterets fire
    # funntyper nøyaktig én mottaker, og to mottakere som skal være
    # rene. ALLE fire er nåbare for et subjekt opprettet i dag: begge
    # tidsmålingene leser DATOPARAMETRE (`oppgitt_dato`,
    # `verifisert_dato`), ikke en `opprettet`-kolonne ingen dør rører.
    #
    # DØRA SKRIVER `kontoendring` SELV, i samme transaksjon som den
    # andre oppgaven. Mottakeren i den terskelløse tenanten får derfor
    # nøyaktig ÉN oppgave — ellers hadde settet målt døra i stedet for
    # sveipen.
    #
    # DEN RENE KURERES MED EN NY OPPGAVE, ikke med en verifikasjon:
    # verifikasjonsdøra LUKKER funnene selv, og da hadde sveipen ikke
    # hatt noe å lukke.
    status: ja
    krav_id: m42-fasit-v1
    bevismaalinger:
      - maalt.funnavvik
      - maalt.subjekter
      - maalt.sveip1_nye
      - maalt.sveip2_nye
    artefakt: deploy/staging/artefakter/m42-fasit-v1-20260918T014700Z.json
    artefakt_sha256: 63f14fb77ce6e291877abbe80edfa4a50d7de38fc4645cc1d5580d7e60513eb7
    notat: >-
      Runde 87d21b47: 6 mottakere, 0 funnavvik. Første sveip ga 10 nye
      funn på tvers av basen, og andre sveip 0 nye og 1 lukket — den
      rene mottakeren, som fødes uverifisert og 30 døgn gammel og
      kureres med en ny oppgave mellom kjøringene. Dommen re-regnes av
      per-subjekt-tabellen.
  revisjonslogg_korrekt:
    # SAMME KJØRING, ANNEN AKSE: hver dør skrev sin hendelse i
    # evidenskjeden med aktør og egen `input_hash`.
    #
    # FIRE ØYNE STÅR I TALLENE: `konto.oppgitt` og `konto.verifisert` er
    # skrevet av TO ULIKE aktører, fordi `m42_verifikasjon_vakt` nekter
    # at den som oppga kontoen verifiserer den.
    status: ja
    krav_id: m42-fasit-v1
    bevismaalinger:
      - maalt.evidens_totalt
      - maalt.evidens_uten_aktor
      - maalt.evidens_delte_input_hash
    artefakt: deploy/staging/artefakter/m42-fasit-v1-20260918T014700Z.json
    artefakt_sha256: 63f14fb77ce6e291877abbe80edfa4a50d7de38fc4645cc1d5580d7e60513eb7
    notat: >-
      17 hendelser i kjeden (konto.oppgitt: 8, konto.verifisert: 2,
      kontoterskel.satt: 1, mottaker.registrert: 6), 0 uten aktør, 0 som
      deler input_hash med en annen.
  feilinjisering_til_unntakskø:
    # MÅLT 18/9 med den GENERISKE sveipprodusenten. Feilen kommer
    # UTENFRA: kjøringen får runtime-tilkoblingen, som ikke har EXECUTE
    # på sveipedøra. Injeksjonen har egen positiv kontroll — basen
    # bekrefter at rollen faktisk mangler EXECUTE — og målingen rigger
    # sitt eget register først.
    status: ja
    krav_id: m42-feilinjisering-v1
    bevismaalinger:
      - maalt.injisert_feilet
      - maalt.registeret_urort
      - maalt.alarm_etter_andre
      - maalt.apne_etter
      - maalt.injeksjonsrolle_har_execute
    artefakt: deploy/staging/artefakter/m42-feilinjisering-v1-20260918T014701Z.json
    artefakt_sha256: ef14e538ed8e069741539fd27506595af560aab499313fea4f6aa42b2f9ed4da
    notat: >-
      Frisk kjøring først (feilet=false), så to injiserte: begge rene
      feilutfall, alarm på den ANDRE og ikke den første. Registeret sto
      urørt — 21 åpne og 2 lukkede over 9 tenanter, talt per funntype,
      fordi en sum kan stemme mens ett funn lukkes og et annet åpnes.
  ytelse_bestatt:
    # MÅLT 18/9: veggklokke rundt modulens egen `kjor()`, ikke rundt
    # SQL-funksjonen alene — advisory-låsen, kontraktvalideringen og
    # committen er en del av kostnaden.
    status: ja
    krav_id: m42-ytelse-v1
    bevismaalinger:
      - maalt.sekunder
      - maalt.tenanter
      - maalt.sekunder_per_tenant
    artefakt: deploy/staging/artefakter/m42-ytelse-v1-20260918T014700Z.json
    artefakt_sha256: fb19ceb3ddf731d6563e6888c2f876dfc00e61b905c12c5928de8bfa2c5214a8
    notat: >-
      Tre kjøringer (0,0169 / 0,0202 / 0,0331 s) over 7 tenanter; den
      DÅRLIGSTE er dommen. 0,0331 s mot taket på 60 — 0,0047 s per
      tenant. Porten re-regner tallet og nekter en varighet som ikke er
      maksimum av kjøringene.
  rollback_testet:
    # MÅLT 18/9 med KJERNEFORMEN: modulen har ingen egen release og
    # ruller med kjernen, så drillen måler REGISTERETS tilstand over en
    # rulling av kjernebytene. Avbruddet kommer utenfra: ACCESS EXCLUSIVE
    # på funntabellen, sveipen blokkerer, prosessen drepes med SIGKILL
    # midt i skrivingen.
    #
    # UTGANGSPUNKTET ER IKKE NULL HER, og det er nettopp derfor drillen
    # måler DELTAET: døra skrev ett `kontoendring`-funn allerede da
    # riggen ble laget.
    status: ja
    krav_id: m42-rollback-v1
    bevismaalinger:
      - maalt.inflight_funn
      - maalt.arbeidernokkel_fri
      - maalt.rullbakk_funn
      - maalt.dubletter
      - maalt.kandidat_nye
      - maalt.release_digest_bundet
    artefakt: deploy/staging/artefakter/m42-rollback-v1-20260918T014811Z.json
    artefakt_sha256: 311ddfc6a2dc20eca2e6abd9d37becdec024ab8483e1da4fb73bfc806624eec6
    notat: >-
      Drillet ffd8cb3b ← forgjenger 5f57464a (ulike kjernedigester).
      Riggen hadde 1 funnrad før drillen — døras egen — og den drepte
      kjøringen la ingen til. Arbeidernøkkelen ble fri først etter at
      den foreldreløse økten ble avsluttet. Forgjengerens bytes skrev de
      5 funnene uten dubletter, og de drillede bytene fant 0 nye.
