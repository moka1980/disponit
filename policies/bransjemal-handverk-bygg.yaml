# ============================================================
# BRANSJEMAL v0.2 · HÅNDVERK / BYGG / ANLEGG (SMB)
# Oppgradert etter ChatGPT-review PR-001.
# ============================================================
schema_version: "0.2"
meta:
  policy_id: handverk-bygg-no
  versjon: 0.2.0
  bransjemal: handverk-bygg-no
  kilder:
    - "Byggherreforskriften / HMS-kortplikt"
    - "Bustadoppføringslova og håndverkertjenesteloven"
    - "StartBANK/leverandørregister-praksis"
  status: utkast

tidssone: Europe/Oslo

roller:
  - {id: daglig_leder}
  - {id: prosjektleder, beskrivelse: "Ansvar per prosjekt og endringsordrer"}
  - {id: handverker, beskrivelse: "Timeføring, materiell, dokumentasjon"}
  - {id: agent, beskrivelse: "Automatisert utførelse innen denne policyen"}

dataklasser: [offentlig, intern, persondata, finansiell]

verifikatorer:
  v_lonn:
    beskrivelse: "M-39 lønnsgrunnlag"
    betrodd_for: [timer_mot_arbeidsplan, prosjektkode_gyldig, overtid_flagget]
  v_prosjekt:
    beskrivelse: "M-25 prosjekt- og kontraktstatus"
    betrodd_for: [milepael_dokumentert, kontraktsfestet_betalingsplan,
                  prosjektbudsjett_ok, arbeid_dokumentert, befaring_dokumentert]
  v_register:
    beskrivelse: "M-24 leverandørregister"
    betrodd_for: [leverandor_i_register, pris_innen_avtale, orgnr_validert,
                  mva_registrert, hms_kort_dokumentert, forsikring_dokumentert]
  v_bank:
    beskrivelse: "M-42 kontoverifikasjon via uavhengig kanal"
    betrodd_for: [konto_verifisert_uavhengig]
  v_svindel:
    beskrivelse: "M-42 transaksjonsvakt"
    betrodd_for: [svindelsjekk_bestatt, faktura_godkjent]
  v_prisbok:
    beskrivelse: "M-26 prisbok og standardforbehold"
    betrodd_for: [priser_fra_prisbok, standard_forbehold_inkludert]

handlinger:
  - id: timeliste.samle_og_valider
    modul: M-39
    modus: auto
    ved_brudd: unntakskø
    tillatt_for: [agent]
    dataklasser_tillatt: [persondata, finansiell]
    vilkaar:
      - {navn: timer_mot_arbeidsplan, verifikator: v_lonn}
      - {navn: prosjektkode_gyldig, verifikator: v_lonn}
      - {navn: overtid_flagget, verifikator: v_lonn}
    reversering: {type: direkte}

  - id: faktura.delfakturer_prosjekt
    modul: M-23
    modus: auto
    ved_brudd: unntakskø
    tillatt_for: [agent]
    dataklasser_tillatt: [finansiell]
    vilkaar:
      - {navn: milepael_dokumentert, verifikator: v_prosjekt}
      - {navn: kontraktsfestet_betalingsplan, verifikator: v_prosjekt}
    reversering: {type: kompenserende, handling: faktura.krediter}

  - id: materiell.bestill
    modul: M-27
    modus: auto
    ved_brudd: unntakskø
    tillatt_for: [agent]
    dataklasser_tillatt: [intern, finansiell]
    grenser:
      belop_maks: "30000.00"
      valuta: [NOK]
      tidsvindu: "man-fre 06:00-18:00"
    vilkaar:
      - {navn: leverandor_i_register, verifikator: v_register}
      - {navn: pris_innen_avtale, verifikator: v_register}
      - {navn: prosjektbudsjett_ok, verifikator: v_prosjekt}
    reversering: {type: kompenserende, handling: materiell.kanseller,
                  frist_sekunder: 43200}

  - id: underleverandor.onboard
    modul: M-24
    modus: auto_med_vilkaar
    ved_brudd: unntakskø
    tillatt_for: [agent]
    dataklasser_tillatt: [intern, finansiell, persondata]
    vilkaar:
      - {navn: orgnr_validert, verifikator: v_register}
      - {navn: mva_registrert, verifikator: v_register}
      - {navn: konto_verifisert_uavhengig, verifikator: v_bank}
      - {navn: hms_kort_dokumentert, verifikator: v_register}
      - {navn: forsikring_dokumentert, verifikator: v_register}
    reversering: {type: direkte}

  - id: underleverandor.betal
    modul: M-24
    modus: auto
    ved_brudd: frys
    tillatt_for: [agent]
    dataklasser_tillatt: [finansiell]
    grenser: {belop_maks: "25000.00", valuta: [NOK]}
    vilkaar:
      - {navn: faktura_godkjent, verifikator: v_svindel}
      - {navn: arbeid_dokumentert, verifikator: v_prosjekt}
      - {navn: svindelsjekk_bestatt, verifikator: v_svindel}
    reversering: {type: irreversibel}

  - id: tilbud.generer_standardjobb
    modul: M-26
    modus: auto
    ved_brudd: unntakskø
    tillatt_for: [agent]
    dataklasser_tillatt: [offentlig, intern, finansiell]
    grenser: {belop_maks: "100000.00", valuta: [NOK]}
    vilkaar:
      - {navn: priser_fra_prisbok, verifikator: v_prisbok}
      - {navn: standard_forbehold_inkludert, verifikator: v_prisbok}
      - {navn: befaring_dokumentert, verifikator: v_prosjekt}
    reversering: {type: direkte}

  - id: endringsordre.opprett
    modul: M-25
    modus: alltid_stopp
    ved_brudd: unntakskø
    reversering: {type: direkte}

frister:
  - {id: mva_melding, kilde: "Skatteetaten", frekvens: "6 terminer/år",
     varsling_dager_for: [30, 14, 7, 1]}
  - {id: a_melding, kilde: "Skatteetaten", frekvens: "månedlig, den 5.",
     varsling_dager_for: [7, 3, 1]}
  - {id: forsikring_fornyelse, kilde: "intern", frekvens: "årlig",
     varsling_dager_for: [60, 30, 14]}
  - {id: sertifikat_utlop, kilde: "intern (sentral godkjenning m.m.)",
     frekvens: "varierer", varsling_dager_for: [90, 30, 14]}

retention:
  - {dataklasse: finansiell, aar_min: 5, sletting: aldri_automatisk_for_frist}
  - {dataklasse: persondata, regel: formaalsbegrenset}
  - {dataklasse: intern, regel: "prosjektdokumentasjon følger reklamasjonstid"}

unntak:
  kategorier: [manglende_data, over_grense, ukjent_motpart, hms_avvik,
               regelkonflikt, teknisk_feil, ugyldig_data, ukjent]
  maks_auto_forsok: 3
  eskalering: unntakskø
