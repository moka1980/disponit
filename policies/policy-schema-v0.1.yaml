# ============================================================
# AI BEDRIFTSAGENT · POLICY-SKJEMA v0.1
# ============================================================
# Dette er det GENERISKE formatet som policymotoren (M-1) leser.
# Skjemaet er likt for alle bedrifter. Bransjemalene og hver
# kundes egen policy er DATA som instansierer dette skjemaet.
#
# Designprinsipper (fra prototype v7):
#   1. Standard er INGEN skrivetilgang — alt må gis eksplisitt.
#   2. Konflikt mellom regler gir alltid STOPP, aldri gjetting.
#   3. Hver handling utenfor policy -> unntakskø (M-37) med full kontekst.
#   4. Alle beslutninger logges med policy-ID og begrunnelse (M-2).
# ============================================================

schema_version: "0.1"

meta:
  bedrift: ""                 # Fylles per kunde
  bransjemal: ""              # Hvilken mal denne policyen startet fra
  kilder: []                  # URL-er / lovhenvisninger regler bygger på
  status: utkast              # utkast | validert_pilot | produksjon
  sist_endret: ""
  endret_av: ""               # Policy-endringer er selv policystyrte handlinger

# ------------------------------------------------------------
# ROLLER — hvem finnes, og hva er deres fullmaktsnivå
# ------------------------------------------------------------
roller:
  - id: daglig_leder
    beskrivelse: ""
  - id: okonomiansvarlig
    beskrivelse: ""
  - id: ansatt
    beskrivelse: ""
  - id: agent                 # AI-agentene har egen rolle med MINSTE privilegium
    beskrivelse: "Automatiserte handlinger. Arver aldri menneskeroller."

# ------------------------------------------------------------
# DATAKLASSER — styrer hvilke modeller/handlinger som er lov (M-38)
# ------------------------------------------------------------
dataklasser:
  - id: offentlig
  - id: intern
  - id: persondata            # GDPR: feltpolicy, maskering i logg (M-2)
  - id: sensitiv              # F.eks. helse, fagforening — strengeste ruting
  - id: finansiell

# ------------------------------------------------------------
# HANDLINGER — kjernen i skjemaet.
# Hver handling en agent kan utføre, må være definert her.
# Udefinert handling == forbudt (deny by default).
# ------------------------------------------------------------
handlinger:
  - id: ""                    # F.eks. "faktura.bokfor", "epost.send"
    modul: ""                 # Hvilken v7-modul som utfører (M-6, M-14, ...)
    tillatt_for: []           # Roller som kan utløse handlingen
    modus: auto               # auto | auto_med_vilkaar | alltid_stopp
    grenser:
      belop_maks: null        # Beløpsgrense i NOK (null = ingen)
      valuta: [NOK]
      frekvens_maks: null     # F.eks. maks antall per mottaker per uke
      tidsvindu: null         # F.eks. "man-fre 06:00-20:00"
    vilkaar: []               # Maskinelt sjekkbare krav FØR utførelse,
                              # f.eks. dublettsjekk, po_match, samtykke_gyldig
    dataklasser_tillatt: []   # Hvilke dataklasser handlingen kan berøre
    ved_brudd: unntakskø      # unntakskø | stopp_og_varsle | frys
    reversibel: true          # M-37-krav: kan handlingen rulles tilbake?

# ------------------------------------------------------------
# VERIFIKASJONER — uavhengige kontroller som ALDRI kan hoppes over
# ------------------------------------------------------------
verifikasjoner:
  bankkontoendring:
    metode: uavhengig_kanal   # M-42: aldri godta endring fra samme kanal
    obligatorisk: true
  ny_epostmottaker:
    metode: policy_sjekk      # M-6: nye mottakere krever eksplisitt regel
    obligatorisk: true
  livssyklushendelse:
    metode: hris_verifisert   # M-12: kun verifiserte start/slutt-hendelser
    obligatorisk: true

# ------------------------------------------------------------
# FRISTER — offentlige og interne (mates til M-21)
# ------------------------------------------------------------
frister:
  - id: ""                    # F.eks. "mva_termin", "a_melding"
    kilde: ""                 # Lovhenvisning eller intern regel
    frekvens: ""              # F.eks. "annenhver måned", "månedlig 5."
    varsling_dager_for: [30, 14, 7, 1]

# ------------------------------------------------------------
# RETENTION — hva lagres hvor lenge (M-2, M-4, M-30)
# ------------------------------------------------------------
retention:
  - dataklasse: finansiell
    aar_min: 5                # NB: verifiser mot bokføringsloven per kunde
    sletting: aldri_automatisk_for_frist
  - dataklasse: persondata
    regel: formaalsbegrenset  # Slettes når formålet opphører (GDPR art. 5)

# ------------------------------------------------------------
# UNNTAK — hvordan M-37 skal klassifisere det som stoppes
# ------------------------------------------------------------
unntak:
  kategorier: [manglende_data, over_grense, ukjent_motpart,
               regelkonflikt, teknisk_feil, ukjent]
  maks_auto_forsok: 3
  eskalering: unntakskø       # Alltid kø — aldri stille forkasting
