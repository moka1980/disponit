# CI — port 2 i utrullingsløypen (v7.2). Rød CI = merge umulig.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL i CI, ikke bare på staging. Uten den hopper DB-testene
    # over, og da dekker merge-port 1 ikke ADR-001s bindende krav i det
    # hele tatt: nettopp de negative testene som beviser atomisk
    # reservasjon og samme-transaksjon ville aldri kjørt før merge.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # To roller, som i staging: runtime eier ingenting og kan derfor ikke
      # skru av sine egne append-only-triggere eller RLS-policyer.
      # Superbrukeren brukes KUN til oppsett — den omgaar RLS og ville
      # gjort tenant-testene meningsløse.
      DISPONIT_TEST_DSN: postgresql://disponit:kjor@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_MIGRATOR_DSN: postgresql://disponit_migrator:mig@127.0.0.1:5432/disponit_test
      # Token-admin er en TREDJE rolle (PR-005b korreksjon 2). Uten den i CI
      # kan rolleskillet ikke bevises der det betyr noe: at den kan
      # administrere tokens og likevel ikke lese secret_mac eller kalle
      # verifiser_token.
      DISPONIT_TEST_TOKEN_ADMIN_DSN: postgresql://disponit_token_admin:tok@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_VARSEL_DSN: postgresql://disponit_varselsender:var@127.0.0.1:5432/disponit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Installer avhengigheter
        run: |
          pip install pytest pyyaml jsonschema "psycopg[binary]" cryptography starlette uvicorn httpx "authlib>=1.6,<2" joserfc
          # Norskporten er fail-closed: uten wordfreq er den PERMANENT rød,
          # og en port som alltid feiler blir en port noen slår av.
          pip install -r requirements-dev.txt
      - name: "Port: norsk uten ASCII-normalisering i sannhetskilden"
        run: |
          python prototype/sjekk_norsk.py --selftest
          python prototype/sjekk_norsk.py docs/spesifikasjon/disponit-prototype-v8.html
      - name: "Databaseroller (speiler deploy/staging/oppsett-postgresql.sh)"
        env: {PGPASSWORD: postgres}
        run: |
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit LOGIN PASSWORD 'kjor'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_migrator LOGIN PASSWORD 'mig'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_authenticator NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_token_admin LOGIN PASSWORD 'tok'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_varselsender LOGIN PASSWORD 'var'"
          # PR-006: NOLOGIN-eieren av arbeidskapabiliteter og claim-funksjonene.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_m37_claimer NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_authenticator TO disponit_migrator"
          # WITH INHERIT FALSE: medlemskap for OWNER TO, men ingen ARVEDE
          # rettigheter. RLS-policyer med TO-klausul matcher paa arvet
          # medlemskap, saa et vanlig GRANT ville gitt migrator
          # M-37-dispatcherens policy paa revisjonslogg og unntak — altsaa
          # alle tenanters rader, som er Codex' P1 nr. 2 fra PR-004 igjen.
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_m37_claimer TO disponit_migrator WITH INHERIT FALSE"
          # PR-013: NOLOGIN-eieren av den herdede `aktiver_policy`-funksjonen.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_policy_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_policy_eier TO disponit_migrator WITH INHERIT FALSE"
          # PR-014a: NOLOGIN-eieren av modulregisterets overgangsfunksjoner, og
          # admin-rollen som får EXECUTE på dem (ikke direkte DML).
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_modul_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_modul_eier TO disponit_migrator WITH INHERIT FALSE"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_modules_admin NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_modules_admin TO disponit_migrator WITH INHERIT FALSE"
          # PR-014b: egress-tjenesterollen (LOGIN, SELECT kun paa visningen),
          # NOLOGIN-eieren av domene/artefakt-funksjonene (BYPASSRLS: takeover er
          # iboende kryss-tenant og maa se andre tenanters domenekontroll-rader
          # via hostname_binding-autoriteten), og admin-rollen med EXECUTE.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_egress LOGIN PASSWORD 'egr'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_domene_eier NOLOGIN BYPASSRLS"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_domene_eier TO disponit_migrator WITH INHERIT FALSE"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_domains_admin NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_domains_admin TO disponit_migrator WITH INHERIT FALSE"
          createdb -h 127.0.0.1 -U postgres -O disponit_migrator disponit_test
          psql -h 127.0.0.1 -U postgres -d disponit_test -qtAc "ALTER SCHEMA public OWNER TO disponit_migrator"
          psql -h 127.0.0.1 -U postgres -d disponit_test -qtAc "GRANT USAGE, CREATE ON SCHEMA public TO disponit_authenticator"
          psql -h 127.0.0.1 -U postgres -d disponit_test -qtAc "GRANT USAGE, CREATE ON SCHEMA public TO disponit_m37_claimer"
          psql -h 127.0.0.1 -U postgres -d disponit_test -qtAc "GRANT USAGE, CREATE ON SCHEMA public TO disponit_policy_eier"
          psql -h 127.0.0.1 -U postgres -d disponit_test -qtAc "GRANT USAGE, CREATE ON SCHEMA public TO disponit_modul_eier"
          psql -h 127.0.0.1 -U postgres -d disponit_test -qtAc "GRANT USAGE, CREATE ON SCHEMA public TO disponit_domene_eier"
          # GO-vilkaar V3: event-triggeren som hindrer at retention-vakten
          # DEAKTIVERES. Den kan bare lages av superbruker — derfor her og
          # ikke i en migrasjon, noeyaktig som rollene. CI maa speile
          # staging, ellers testes en annen base enn den som driftes.
          psql -h 127.0.0.1 -U postgres -d disponit_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION disponit_vern_policy_retention()
          RETURNS event_trigger LANGUAGE plpgsql AS $$
          DECLARE v_status "char";
          BEGIN
              IF to_regclass('public.policyer') IS NULL THEN
                  RETURN;
              END IF;
              SELECT t.tgenabled INTO v_status FROM pg_trigger t
               WHERE t.tgrelid = 'public.policyer'::regclass
                 AND t.tgname = 'policy_retention';
              IF FOUND AND v_status = 'D' THEN
                  RAISE EXCEPTION 'policy_retention er deaktivert — GO-vilkaar V3 forbyr det, ogsaa for migratorrollen.';
              END IF;
          END $$;
          DROP EVENT TRIGGER IF EXISTS disponit_policy_retention_vern;
          CREATE EVENT TRIGGER disponit_policy_retention_vern
              ON ddl_command_end WHEN TAG IN ('ALTER TABLE')
              EXECUTE FUNCTION disponit_vern_policy_retention();
          SQL
          # Migrasjoner kjøres av den HERDEDE KJØREREN, ikke med psql -f.
          # Codex' P1: psql omgår advisory-lås, kjørerens transaksjon,
          # checksum-registrering og avvisning av endret historikk — og da
          # tester CI en annen vei enn den staging og produksjon bruker.
          DISPONIT_MIGRATOR_URL="postgresql://disponit_migrator:mig@127.0.0.1:5432/disponit_test" \
            python deploy/staging/migrer.py disponit
      - name: Enhetstester + negative policytester
        run: python -m pytest platform/core/tests -q
      - name: "Port: ingen DB-tester ble hoppet over"
        # En hoppet test er ikke en bestått test. Feiler hvis DSN mangler
        # eller pg-markerte tester skippes.
        run: |
          python -m pytest platform/core/tests -q -rs 2>&1 | tee /tmp/ut.txt
          if grep -qiE "skipped" /tmp/ut.txt; then
            echo "::error::Tester ble hoppet over i CI — DB-portene er da ikke bevist."
            grep -iE "skipped|SKIPPED" /tmp/ut.txt
            exit 1
          fi
      - name: Skjemavalidering av alle policyer og bransjemaler
        run: |
          python - << 'PY'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, "platform/core")
          from policy_validator.schema import valider_policy
          feil = []
          for f in Path("policies").glob("bransjemal-*.yaml"):
              e = valider_policy(yaml.safe_load(f.read_text()))
              if e: feil.append((f.name, e))
          if feil: print(feil); sys.exit(1)
          print("alle policyer gyldige")
          PY
      - name: "Manifestskjema (v2 Del 7): alle manifester validerer"
        # Uten dette er staging-sjekklisten fritekst, og et `nei` kan bli et
        # `ja` uten at noen port merker det. Skjemaet krever i tillegg at et
        # `ja` med krav_id peker paa et artefakt — manifestfeltet er aldri
        # selv beviset (v2 Del 6).
        run: |
          python - << 'PY'
          import sys
          sys.path.insert(0, "platform/core")
          from pathlib import Path
          from manifestskjema import (aktiv_uten_bevis, valider_alle,
                                      valider_artefakter)
          import yaml
          feil = {n: f for n, f in valider_alle(Path("platform/modules")).items() if f}
          if feil:
              print(feil); sys.exit(1)
          for fil in Path("platform/modules").glob("*/manifest.yaml"):
              m = yaml.safe_load(fil.read_text(encoding="utf-8"))
              uten = aktiv_uten_bevis(m)
              if uten:
                  print(f"{fil}: status=aktiv med uavklarte punkter {uten}")
                  sys.exit(1)
              # Evidenskjeden: aapne artefaktet, verifiser sha256 mot
              # innholdet og maal tallene mot KRAVGRENSER. Uten dette er
              # `artefakt` bare en streng, og `bestatt: true` inne i
              # artefaktet er produsentens egen paastand.
              brudd = valider_artefakter(m, rot=Path("."))
              if brudd:
                  print(f"::error::{fil}: evidenskjeden holder ikke")
                  for b in brudd:
                      print(f"  - {b}")
                  sys.exit(1)
          print("alle manifester gyldige, artefakter verifisert")
          PY

      - name: Modulregister konsistent
        run: |
          python - << 'PY'
          import sys
          sys.path.insert(0, "platform/core")
          from pathlib import Path
          from registry import les_manifester, valider
          s = valider(les_manifester(Path("platform/modules")))
          if s.feil: print(s.feil); sys.exit(1)
          print("register ok:", s.aktive or "(ingen aktive ennå)", s.inaktive)
          PY
      - name: "Syntetisk kjøring (invariant: blokkert blir aldri TILLAT)"
        run: python platform/core/examples/run_synthetic.py
      - name: "UI-kontrakt (V1): backend leverer feltene M-1-flaten leser"
        run: python -m pytest platform/core/tests/test_ui_kontrakt.py -q
      # Styringskjeden ende-til-ende på en FERSK, normalt bootstrappet tenant.
      # Enhetstestene var grønne gjennom hele august mens fire defekter i
      # nettopp denne kjeden nådde produksjon — de målte deler, ikke bruk.
      # Rundturen går hele veien til terminaltilstand, inkludert at den
      # aktiverte policyen faktisk kan HENTES etterpå.
      - name: "Policy-rundtur: bootstrap → fire øyne → aktivering → bruk"
        env:
          DISPONIT_REPO: ${{ github.workspace }}
        run: python deploy/staging/policy-rundtur.py

  # PR-011: M-1 kundeflate — egen node-jobb. axe-core + komponent-/flate-/
  # kontraktstester (gate 1/6/7/9/10/11 + no-hardkodet-tekst + V3). WCAG-
  # porten som PR-005-kommentaren lovet, nå som UI-et finnes.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Installer UI-avhengigheter
        working-directory: platform/core/ui
        run: npm ci
      - name: "UI: axe + komponent-/flate-/kontraktstester (node --test)"
        working-directory: platform/core/ui
        run: npm test

  # PR-porten (RUTINER pkt. 8) som ERSTATNING for branch protection.
  # GitHub nekter branch protection på privat repo uten Pro, så regelen
  # «ingen direkte push til main» kan ikke blokkeres — den oppdages her i
  # stedet, høylytt og etterpå. Slettes den dagen ekte porter slås på.
  pr-porten:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: "Kom denne commiten inn via pull request?"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          antall=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            -H "Accept: application/vnd.github.groot-preview+json" --jq 'length')
          if [ "$antall" -eq 0 ]; then
            echo "::error::Direkte push til main. RUTINER pkt. 8 krever branch + PR + Codex-merge."
            echo "Commit $SHA har ingen tilhørende pull request."
            exit 1
          fi
          echo "OK — commiten kom via $antall pull request(er)."
