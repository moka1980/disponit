# CI — port 2 i utrullingsløypen (v7.2). Rød CI = merge umulig.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL i CI, ikke bare på staging. Uten den hopper DB-testene
    # over, og da dekker merge-port 1 ikke ADR-001s bindende krav i det
    # hele tatt: nettopp de negative testene som beviser atomisk
    # reservasjon og samme-transaksjon ville aldri kjørt før merge.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # To roller, som i staging: runtime eier ingenting og kan derfor ikke
      # skru av sine egne append-only-triggere eller RLS-policyer.
      # Superbrukeren brukes KUN til oppsett — den omgaar RLS og ville
      # gjort tenant-testene meningsløse.
      DISPONIT_TEST_DSN: postgresql://disponit:kjor@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_MIGRATOR_DSN: postgresql://disponit_migrator:mig@127.0.0.1:5432/disponit_test
      # Token-admin er en TREDJE rolle (PR-005b korreksjon 2). Uten den i CI
      # kan rolleskillet ikke bevises der det betyr noe: at den kan
      # administrere tokens og likevel ikke lese secret_mac eller kalle
      # verifiser_token.
      DISPONIT_TEST_TOKEN_ADMIN_DSN: postgresql://disponit_token_admin:tok@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_VARSEL_DSN: postgresql://disponit_varselsender:var@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_DRIFTSTATUS_DSN: postgresql://disponit_driftstatus:drift@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_SELVTEST_DSN: postgresql://disponit_selvtest:selv@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_KVALITETSMAALER_DSN: postgresql://disponit_kvalitetsmaaler:kval@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_LAGERMAALER_DSN: postgresql://disponit_lagermaaler:lagr@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_KUNNSKAPSSVEIP_DSN: postgresql://disponit_kunnskapssveip:kunn@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_TILGANGSSVEIP_DSN: postgresql://disponit_tilgangssveip:tilg@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_PERSONVERNSVEIP_DSN: postgresql://disponit_personvernsveip:pers@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_COMPLIANCESVEIP_DSN: postgresql://disponit_compliancesveip:comp@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_AVSTEMMINGSVEIP_DSN: postgresql://disponit_avstemmingssveip:avst@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_HENVENDELSESVEIP_DSN: postgresql://disponit_henvendelsessveip:henv@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_ONBOARDINGSVEIP_DSN: postgresql://disponit_onboardingsveip:onbo@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_FORDRINGSVEIP_DSN: postgresql://disponit_fordringssveip:ford@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_LEVERANDORSVEIP_DSN: postgresql://disponit_leverandorsveip:leve@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_FAKTURASVEIP_DSN: postgresql://disponit_fakturasveip:fakt@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_PROSJEKTSVEIP_DSN: postgresql://disponit_prosjektsveip:pros@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_PRISBOKSVEIP_DSN: postgresql://disponit_prisboksveip:pris@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_LAGERSVEIP_DSN: postgresql://disponit_lagersveip:lage@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_KONTOVAKTSVEIP_DSN: postgresql://disponit_kontovaktsveip:kont@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_BETALINGSSVEIP_DSN: postgresql://disponit_betalingssveip:beta@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_ADRESSESVEIP_DSN: postgresql://disponit_adressesveip:adre@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_LONNSSVEIP_DSN: postgresql://disponit_lonnssveip:lonn@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_KAMPANJESVEIP_DSN: postgresql://disponit_kampanjesveip:kamp@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_MOTPARTSSVEIP_DSN: postgresql://disponit_motpartssveip:motp@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_SANKSJONSSVEIP_DSN: postgresql://disponit_sanksjonssveip:sank@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_ANBUDSSVEIP_DSN: postgresql://disponit_anbudssveip:anbu@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_TILSKUDDSSVEIP_DSN: postgresql://disponit_tilskuddssveip:tils@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_MERKEVARESVEIP_DSN: postgresql://disponit_merkevaresveip:merk@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_EHFSVEIP_DSN: postgresql://disponit_ehfsveip:ehfs@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_TOLLKODESVEIP_DSN: postgresql://disponit_tollkodesveip:toll@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_MYNDIGHETSSVEIP_DSN: postgresql://disponit_myndighetssveip:mynd@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_POSTJOURNALSVEIP_DSN: postgresql://disponit_postjournalsveip:post@127.0.0.1:5432/disponit_test
      # 127 (M-53): HMS-sveipens EGEN DSN. Rollen ble opprettet av
      # klyngefundamentet; uten DSN-en faller testen tilbake til
      # migrator, som ikke har EXECUTE — og porten måler da ingenting.
      DISPONIT_TEST_HMSSVEIP_DSN: postgresql://disponit_hmssveip:hmss@127.0.0.1:5432/disponit_test
      # Klynge 8 (128-130). DSN-ene legges inn SAMMEN MED ROLLENE, og
      # det er lærdommen fra M-53: der ble rollen opprettet av klynge
      # 7s fundament, DSN-en aldri lagt til, og fem porter feilet i CI
      # etter å ha vært grønne lokalt — fordi testen falt tilbake til
      # migrator, som ikke har EXECUTE på sveipedøra. Rollen og
      # DSN-en hører sammen; å skille dem er å legge igjen en felle
      # til den som bygger modulen.
      DISPONIT_TEST_LIKVIDITETSSVEIP_DSN: postgresql://disponit_likviditetssveip:likv@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_PROGNOSESVEIP_DSN: postgresql://disponit_prognosesveip:prog@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_OPTIMALISATORSVEIP_DSN: postgresql://disponit_optimalisatorsveip:opti@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_PLAN_DSN: postgresql://disponit_plan_arbeider:pla@127.0.0.1:5432/disponit_test
      DISPONIT_TEST_VERIFIKATOR_DSN: postgresql://disponit_ci_verifikator:ver@127.0.0.1:5432/disponit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Installer avhengigheter
        run: |
          pip install pytest pyyaml jsonschema "psycopg[binary]" cryptography starlette uvicorn httpx "authlib>=1.6,<2" joserfc
          # Norskporten er fail-closed: uten wordfreq er den PERMANENT rød,
          # og en port som alltid feiler blir en port noen slår av.
          pip install -r requirements-dev.txt
      - name: "Port: norsk uten ASCII-normalisering i sannhetskilden"
        run: |
          python prototype/sjekk_norsk.py --selftest
          python prototype/sjekk_norsk.py docs/spesifikasjon/disponit-prototype-v9.html
      - name: "Databaseroller (speiler deploy/staging/oppsett-postgresql.sh)"
        env: {PGPASSWORD: postgres}
        run: |
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit LOGIN PASSWORD 'kjor'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_migrator LOGIN PASSWORD 'mig'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_authenticator NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_token_admin LOGIN PASSWORD 'tok'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_varselsender LOGIN PASSWORD 'var'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_plan_arbeider LOGIN PASSWORD 'pla'"
          # M-10/M-11 (090/091): driftstatus-ingesten og selvtesten har
          # hver sin smale innlogging — begge har KUN EXECUTE på sin ene
          # registreringsdør, aldri tabellrettigheter (varselsender-formen).
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_driftstatus LOGIN PASSWORD 'drift'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_selvtest LOGIN PASSWORD 'selv'"
          # KLYNGEN «orden i eget hus» (092-096). Rollene opprettes i
          # FUNDAMENTET, ikke med hver modul-PR: denne fila merges
          # normalt for hånd, og fem separate endringer i den er fem
          # sjanser til en rød CI som ikke handler om modulen som
          # landet. Tre målere med hver sin innlogging, fem eiere som
          # NOLOGIN — M-21 har ingen egen: fristsveipen er et forpass i
          # varselsenderen og kjører som disponit_varselsender.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kvalitetsmaaler LOGIN PASSWORD 'kval'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_lagermaaler LOGIN PASSWORD 'lagr'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kunnskapssveip LOGIN PASSWORD 'kunn'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kvalitet_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_lager_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_mal_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kunnskap_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_plikt_eier NOLOGIN"
          # KLYNGE 2 (097-100), samme forhåndsoppretting i fundamentet:
          # ci.yml merges normalt for hånd, og fire separate endringer i
          # den er fire sjanser til en rød CI som ikke handler om modulen
          # som landet. M-22 har ingen egen sveiperolle — utløpssveipen
          # er et forpass i varselsenderen.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_tilgangssveip LOGIN PASSWORD 'tilg'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_personvernsveip LOGIN PASSWORD 'pers'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_compliancesveip LOGIN PASSWORD 'comp'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_avstemmingssveip LOGIN PASSWORD 'avst'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_henvendelsessveip LOGIN PASSWORD 'henv'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_onboardingsveip LOGIN PASSWORD 'onbo'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_fordringssveip LOGIN PASSWORD 'ford'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_leverandorsveip LOGIN PASSWORD 'leve'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_tilgang_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_lisens_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_personvern_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_compliance_eier NOLOGIN"
          # KLYNGE 3 (101-105): fem eiere og fem sveipere, opprettet i ÉN
          # omgang av samme grunn som klynge 2 — ci.yml merges normalt
          # for hånd, og fem separate endringer i den er fem sjanser til
          # en rød CI som ikke handler om modulen som landet.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_avstemming_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kundeservice_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_onboarding_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_fordring_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_leverandor_eier NOLOGIN"
          # KLYNGE 4 (106-110): fem eiere og fem sveipere, opprettet i ÉN
          # omgang av samme grunn som klynge 2 og 3 — ci.yml merges
          # normalt for hånd, og fem separate endringer i den er fem
          # sjanser til en rød CI som ikke handler om modulen som landet.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_fakturasveip LOGIN PASSWORD 'fakt'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_prosjektsveip LOGIN PASSWORD 'pros'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_prisboksveip LOGIN PASSWORD 'pris'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_lagersveip LOGIN PASSWORD 'lage'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kontovaktsveip LOGIN PASSWORD 'kont'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_betalingssveip LOGIN PASSWORD 'beta'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_adressesveip LOGIN PASSWORD 'adre'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_lonnssveip LOGIN PASSWORD 'lonn'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kampanjesveip LOGIN PASSWORD 'kamp'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_motpartssveip LOGIN PASSWORD 'motp'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_sanksjonssveip LOGIN PASSWORD 'sank'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_anbudssveip LOGIN PASSWORD 'anbu'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_tilskuddssveip LOGIN PASSWORD 'tils'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_merkevaresveip LOGIN PASSWORD 'merk'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_ehfsveip LOGIN PASSWORD 'ehfs'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_tollkodesveip LOGIN PASSWORD 'toll'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_myndighetssveip LOGIN PASSWORD 'mynd'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_postjournalsveip LOGIN PASSWORD 'post'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_hmssveip LOGIN PASSWORD 'hmss'"
          # Klynge 8 (128-130): prognosene.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_likviditetssveip LOGIN PASSWORD 'likv'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_prognosesveip LOGIN PASSWORD 'prog'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_optimalisatorsveip LOGIN PASSWORD 'opti'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_faktura_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_prosjekt_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_prisbok_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_beholdning_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kontovakt_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_betaling_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_adresse_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_lonn_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_kampanje_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_motpart_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_sanksjon_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_anbud_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_tilskudd_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_merkevare_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_ehf_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_tollkode_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_myndighet_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_postjournal_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_hms_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_likviditet_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_prognose_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_optimalisator_eier NOLOGIN"
          # 049/#117: CI-attestens EGEN innlogging — SET til modul_eier,
          # aldri medlem av modules_admin: attestant og akseptør skal
          # være to identiteter (fire-øyne på akseptens forutsetning).
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_ci_verifikator LOGIN PASSWORD 'ver'"
          # PR-006: NOLOGIN-eieren av arbeidskapabiliteter og claim-funksjonene.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_m37_claimer NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_authenticator TO disponit_migrator"
          # WITH INHERIT FALSE: medlemskap for OWNER TO, men ingen ARVEDE
          # rettigheter. RLS-policyer med TO-klausul matcher paa arvet
          # medlemskap, saa et vanlig GRANT ville gitt migrator
          # M-37-dispatcherens policy paa revisjonslogg og unntak — altsaa
          # alle tenanters rader, som er Codex' P1 nr. 2 fra PR-004 igjen.
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_m37_claimer TO disponit_migrator WITH INHERIT FALSE"
          # PR-013: NOLOGIN-eieren av den herdede `aktiver_policy`-funksjonen.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_policy_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_policy_eier TO disponit_migrator WITH INHERIT FALSE"
          # PR-014a: NOLOGIN-eieren av modulregisterets overgangsfunksjoner, og
          # admin-rollen som får EXECUTE på dem (ikke direkte DML).
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_modul_eier NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_modul_eier TO disponit_migrator WITH INHERIT FALSE"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_modul_eier TO disponit_ci_verifikator WITH INHERIT FALSE"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_modules_admin NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_modules_admin TO disponit_migrator WITH INHERIT FALSE"
          # PR-014b: egress-tjenesterollen (LOGIN, SELECT kun paa visningen),
          # NOLOGIN-eieren av domene/artefakt-funksjonene (BYPASSRLS: takeover er
          # iboende kryss-tenant og maa se andre tenanters domenekontroll-rader
          # via hostname_binding-autoriteten), og admin-rollen med EXECUTE.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_egress LOGIN PASSWORD 'egr'"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_domene_eier NOLOGIN BYPASSRLS"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_domene_eier TO disponit_migrator WITH INHERIT FALSE"
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_domains_admin NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_domains_admin TO disponit_migrator WITH INHERIT FALSE"
          # 041: adjudikatorrollen — NOLOGIN, KUN policy-avgrenset SELECT.
          # Runtime faar SET (aldri arv); migrator faar medlemskap saa
          # rebuilds og negative rolletester kan SET ROLE til den.
          psql -h 127.0.0.1 -U postgres -qtAc "CREATE ROLE disponit_domains_adjudicator NOLOGIN"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_domains_adjudicator TO disponit_migrator WITH INHERIT FALSE"
          psql -h 127.0.0.1 -U postgres -qtAc "GRANT disponit_domains_adjudicator TO disponit WITH INHERIT FALSE, SET TRUE"
